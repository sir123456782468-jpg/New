<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم - The Leader In English</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1120;--card:#131c31;--ink:#f1f5f9;--muted:#94a3b8;--line:#22304d;--brand:#ef4444;--grad:linear-gradient(135deg,#ef4444,#ec4899);--ok:#22c55e}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px}
.box h2{margin:6px 0 4px}.box p{color:var(--muted);font-size:14px;margin-bottom:16px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}textarea{resize:vertical;min-height:70px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.btn{border:none;border-radius:12px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;background:var(--grad);color:#fff;transition:.2s}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:wait}
.btn.g{background:none;border:1px solid var(--line);color:var(--ink)}.btn.r{background:#dc2626}.btn.s{padding:6px 12px;font-size:12.5px}
.app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:var(--card);border-left:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:900;font-size:17px;padding:4px 10px 16px;color:var(--brand)}.logo small{display:block;color:var(--muted);font-size:11px;font-weight:700}
.side a{display:flex;gap:10px;padding:11px 12px;margin-bottom:4px;border-radius:12px;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer}
.side a:hover{background:var(--bg)}.side a.on{background:var(--grad);color:#fff}.side a.off{opacity:.45;cursor:not-allowed}.side a small{margin-right:auto;font-size:10px}
.main{flex:1;min-width:0;padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}.top h1{font-size:24px;font-weight:900}.top span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.stat b{display:block;font-size:30px;color:var(--brand)}.stat span{color:var(--muted);font-size:13px;font-weight:700}
.cc{padding:0;overflow:hidden}.cc .th{height:110px;background:var(--grad) center/cover;display:grid;place-items:center;font-size:40px}
.cc .bd{padding:14px}.cc h4{font-size:15px;margin-bottom:4px}.cc small{color:var(--muted);font-weight:600}.cc .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:50px;font-size:11.5px;font-weight:800;background:var(--line)}.pill.ok{background:rgba(34,197,94,.2);color:var(--ok)}.pill.no{background:rgba(220,38,38,.2);color:#f87171}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.bar input,.bar select{width:auto;min-width:170px;flex:1}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:18px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(2,6,23,.75);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.mbox{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}.mbox h3{margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700}.chk input{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips span{background:var(--bg);border:1px solid var(--line);border-radius:50px;padding:4px 12px;font-size:12.5px;font-weight:700}.chips b{cursor:pointer;color:#f87171;margin-right:6px}
.empty{text-align:center;color:var(--muted);padding:40px;font-weight:700}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:8px}.toast{background:#1e293b;border:1px solid var(--line);padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px}.toast.bad{background:#7f1d1d}
@media(max-width:800px){.side{position:fixed;bottom:0;top:auto;height:auto;width:100%;display:flex;overflow-x:auto;z-index:40;border:0;border-top:1px solid var(--line);padding:6px}.side .logo,.side a.off{display:none}.side a{flex:none;margin:0 2px}.main{padding:16px 12px 80px}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="center" id="login" hidden><form class="box" id="lf">
  <div style="font-size:42px">🔐</div><h2>لوحة التحكم</h2><p>دخول المسؤولين فقط.</p>
  <label>البريد الإلكتروني</label><input type="email" id="le" required dir="ltr">
  <label>كلمة المرور</label><input type="password" id="lp" required>
  <button class="btn" style="width:100%;margin-top:18px" id="lb">دخول</button><p id="lm" style="color:#f87171;margin:12px 0 0"></p>
</form></div>

<div class="app" id="app" hidden>
  <aside class="side"><div class="logo">The Leader In English<small>لوحة التحكم</small></div><nav id="nav"></nav></aside>
  <main class="main"><div class="top"><h1 id="title"></h1><span id="who"></span></div><div id="view"></div></main>
</div>
<div class="modal" id="modal" hidden><div class="mbox"><h3 id="mt"></h3><div id="mb"></div></div></div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://cxtmvsoxgfsormhcklfx.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const YEARS = ['أولى إعدادي','ثانية إعدادي','ثالثة إعدادي','أولى ثانوي','ثانية ثانوي','ثالثة ثانوي'];
const S = { courses: [], students: null, enr: null };
const NAV = [['overview','📊','نظرة عامة'],['courses','📚','الكورسات'],['students','👥','الطلاب'],['codes','🎟️','الأكواد'],['exams','📝','الامتحانات'],['ann','📢','الإعلانات'],['devices','💻','الأجهزة'],['admins','🛡️','المسؤولون']];

function toast(m, bad) { const e = document.createElement('div'); e.className = 'toast' + (bad ? ' bad' : ''); e.textContent = m; $('#toasts').appendChild(e); setTimeout(() => e.remove(), 3500); }
function fail(e) { console.error(e); toast('حدث خطأ: ' + (e.message || e), true); }
function modal(title, html, onSubmit) {
  $('#mt').textContent = title; $('#mb').innerHTML = html; $('#modal').hidden = false;
  const f = $('#mb form'); if (f && onSubmit) f.addEventListener('submit', async e => { e.preventDefault(); const b = f.querySelector('button.btn'); b.disabled = true; try { await onSubmit(new FormData(f)); closeModal(); } catch (x) { fail(x); b.disabled = false; } });
}
function closeModal() { $('#modal').hidden = true; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
const yopts = v => YEARS.map(y => '<option' + (y === v ? ' selected' : '') + '>' + y + '</option>').join('');
const copt = () => S.courses.map(c => '<option value="' + c.id + '">' + esc(c.title) + ' — ' + c.academic_year + '</option>').join('');
const fname = p => [p.first_name, p.middle_name, p.last_name].join(' ');
const fdate = d => new Date(d).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });

// ===== الدخول والحماية (أدمن فقط) =====
async function gate() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return showLogin();
  const { data: ok } = await sb.rpc('is_admin');
  if (ok !== true) { await sb.auth.signOut({ scope: 'local' }); return showLogin('هذا الحساب لا يملك صلاحية الإدارة.'); }
  $('#login').hidden = true; $('#app').hidden = false; $('#who').textContent = data.session.user.email;
  $('#nav').innerHTML = NAV.map(n => n[0].startsWith('x') ? '<a class="off">' + n[1] + ' ' + n[2] + '<small>قريباً</small></a>' : '<a data-go="' + n[0] + '">' + n[1] + ' ' + n[2] + '</a>').join('');
  await loadCourses(); go('overview');
}
function showLogin(msg) { $('#app').hidden = true; $('#login').hidden = false; $('#lm').textContent = msg || ''; }
$('#lf').addEventListener('submit', async e => {
  e.preventDefault(); $('#lb').disabled = true; $('#lm').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#le').value.trim().toLowerCase(), password: $('#lp').value });
  $('#lb').disabled = false;
  if (error) { $('#lm').textContent = 'بيانات الدخول غير صحيحة.'; return; }
  gate();
});
async function loadCourses() { const { data, error } = await sb.from('courses').select('*').order('academic_year').order('sort_order'); if (error) throw error; S.courses = data; }
async function loadStudents() {
  if (S.students) return;
  const [a, b] = await Promise.all([sb.from('profiles').select('*').order('created_at', { ascending: false }).limit(2000), sb.from('enrollments').select('student_id,course_id')]);
  if (a.error) throw a.error; S.students = a.data; S.enr = b.data || [];
}

// ===== التنقل =====
const VIEWS = { overview: ['نظرة عامة', vOverview], courses: ['الكورسات', vCourses], students: ['الطلاب', vStudents], codes: ['أكواد التفعيل', vCodes] };
async function go(v, arg) {
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.go === v));
  $('#title').textContent = VIEWS[v][0]; $('#view').innerHTML = '<div class="empty">جاري التحميل...</div>';
  try { $('#view').innerHTML = await VIEWS[v][1](arg); } catch (e) { fail(e); $('#view').innerHTML = '<div class="empty">تعذر التحميل</div>'; }
}
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const a = e.target.closest('[data-act]'); if (!a) return;
  try { await ACT[a.dataset.act](a.dataset.id, a); } catch (x) { fail(x); }
});

// ===== نظرة عامة =====
async function vOverview() {
  await loadStudents();
  const cd = await sb.from('activation_codes').select('id', { count: 'exact', head: true }).is('used_by', null);
  const by = {}; S.students.forEach(s => by[s.academic_year] = (by[s.academic_year] || 0) + 1);
  const pub = S.courses.filter(c => c.is_published).length;
  return '<div class="grid">' + [[S.students.length, 'إجمالي الطلاب'], [S.courses.length + ' (' + pub + ' منشور)', 'الكورسات'], [S.enr.length, 'إجمالي الاشتراكات'], [cd.count || 0, 'أكواد غير مستخدمة']].map(x => '<div class="card stat"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>').join('') + '</div>'
    + '<h3 style="margin:22px 0 12px">الطلاب حسب الصف</h3><div class="grid">' + YEARS.map(y => '<div class="card stat"><b>' + (by[y] || 0) + '</b><span>' + y + '</span></div>').join('') + '</div>';
}

// ===== الكورسات =====
async function vCourses() {
  await loadCourses();
  const list = S.courses.map(c => '<div class="card cc"><div class="th"' + (c.thumbnail_url ? ' style="background-image:url(\'' + esc(c.thumbnail_url) + '\')"' : '') + '>' + (c.thumbnail_url ? '' : '📚') + '</div><div class="bd"><h4>' + esc(c.title) + '</h4><small>' + c.academic_year + ' • ' + (Number(c.price) ? c.price + ' ج.م' : 'مجاني') + '</small><br><span class="pill ' + (c.is_published ? 'ok' : 'no') + '">' + (c.is_published ? 'منشور' : 'مخفي') + '</span>'
    + '<div class="ac"><button class="btn s" data-act="lessons" data-id="' + c.id + '">الدروس</button><button class="btn s g" data-act="editCourse" data-id="' + c.id + '">تعديل</button><button class="btn s g" data-act="togglePub" data-id="' + c.id + '">' + (c.is_published ? 'إخفاء' : 'نشر') + '</button><button class="btn s r" data-act="delCourse" data-id="' + c.id + '">حذف</button></div></div></div>').join('');
  return '<div class="bar"><button class="btn" data-act="newCourse">+ كورس جديد</button></div><div class="grid">' + (list || '<div class="empty" style="grid-column:1/-1">لا توجد كورسات بعد. اضغط "كورس جديد".</div>') + '</div>';
}
function courseForm(c) {
  c = c || {};
  modal(c.id ? 'تعديل الكورس' : 'كورس جديد', '<form><label>اسم الكورس</label><input name="title" required value="' + esc(c.title) + '"><label>الوصف</label><textarea name="description">' + esc(c.description) + '</textarea>'
    + '<div class="row2"><div><label>السنة الدراسية</label><select name="year">' + yopts(c.academic_year) + '</select></div><div><label>السعر (0 = مجاني)</label><input type="number" name="price" min="0" step="0.01" value="' + (c.price || 0) + '"></div></div>'
    + '<div class="row2"><div><label>الترتيب</label><input type="number" name="sort" value="' + (c.sort_order || 0) + '"></div><div><label>صورة الكورس</label><input type="file" name="thumb" accept="image/*"></div></div>'
    + '<label class="chk"><input type="checkbox" name="pub"' + (c.is_published ? ' checked' : '') + '> نشر الكورس للطلاب</label><button class="btn" style="width:100%;margin-top:16px">حفظ</button></form>',
    async f => {
      const row = { title: f.get('title').trim(), description: f.get('description').trim() || null, academic_year: f.get('year'), price: +f.get('price') || 0, sort_order: +f.get('sort') || 0, is_published: f.get('pub') === 'on' };
      const file = f.get('thumb');
      if (file && file.size) {
        const path = 'thumbs/' + crypto.randomUUID() + '.' + file.name.split('.').pop().toLowerCase();
        const up = await sb.storage.from('course-media').upload(path, file, { contentType: file.type }); if (up.error) throw up.error;
        row.thumbnail_url = sb.storage.from('course-media').getPublicUrl(path).data.publicUrl;
      }
      const { error } = await (c.id ? sb.from('courses').update(row).eq('id', c.id) : sb.from('courses').insert(row)); if (error) throw error;
      toast('تم الحفظ ✅'); go('courses');
    });
}

// ===== الدروس =====
VIEWS.lessons = ['دروس الكورس', vLessons];
const ytNorm = v => { v = (v || '').trim(); if (!v) return null; const m = v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || v.match(/^([\w-]{11})$/); return m ? 'https://www.youtube.com/watch?v=' + m[1] : (/^https:\/\//.test(v) ? v : null); };
async function vLessons(cid) {
  const c = S.courses.find(x => x.id === cid);
  const { data, error } = await sb.from('lessons').select('*,lesson_content(video_url,notes,attachment_path)').eq('course_id', cid).order('position'); if (error) throw error;
  const rows = data.map(l => { const lc = [].concat(l.lesson_content || [])[0] || {}; return '<tr><td>' + l.position + '</td><td>' + esc(l.title) + '<br><small style="color:var(--muted)">' + esc(l.section_title || '') + '</small></td><td>' + (lc.video_url ? '🎬' : '—') + ' ' + (lc.attachment_path ? '📄' : '') + '</td><td>' + (l.is_free ? '<span class="pill ok">مجاني</span>' : '') + '</td><td style="display:flex;gap:6px"><button class="btn s g" data-act="editLesson" data-id="' + l.id + '" data-c="' + cid + '">تعديل</button><button class="btn s r" data-act="delLesson" data-id="' + l.id + '" data-c="' + cid + '">حذف</button></td></tr>'; }).join('');
  window.__cid = cid; window.__L = data;
  return '<div class="bar"><button class="btn g" data-go="courses">← الكورسات</button><b>' + esc(c && c.title) + '</b><button class="btn" data-act="newLesson" data-id="' + cid + '" style="margin-right:auto">+ درس جديد</button></div>'
    + '<div class="tw"><table><tr><th>#</th><th>الدرس</th><th>المحتوى</th><th></th><th></th></tr>' + (rows || '<tr><td colspan="5" class="empty">لا توجد دروس بعد</td></tr>') + '</table></div>';
}
async function lessonForm(cid, l) {
  const lc = l ? ([].concat(l.lesson_content || [])[0] || {}) : {}; let next = 1;
  if (!l) { const { data } = await sb.from('lessons').select('position').eq('course_id', cid).order('position', { ascending: false }).limit(1); next = data && data[0] ? data[0].position + 1 : 1; }
  modal(l ? 'تعديل الدرس' : 'درس جديد', '<form><label>عنوان الدرس</label><input name="title" required value="' + esc(l && l.title) + '"><div class="row2"><div><label>الوحدة / الباب (اختياري)</label><input name="section" value="' + esc(l && l.section_title) + '"></div><div><label>الترتيب</label><input type="number" name="pos" value="' + (l ? l.position : next) + '"></div></div>'
    + '<label>رابط الفيديو (YouTube غير مدرج)</label><input name="video" dir="ltr" placeholder="https://youtu.be/..." value="' + esc(lc.video_url) + '"><label>ملف PDF ' + (lc.attachment_path ? '(موجود، ارفع ملف جديد لو عايز تستبدله)' : '(اختياري)') + '</label><input type="file" name="pdf" accept="application/pdf"><label>ملاحظات (اختياري)</label><textarea name="notes">' + esc(lc.notes) + '</textarea>'
    + '<div class="row2"><div><label>المدة بالدقائق</label><input type="number" name="dur" min="0" value="' + esc(l && l.duration_minutes) + '"></div><label class="chk" style="align-self:end"><input type="checkbox" name="free"' + (l && l.is_free ? ' checked' : '') + '> درس مجاني (معاينة)</label></div><button class="btn" style="width:100%;margin-top:16px">حفظ الدرس</button></form>',
    async f => {
      const video = ytNorm(f.get('video')); if (f.get('video').trim() && !video) throw new Error('رابط الفيديو غير صالح');
      const row = { course_id: cid, title: f.get('title').trim(), section_title: f.get('section').trim() || null, position: +f.get('pos') || 0, is_free: f.get('free') === 'on', duration_minutes: +f.get('dur') || null };
      let id; if (l) { const { error } = await sb.from('lessons').update(row).eq('id', l.id); if (error) throw error; id = l.id; } else { const { data, error } = await sb.from('lessons').insert(row).select('id').single(); if (error) throw error; id = data.id; }
      let att = lc.attachment_path || null; const pdf = f.get('pdf');
      if (pdf && pdf.size) { att = cid + '/' + id + '.pdf'; const up = await sb.storage.from('lesson-files').upload(att, pdf, { upsert: true, contentType: 'application/pdf' }); if (up.error) throw up.error; }
      const r = await sb.from('lesson_content').upsert({ lesson_id: id, video_url: video, notes: f.get('notes').trim() || null, attachment_path: att }); if (r.error) throw r.error;
      toast('تم حفظ الدرس ✅'); go('lessons', cid);
    });
}

// ===== الطلاب =====
async function vStudents() {
  await loadStudents();
  setTimeout(() => { ['sq', 'sy'].forEach(id => $('#' + id).addEventListener('input', drawStudents)); drawStudents(); });
  return '<div class="bar"><input id="sq" placeholder="🔍 بحث بالاسم أو الهاتف أو الإيميل"><select id="sy"><option value="">كل الصفوف</option>' + yopts() + '</select><span id="sc" style="color:var(--muted);font-weight:700"></span></div><div class="tw"><table id="st"></table></div>';
}
function drawStudents() {
  const q = $('#sq').value.trim().toLowerCase(), y = $('#sy').value;
  const l = S.students.filter(s => (!y || s.academic_year === y) && (!q || (fname(s) + s.email + s.phone_number + s.parent_phone).toLowerCase().includes(q)));
  $('#sc').textContent = l.length + ' طالب';

}
async function vAdmins() {
  const { data: own } = await sb.rpc('is_owner'); if (own !== true) return '<div class="empty">🔒 هذا القسم للمالك فقط.</div>';
  const { data, error } = await sb.rpc('admin_list'); if (error) throw error;
  return '<div class="card" style="margin-bottom:16px"><b>إضافة مسؤول</b><p style="color:var(--muted);font-size:13px;margin:6px 0 10px;line-height:1.9">لازم يكون عنده حساب في Supabase (Authentication ← Users). اكتب إيميله وهيبقى مسؤول.</p><div class="bar" style="margin:0"><input id="ae" type="email" dir="ltr" placeholder="admin@example.com"><button class="btn" data-act="addAdmin">إضافة</button></div></div>'
    + '<div class="tw"><table><tr><th>الإيميل</th><th>الصلاحية</th><th></th></tr>' + data.map(a => '<tr><td dir="ltr">' + esc(a.email) + '</td><td><span class="pill ' + (a.is_owner ? 'ok' : '') + '">' + (a.is_owner ? 'مالك' : 'مسؤول') + '</span></td><td>' + (a.is_owner ? '' : '<button class="btn s r" data-act="rmAdmin" data-id="' + a.user_id + '">إزالة</button>') + '</td></tr>').join('') + '</table></div>';
}
async function vAnn() {
  const { data, error } = await sb.from('announcements').select('*').order('created_at', { ascending: false }); if (error) throw error;
  return '<div class="bar"><button class="btn" data-act="newAnn">+ إعلان جديد</button></div><div class="tw"><table><tr><th>الإعلان</th><th>الحالة</th><th></th></tr>' + (data.map(a => '<tr><td>' + esc(a.title) + '<br><small style="color:var(--muted)">' + esc(a.body || '') + '</small></td><td><span class="pill ' + (a.is_active ? 'ok' : 'no') + '">' + (a.is_active ? 'ظاهر' : 'مخفي') + '</span></td><td style="display:flex;gap:6px"><button class="btn s g" data-act="togAnn" data-id="' + a.id + '" data-p="' + a.is_active + '">' + (a.is_active ? 'إخفاء' : 'إظهار') + '</button><button class="btn s r" data-act="delAnn" data-id="' + a.id + '">حذف</button></td></tr>').join('') || '<tr><td colspan="3" class="empty">لا توجد إعلانات</td></tr>') + '</table></div>';
}

// ===== العمليات =====
const ACT = {
  newCourse: () => courseForm(),
  editCourse: id => courseForm(S.courses.find(c => c.id === id)),
  lessons: id => go('lessons', id),
  newLesson: id => lessonForm(id),
  togglePub: async id => { const c = S.courses.find(x => x.id === id); const { error } = await sb.from('courses').update({ is_published: !c.is_published }).eq('id', id); if (error) throw error; go('courses'); },
  delCourse: async id => { if (!confirm('حذف الكورس نهائياً بكل دروسه واشتراكاته وأكواده؟')) return; const { error } = await sb.from('courses').delete().eq('id', id); if (error) throw error; toast('تم الحذف'); go('courses'); },
  delLesson: async (id, el) => { if (!confirm('حذف الدرس؟')) return; const { error } = await sb.from('lessons').delete().eq('id', id); if (error) throw error; toast('تم الحذف'); go('lessons', el.dataset.c); },
  student: id => studentModal(id),
  enroll: async id => { const cid = $('#ec').value; const { error } = await sb.from('enrollments').insert({ student_id: id, course_id: cid }); if (error) throw error; S.enr.push({ student_id: id, course_id: cid }); toast('تم تفعيل الكورس ✅'); studentModal(id); drawStudents(); },
  unenroll: async (id, el) => { const cid = el.dataset.c; if (!confirm('إلغاء اشتراك الطالب في هذا الكورس؟')) return; const { error } = await sb.from('enrollments').delete().eq('student_id', id).eq('course_id', cid); if (error) throw error; S.enr = S.enr.filter(e => !(e.student_id === id && e.course_id === cid)); studentModal(id); drawStudents(); },
  block: async id => { const s = S.students.find(x => x.id === id); const { error } = await sb.from('profiles').update({ is_blocked: !s.is_blocked }).eq('id', id); if (error) throw error; s.is_blocked = !s.is_blocked; toast(s.is_blocked ? 'تم إيقاف الحساب' : 'تم إلغاء الإيقاف'); studentModal(id); drawStudents(); },
  kick: async id => { const { error } = await sb.rpc('admin_kick_student', { p_student: id }); if (error) throw error; toast('تم طرد الطالب من جهازه ✅'); },
  gen: async () => { const { data, error } = await sb.rpc('generate_codes', { p_course: $('#cc').value, p_count: +$('#cn').value || 1 }); if (error) throw error; $('#co').value = data.join('\n'); toast('تم توليد ' + data.length + ' كود ✅'); drawCodes(); },
  copy: async () => { await navigator.clipboard.writeText($('#co').value); toast('تم النسخ 📋'); }
};

Object.assign(ACT, {
  editExam: id => examForm(S.exams.find(x => x.id === id)),
  editLesson: (id, el) => lessonForm(el.dataset.c, (window.__L || []).find(x => x.id === id)),
  devLog: id => { const s = S.students.find(x => x.id === id); modal('سجل دخول: ' + (s ? fname(s) : ''), '<div class="tw"><table><tr><th>الجهاز</th><th>الوقت</th></tr>' + window.__ev.filter(e => e.student_id === id).slice(0, 60).map(e => '<tr><td>' + devName(e.user_agent) + '</td><td>' + new Date(e.created_at).toLocaleString('ar-EG') + '</td></tr>').join('') + '</table></div>'); },
  addAdmin: async () => { const { error } = await sb.rpc('admin_add', { p_email: $('#ae').value.trim() }); if (error) throw new Error((error.message || '').includes('user_not_found') ? 'مفيش حساب بالإيميل ده في Supabase' : error.message); toast('تمت إضافة المسؤول ✅'); go('admins'); },
  rmAdmin: async id => { if (!confirm('إزالة صلاحية هذا المسؤول؟')) return; const { error } = await sb.rpc('admin_remove', { p_user: id }); if (error) throw error; toast('تمت الإزالة'); go('admins'); },
  newAnn: () => modal('إعلان جديد', '<form><label>العنوان</label><input name="t" required><label>التفاصيل (اختياري)</label><textarea name="b"></textarea><button class="btn" style="width:100%;margin-top:16px">نشر الإعلان</button></form>', async f => { const { error } = await sb.from('announcements').insert({ title: f.get('t').trim(), body: f.get('b').trim() || null }); if (error) throw error; toast('تم نشر الإعلان ✅'); go('ann'); }),
  togAnn: async (id, el) => { const { error } = await sb.from('announcements').update({ is_active: el.dataset.p !== 'true' }).eq('id', id); if (error) throw error; go('ann'); },
  delAnn: async id => { if (!confirm('حذف الإعلان؟')) return; const { error } = await sb.from('announcements').delete().eq('id', id); if (error) throw error; go('ann'); },
  newExam: () => examForm(),
  questions: id => go('questions', id), results: id => go('results', id), newQ: id => questionForm(id), attempt: id => attemptModal(id),
  togglePubExam: async (id, el) => { const { error } = await sb.from('quizzes').update({ is_published: el.dataset.p !== 'true' }).eq('id', id); if (error) throw error; go('exams'); },
  delExam: async id => { if (!confirm('حذف الامتحان بكل أسئلته ونتائج الطلاب؟')) return; const { error } = await sb.from('quizzes').delete().eq('id', id); if (error) throw error; toast('تم الحذف'); go('exams'); },
  delQ: async (id, el) => { if (!confirm('حذف السؤال؟')) return; const { error } = await sb.from('quiz_questions').delete().eq('id', id); if (error) throw error; go('questions', el.dataset.e); },
  gradeEssay: async (id, el) => { const v = $('#es' + el.dataset.i).value; if (v === '') throw new Error('اكتب الدرجة'); const { error } = await sb.rpc('grade_essay', { p_attempt: id, p_question: el.dataset.q, p_score: +v }); if (error) throw error; toast('تم حفظ الدرجة ✅'); }
});
gate();
</script>
</body>
</html>
