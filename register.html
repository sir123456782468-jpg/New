<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد | The Leader In English</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة EmailJS للإرسال الحقيقي -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("YOUR_PUBLIC_KEY"); // حط هنا الـ Public Key بتاعك من EmailJS
        })();
    </script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: #0b0f19;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 75%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f1f5f9;
        }
        #toastNotification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 14px 28px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            transition: top 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        #toastNotification.error { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 10px 30px rgba(244, 63, 94, 0.4); }
        #toastNotification.show { top: 25px; }

        .platform-card {
            width: 100%;
            max-width: 460px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }
        .platform-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #60a5fa, #d4af37);
        }
        .brand-header { text-align: center; margin-bottom: 22px; }
        .brand-header h1 { font-size: 22px; font-weight: 900; color: #f8fafc; margin-bottom: 4px; }
        .brand-header h1 span { color: #d4af37; }
        .brand-header p { font-size: 13px; color: #94a3b8; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 5px; }
        .form-control {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 1.5px solid #334155;
            border-radius: 12px;
            padding: 11px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-control:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }
        
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            margin-top: 8px;
        }
        .btn-primary { background: linear-gradient(135deg, #d4af37, #aa7c11); color: #0b0f19; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        
        .step-container { display: none; }
        .step-container.active { display: block; }
        
        .switch-auth { text-align: center; margin-top: 18px; font-size: 13px; color: #94a3b8; }
        .switch-auth a { color: #d4af37; text-decoration: none; font-weight: 700; }
        .switch-auth a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div id="toastNotification">
        <i class="fa-solid fa-circle-check" id="toastIcon" style="font-size: 18px;"></i>
        <span id="toastText">تم بنجاح!</span>
    </div>

    <div class="platform-card">
        <div class="brand-header">
            <h1>The Leader <span>In English</span></h1>
            <p>انضم إلينا وابدأ رحلة التفوق</p>
        </div>

        <!-- الخطوة الأولى: البيانات الأساسية والباسورد -->
        <div id="step1" class="step-container active">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> الاسم الكامل</label>
                <input type="text" id="fullName" class="form-control" placeholder="أدخل اسمك ثلاثي">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> البريد الإلكتروني</label>
                <input type="email" id="email" class="form-control" placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> رقم الهاتف</label>
                <input type="text" id="phone" class="form-control" placeholder="01xxxxxxxx0">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> كلمة المرور</label>
                <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور">
            </div>

            <button type="button" class="btn btn-primary" onclick="startRegistration()">إرسال كود التحقق <i class="fa-solid fa-paper-plane"></i></button>
        </div>

        <!-- الخطوة الثانية: إدخال كود التحقق المُرسل للإيميل -->
        <div id="step2" class="step-container">
            <div style="text-align: center; margin-bottom: 20px;">
                <i class="fa-solid fa-shield-halved" style="font-size: 40px; color: #d4af37; margin-bottom: 10px;"></i>
                <p style="font-size: 14px; color: #cbd5e1;">تم إرسال كود التحقق إلى بريدك الإلكتروني. أدخله أدناه للمتابعة.</p>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-key"></i> كود التحقق (6 أرقام)</label>
                <input type="text" id="verificationCode" class="form-control" placeholder="123456" style="text-align: center; letter-spacing: 5px; font-size: 18px;">
            </div>

            <button type="button" class="btn btn-primary" onclick="verifyCode()">تحقق من الكود <i class="fa-solid fa-check"></i></button>
        </div>

        <!-- الخطوة الثالثة: تأكيد كلمة المرور مرتين بعد التحقق الناجح -->
        <div id="step3" class="step-container">
            <div style="text-align: center; margin-bottom: 20px;">
                <i class="fa-solid fa-lock-open" style="font-size: 40px; color: #10b981; margin-bottom: 10px;"></i>
                <p style="font-size: 14px; color: #cbd5e1;">تم التحقق بنجاح! أكد كلمة المرور الخاصة بك.</p>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> تأكيد كلمة المرور</label>
                <input type="password" id="confirmPassword1" class="form-control" placeholder="أعد كتابة كلمة المرور">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> إعادة كتابة كلمة المرور للتأكيد</label>
                <input type="password" id="confirmPassword2" class="form-control" placeholder="تأكيد كلمة المرور مطابقة">
            </div>

            <button type="button" class="btn btn-primary" onclick="completeRegistration()">إتمام وإنشاء الحساب <i class="fa-solid fa-circle-check"></i></button>
        </div>

        <div class="switch-auth">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

    <script>
        let generatedCode = '';
        let tempData = {};

        function showToast(message, isError = false) {
            const toast = document.getElementById('toastNotification');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastText').innerText = message;
            
            if(isError) {
                toast.classList.add('error');
                icon.className = "fa-solid fa-triangle-exclamation";
            } else {
                toast.classList.remove('error');
                icon.className = "fa-solid fa-circle-check";
            }
            
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        function startRegistration() {
            let fullName = document.getElementById('fullName').value.trim();
            let email = document.getElementById('email').value.trim();
            let phone = document.getElementById('phone').value.trim();
            let password = document.getElementById('password').value;

            if(!fullName || !email || !phone || !password) {
                showToast("الرجاء ملء جميع الحقول المطلوبة!", true);
                return;
            }

            // توليد كود عشوائي من 6 أرقام
            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
            tempData = { fullName, email, phone, password };

            // إرسال الكود عبر EmailJS
            let templateParams = {
                to_email: email,
                to_name: fullName,
                pass_code: generatedCode
            };

            showToast("جاري إرسال كود التحقق إلى إيميلك...");

            // استبدل YOUR_SERVICE_ID و YOUR_TEMPLATE_ID بالبيانات بتاعتك في إيميل جيه إس
            emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
                .then(function(response) {
                    showToast("تم إرسال الكود بنجاح إلى بريدك!");
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step2').classList.add('active');
                }, function(error) {
                    // في حال فضل فشل الإرسال لأي سبب، هنوفر الكود افتراضياً للتجربة لو حابب أو نبهه
                    showToast("حدث خطأ في الإرسال، الكود التجريبي: " + generatedCode, true);
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step2').classList.add('active');
                });
        }

        function verifyCode() {
            let userInputCode = document.getElementById('verificationCode').value.trim();
            if(userInputCode === generatedCode) {
                showToast("تم التحقق بنجاح!");
                document.getElementById('step2').classList.remove('active');
                document.getElementById('step3').classList.add('active');
            } else {
                showToast("كود التحقق غير صحيح، حاول مرة أخرى.", true);
            }
        }

        function completeRegistration() {
            let pass1 = document.getElementById('confirmPassword1').value;
            let pass2 = document.getElementById('confirmPassword2').value;

            if(!pass1 || !pass2) {
                showToast("الرجاء إدخال وتأكيد كلمة المرور!", true);
                return;
            }

            if(pass1 !== pass2) {
                showToast("كلمتا المرور غير متطابقتين!", true);
                return;
            }

            tempData.password = pass1; // اعتماد الباسورد المؤكد

            let users = JSON.parse(localStorage.getItem('leader_users') || '[]');
            
            // تحقق لو الإيميل مسجل قبل كده
            if(users.some(u => u.email === tempData.email)) {
                showToast("هذا البريد الإلكتروني مسجل مسبقاً!", true);
                return;
            }

            users.push(tempData);
            localStorage.setItem('leader_users', JSON.stringify(users));

            showToast("تم إنشاء الحساب بنجاح! جاري تحويلك لتسجيل الدخول...");
            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);
        }
    </script>
</body>
</html>
