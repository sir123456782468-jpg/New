<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - الخطوة الأولى | The Leader In English</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { emailjs.init("gU8jVHuVqdaZT6CD1"); })();
    </script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; caret-color: transparent; }
        input { caret-color: #d4af37; }
        body {
            background: #0b0f19;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 75%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f1f5f9;
        }
        #toastNotification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 14px 28px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            transition: top 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        #toastNotification.error { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 10px 30px rgba(244, 63, 94, 0.4); }
        #toastNotification.show { top: 25px; }

        .platform-card {
            width: 100%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }
        .platform-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #60a5fa, #d4af37);
        }
        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h1 { font-size: 22px; font-weight: 900; color: #f8fafc; margin-bottom: 4px; }
        .brand-header h1 span { color: #d4af37; }
        .brand-header p { font-size: 13px; color: #94a3b8; }
        
        .names-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 4px; }
        .form-control {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 1.5px solid #334155;
            border-radius: 10px;
            padding: 10px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-control:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }
        
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            margin-top: 10px;
        }
        .btn-primary { background: linear-gradient(135deg, #d4af37, #aa7c11); color: #0b0f19; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        
        .switch-auth { text-align: center; margin-top: 15px; font-size: 13px; color: #94a3b8; }
        .switch-auth a { color: #d4af37; text-decoration: none; font-weight: 700; }
        
        .developer-credit {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        .developer-credit span {
            color: #d4af37;
            font-weight: 700;
            background: linear-gradient(90deg, #d4af37, #fef08a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div id="toastNotification">
        <i class="fa-solid fa-circle-check" id="toastIcon"></i>
        <span id="toastText">تم بنجاح!</span>
    </div>

    <div class="platform-card">
        <div class="brand-header">
            <h1>The Leader <span>In English</span></h1>
            <p>خطوة واحدة تفصلك عن التفوق (1/3)</p>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-user"></i> اسم الطالب الثلاثي</label>
            <div class="names-grid">
                <input type="text" id="name1" class="form-control" placeholder="الاسم الأول">
                <input type="text" id="name2" class="form-control" placeholder="الاسم الثاني">
                <input type="text" id="name3" class="form-control" placeholder="الاسم الثالث">
            </div>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-phone"></i> رقم هاتف الطالب</label>
            <input type="text" id="phone" class="form-control" placeholder="01xxxxxxxxx">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-user-shield"></i> رقم ولي الأمر</label>
            <input type="text" id="guardianPhone" class="form-control" placeholder="01xxxxxxxxx">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-envelope"></i> البريد الإلكتروني</label>
            <input type="email" id="email" class="form-control" placeholder="example@gmail.com">
        </div>

        <button type="button" class="btn btn-primary" onclick="proceedToVerification()">إرسال كود التحقق <i class="fa-solid fa-paper-plane"></i></button>

        <div class="switch-auth">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

    <div class="developer-credit">
        Developed with <i class="fa-solid fa-heart" style="color: #f43f5e;"></i> by <span>Mohamed Sherif Khafagy</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCnLE_iSDSByBEmx1ujLWVVHw3Jv2W62Sc",
          authDomain: "the-leader-c2f06.firebaseapp.com",
          projectId: "the-leader-c2f06",
          storageBucket: "the-leader-c2f06.firebasestorage.app",
          messagingSenderId: "693921211082",
          appId: "1:693921211082:web:640e7e5528a9891d368a33",
          measurementId: "G-RK4LP1HMJY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showToast = function(message, isError = false) {
            const toast = document.getElementById('toastNotification');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastText').innerText = message;
            if(isError) {
                toast.classList.add('error');
                icon.className = "fa-solid fa-triangle-exclamation";
            } else {
                toast.classList.remove('error');
                icon.className = "fa-solid fa-circle-check";
            }
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        window.proceedToVerification = function() {
            let n1 = document.getElementById('name1').value.trim();
            let n2 = document.getElementById('name2').value.trim();
            let n3 = document.getElementById('name3').value.trim();
            let phone = document.getElementById('phone').value.trim();
            let guardianPhone = document.getElementById('guardianPhone').value.trim();
            let email = document.getElementById('email').value.trim();

            if(!n1 || !n2 || !n3 || !phone || !guardianPhone || !email) {
                window.showToast("الرجاء استكمال جميع الحقول المطلوبة!", true);
                return;
            }

            let fullName = `${n1} ${n2} ${n3}`;
            let generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

            // حفظ البيانات فوراً في الـ LocalStorage عشان الخطوة الثانية تقراها وتعرف الكود
            let tempData = { fullName, phone, guardianPhone, email, generatedCode };
            localStorage.setItem('temp_reg_data', JSON.stringify(tempData));

            window.showToast("جاري إرسال الكود والانتقال...");

            // إرسال الإيميل ورفع البيانات في الخلفية بدون انتظار شبكة عشان الصفحة ما تتعلقش أبداً
            emailjs.send('service_seljmns', 'template_5lj7i0g', { to_email: email, to_name: fullName, pass_code: generatedCode })
                .catch(err => console.log("Email error:", err));

            setDoc(doc(db, "pending_registrations", email.toLowerCase().replace(/\./g, '_')), {
                email: email,
                full_name: fullName,
                phone: phone,
                guardian_phone: guardianPhone,
                verification_code: generatedCode,
                createdAt: new Date().toISOString()
            }).catch(err => console.log("Firebase error:", err));

            // الانتقال الفوري للخطوة الثانية من غير أي انتظار
            setTimeout(() => {
                window.location.href = "register_step2.html";
            }, 600);
        }
    </script>
</body>
</html>
