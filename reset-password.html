<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور | منصة الطالب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- استدعاء مكتبة Supabase الرسمية -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 0 40px rgba(14, 165, 233, 0.15);
    }
    .led-glow {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }
    .led-btn:hover {
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.7);
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <div class="w-full max-w-md glass-card rounded-3xl p-8 relative overflow-hidden">
    
    <!-- شريط إضاءة ليد علوي -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-500 via-sky-400 to-indigo-600 led-glow"></div>

    <!-- رأس الصفحة -->
    <div class="text-center mb-6">
      <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-500 mb-1">
        استعادة الحساب
      </h1>
      <p class="text-slate-400 text-xs">أدخل بريدك الإلكتروني لإرسال رابط إعادة التعيين الآمن</p>
    </div>

    <!-- نموذج الاستعادة -->
    <form id="resetForm" onsubmit="handlePasswordReset(event)" class="space-y-4">
      
      <div>
        <label class="block text-xs text-slate-400 mb-1">البريد الإلكتروني المسجل</label>
        <input type="email" id="resetEmail" required placeholder="name@example.com" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-400 transition text-slate-200">
      </div>

      <button type="submit" id="submitBtn" class="w-full mt-2 bg-gradient-to-r from-blue-600 to-sky-500 font-bold py-3.5 rounded-xl led-btn transition transform active:scale-95 text-sm">
        إرسال رابط الاستعادة 🔗
      </button>

      <div class="text-center pt-2">
        <a href="login.html" class="text-xs text-sky-400 hover:underline">العودة لتسجيل الدخول</a>
      </div>
    </form>

    <!-- رسالة الحالة -->
    <div id="statusMsg" class="mt-4 text-center text-xs hidden"></div>

  </div>

  <script>
    // إعدادات اتصال Supabase (ضع مفاتيح مشروعك هنا)
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handlePasswordReset(e) {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const btn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      if (!email) return;

      btn.disabled = true;
      btn.innerText = "جاري الإرسال...";
      statusMsg.classList.add('hidden');

      try {
        // أمر Supabase المباشر لإرسال إيميل إعادة تعيين كلمة المرور
        const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/update-password.html', // الصفحة اللي هيحولها المستخدم بعد ما يضغط على اللينك في الإيميل
        });

        if (error) throw error;

        statusMsg.classList.remove('hidden', 'text-red-400');
        statusMsg.classList.add('text-emerald-400');
        statusMsg.innerText = "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني بنجاح!";
        btn.innerText = "تم الإرسال بنجاح ✓";

      } catch (error) {
        statusMsg.classList.remove('hidden', 'text-emerald-400');
        statusMsg.classList.add('text-red-400');
        statusMsg.innerText = "حدث خطأ: " + (error.message || "تأكد من صحة البريد الإلكتروني.");
        btn.disabled = false;
        btn.innerText = "إرسال رابط الاستعادة 🔗";
      }
    }
  </script>
</body>
</html>
