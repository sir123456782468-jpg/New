<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>المحاضرة - The Leader In English</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
<style>
html{visibility:hidden}
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e6eaf2;--brand:#ef4444;--grad:linear-gradient(135deg,#ef4444,#ec4899);--ok:#16a34a;--sh:0 10px 30px -16px rgba(15,23,42,.22)}
[data-theme=dark]{--bg:#0a1020;--card:#121b30;--ink:#f1f5f9;--muted:#94a3b8;--line:#22304d;--brand:#f87171;--sh:0 10px 30px -16px rgba(0,0,0,.8)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}a{color:inherit;text-decoration:none}button{font-family:inherit}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.hdr{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 22px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.brand svg{width:50px;height:50px;flex:none}.brand b{display:block;font-size:19px;font-weight:900;line-height:1.2}.brand small{font-size:12.5px;font-weight:700;color:var(--brand)}
.tools{display:flex;align-items:center;gap:10px}
.back{width:54px;height:54px;border-radius:16px;border:none;background:rgba(239,68,68,.12);color:var(--brand);font-size:24px;font-weight:900;cursor:pointer;display:grid;place-items:center}
.sw{width:78px;height:40px;border-radius:40px;border:1px solid var(--line);background:var(--bg);position:relative;cursor:pointer}.sw i{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-style:normal;font-size:15px;transition:right .3s}[data-theme=dark] .sw i{right:44px}
.btn{display:inline-block;border:none;border-radius:13px;padding:11px 22px;font-weight:800;font-size:14px;cursor:pointer;background:var(--grad);color:#fff;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.g{background:none;border:2px solid var(--brand);color:var(--brand)}.btn:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.empty{display:grid;place-items:center;text-align:center;background:var(--card);border:2px dashed var(--line);border-radius:18px;color:var(--muted);font-weight:700;line-height:2;padding:34px 20px}.empty i{display:block;font-size:46px;font-style:normal}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--grad);transition:width .8s}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99}.toast{background:#1e293b;color:#fff;padding:12px 22px;border-radius:14px;font-weight:700;font-size:14px;margin-top:8px}
@media(max-width:700px){.brand div{display:none}.hdr{padding:8px 12px}.back{width:46px;height:46px}}

.lwrap{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:24px;max-width:1450px;margin:0 auto;padding:22px 22px 60px;align-items:start}
.ttl{font-size:25px;font-weight:700;margin:6px 0 16px;color:var(--ink);line-height:1.6}
.vwrap{position:relative;aspect-ratio:16/9;background:#000;border-radius:20px;overflow:hidden}.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.vwrap.pdf{aspect-ratio:auto;height:80vh}
.sh{position:absolute;z-index:3}.sh.t{top:0;left:0;right:0;height:62px}.sh.b{bottom:0;right:0;width:130px;height:46px}.sh.dr{top:0;right:0;width:70px;height:56px}
.wm{position:absolute;z-index:4;pointer-events:none;color:rgba(255,255,255,.55);font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.8);transition:all 2.5s ease;direction:ltr;white-space:nowrap}
.xcard{display:grid;place-items:center;text-align:center;min-height:300px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--sh)}.xcard i{display:block;font-size:56px;font-style:normal;margin-bottom:8px}.xcard h2{font-size:22px;margin-bottom:6px}.xcard p{color:var(--muted);font-weight:700;line-height:2;margin-bottom:14px}
.note{margin-top:14px;padding:14px;border-radius:14px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.5);font-weight:600;line-height:1.9;white-space:pre-wrap}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.side{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--sh);position:sticky;top:92px;max-height:calc(100vh - 112px);overflow:auto}
.side h3{font-size:23px;font-weight:900;margin-bottom:16px}
.ci{display:flex;align-items:center;gap:14px;padding:17px 16px;border:1px solid var(--line);border-radius:18px;margin-bottom:12px;cursor:pointer;background:var(--card);transition:.2s}
.ci:hover{transform:translateY(-2px)}.ci.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(239,68,68,.14)}
.ck{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:900;font-size:17px;transition:.3s}
.ci.dn .ck{border-color:var(--ok);color:var(--ok);background:rgba(22,163,74,.1)}
.ci .t{flex:1;font-weight:800;font-size:15.5px;line-height:1.6}.ci .t small{display:block;color:var(--muted);font-weight:700;font-size:12px}
@media(max-width:1000px){.lwrap{grid-template-columns:1fr;padding:14px}.side{position:static;max-height:none}.ttl{font-size:20px}.vwrap.pdf{height:70vh}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><symbol id="logo" viewBox="0 0 64 64"><path d="M14 4h36a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10H32L20 61V50h-6A10 10 0 0 1 4 40V14A10 10 0 0 1 14 4z" fill="url(#rg)"/><path d="M21 21h8v19h14v8H21z" fill="#fff"/><path d="M18 19V11l5 4 4-7 4 7 5-4v8z" fill="#fbbf24"/></symbol></svg>

<header class="hdr"><a class="brand" href="home.html"><svg><use href="#logo"/></svg><div><b>مستر شريف خفاجي</b><small>The Leader In English</small></div></a><div class="tools"><button class="sw" type="button" id="swb" aria-label="تغيير الوضع"><i id="swi">☀️</i></button><a class="back" id="bk" href="home.html#courses" aria-label="رجوع للكورس">→</a></div></header>
<main class="lwrap" id="root"><div class="xcard"><div><i>⏳</i><p>جاري تحميل المحاضرة...</p></div></div></main>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

window.guardFail = function (m) { document.documentElement.style.visibility = 'visible'; document.body.innerHTML = '<div style="max-width:460px;margin:12vh auto;padding:28px;font-family:Cairo,sans-serif;text-align:center;direction:rtl;border:2px solid #ef4444;border-radius:20px;line-height:2"><div style="font-size:46px">🔒</div><b>تعذر فتح الصفحة</b><p style="color:#64748b">' + m + '</p><a href="signin.html" style="color:#ef4444;font-weight:800">تسجيل الدخول</a></div>'; };
setTimeout(() => { if (!window.currentUser) guardFail('تأخر التحقق من حسابك. حدّث الصفحة.'); }, 15000);

</script>
<script>

(function () {
    const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.documentElement.style.visibility = 'hidden';

    (async () => { try {
        const { data } = await supabaseClient.auth.getSession();
        const session = data && data.session;
        if (!session) { location.replace('signin.html'); return; }

        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', session.user.id)
            .maybeSingle();

        if (!profile) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('signup.html');
            return;
        }

        if (profile.is_blocked === true) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('signin.html?blocked=1');
            return;
        }

        const kicked = async (allowReclaim) => {
            try {
                let { data: ok, error } = await supabaseClient.rpc('session_ok');
                if (!error && ok === false && allowReclaim) {
                    await supabaseClient.rpc('claim_session');
                    ({ data: ok, error } = await supabaseClient.rpc('session_ok'));
                }
                if (!error && ok === false) {
                    await supabaseClient.auth.signOut({ scope: 'local' });   // local: مايطلّعش الجهاز الجديد
                    location.replace('signin.html?kicked=1');
                    return true;
                }
            } catch (e) {}
            return false;
        };
        const fresh = sessionStorage.getItem('just_logged_in') === '1';
        sessionStorage.removeItem('just_logged_in');
        if (await kicked(fresh)) return;
        setInterval(() => kicked(false), 15000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) kicked(false); });

        let admin = false;
        try {
            const { data: a } = await supabaseClient.rpc('is_admin');
            admin = a === true;
        } catch (e) {}
        window.isAdmin = admin;

        window.currentUser = session.user;
        window.currentProfile = profile;
        document.documentElement.style.visibility = 'visible';
        document.dispatchEvent(new CustomEvent('auth-ready'));
    } catch (e) {
        console.error('auth-guard error:', e);
        if (window.guardFail) window.guardFail('حدث خطأ أثناء التحقق من حسابك: ' + (e && e.message ? e.message : e));
        else location.replace('signin.html');
    } })();

    window.requireAdmin = function () {
        if (!window.isAdmin) { location.replace('home.html'); return false; }
        return true;
    };

    window.logout = async function () {
        await supabaseClient.auth.signOut({ scope: 'local' });
        location.replace('signin.html');
    };
})();


</script>
<script>
const LID = new URLSearchParams(location.search).get('id');
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const setTheme = t => { document.body.setAttribute('data-theme', t); $('#swi').textContent = t === 'dark' ? '🌙' : '☀️'; };
setTheme(localStorage.getItem('platform_theme') || 'light');
$('#swb').onclick = () => { const t = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem('platform_theme', t); setTheme(t); };
const toast = m => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = m; $('#toasts').appendChild(e); setTimeout(() => e.remove(), 3000); };
let L = null, ITEMS = [], DONE = new Set(), LESSONS = [], QZ = {}, ATT = {}, cur = -1, wmTimer = null, markTimer = null;

async function init() {
  if (!LID) return fail('رابط المحاضرة غير صحيح');
  const lr = await supabaseClient.from('lessons').select('*').eq('id', LID).maybeSingle();
  if (!lr.data) return fail('المحاضرة غير موجودة أو غير متاحة لك.');
  L = lr.data; $('#bk').href = 'course.html?id=' + L.course_id;
  const [en, all, it, ct, ip, pr] = await Promise.all([
    supabaseClient.from('enrollments').select('course_id').eq('course_id', L.course_id),
    supabaseClient.from('lessons').select('id,title,position,is_free').eq('course_id', L.course_id).order('position'),
    supabaseClient.from('lesson_items').select('id,kind,title,url,position').eq('lesson_id', LID).order('position'),
    supabaseClient.from('lesson_content').select('video_url,notes,attachment_path').eq('lesson_id', LID).maybeSingle(),
    supabaseClient.from('lesson_item_progress').select('item_id'),
    supabaseClient.from('lesson_progress').select('lesson_id').eq('lesson_id', LID)
  ]);
  const on = !!(en.data && en.data.length);
  if (!on && !L.is_free) return fail('🔒 اشترك في الكورس الأول عشان تفتح المحاضرة.<br><br><a class="btn" href="course.html?id=' + L.course_id + '">الذهاب للكورس</a>');
  LESSONS = all.data || []; const d = ct.data || {};
  ITEMS = (it.data || []).slice();
  if (d.video_url) ITEMS.unshift({ legacy: 1, kind: 'video', title: 'فيديو المحاضرة', url: d.video_url });
  if (d.attachment_path) ITEMS.push({ legacy: 1, kind: 'pdf', title: 'ملف المحاضرة (PDF)', path: d.attachment_path });
  (ip.data || []).forEach(x => DONE.add(x.item_id));
  const qids = ITEMS.filter(x => x.kind === 'exam').map(x => x.url);
  if (qids.length) {
    const [qz, at] = await Promise.all([
      supabaseClient.from('quizzes').select('id,title,opens_at,closes_at,max_attempts,pass_percent').in('id', qids),
      supabaseClient.from('quiz_attempts').select('id,quiz_id,score,total,status').in('quiz_id', qids).order('created_at', { ascending: false })
    ]);
    (qz.data || []).forEach(q => QZ[q.id] = q); (at.data || []).forEach(a => (ATT[a.quiz_id] = ATT[a.quiz_id] || []).push(a));
    ITEMS.forEach(x => { if (x.kind === 'exam' && (ATT[x.url] || []).length) DONE.add(x.id); });
  }
  L._notes = d.notes; L._lessonDone = !!(pr.data && pr.data.length);
  draw();
  const first = ITEMS.findIndex(x => !DONE.has(x.id)); openItem(first >= 0 ? first : 0);
}
function fail(t) { $('#root').innerHTML = '<div class="xcard"><div><i>🔒</i><p>' + t + '</p><a class="btn" href="home.html">الرئيسية</a></div></div>'; }
const icon = x => x.kind === 'video' ? '🎬' : x.kind === 'pdf' ? '📄' : x.kind === 'exam' ? '📝' : '🔗';
const kindName = x => x.kind === 'video' ? 'فيديو' : x.kind === 'pdf' ? 'ملف PDF' : x.kind === 'exam' ? 'امتحان' : 'رابط';

function draw() {
  const i = LESSONS.findIndex(x => x.id === LID), prev = LESSONS[i - 1], next = LESSONS[i + 1];
  $('#root').innerHTML = '<section><h1 class="ttl" id="ttl">' + esc(L.title) + '</h1><div id="player"></div><div id="below"></div>'
    + '<div class="nav">' + (prev ? '<a class="btn g" href="lecture.html?id=' + prev.id + '">→ المحاضرة السابقة</a>' : '<span></span>') + (next ? '<a class="btn" href="lecture.html?id=' + next.id + '">المحاضرة التالية ←</a>' : '<a class="btn g" href="course.html?id=' + L.course_id + '">العودة للكورس</a>') + '</div></section>'
    + '<aside class="side"><h3>محتوى المحاضرة</h3><div id="list"></div></aside>';
  list();
}
function list() {
  $('#list').innerHTML = ITEMS.map((x, i) => '<div class="ci' + (DONE.has(x.id) ? ' dn' : '') + (cur === i ? ' on' : '') + '" data-i="' + i + '"><span class="ck">✓</span><span class="t">' + icon(x) + ' ' + esc(x.title) + '<small>' + kindName(x) + '</small></span></div>').join('') || '<div class="xcard" style="min-height:140px"><div><p>لا يوجد محتوى لهذه المحاضرة بعد</p></div></div>';
  $$('.ci').forEach(el => el.onclick = () => openItem(+el.dataset.i));
}
function embedOf(u) {
  let m;
  if (/youtu/.test(u) && (m = u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/))) return { src: 'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&disablekb=1&origin=' + encodeURIComponent(location.origin), yt: 1 };
  if (/drive\.google\.com/.test(u) && (m = u.match(/\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/))) return { src: 'https://drive.google.com/file/d/' + m[1] + '/preview', dr: 1 };
  if ((m = u.match(/vimeo\.com\/(\d+)/))) return { src: 'https://player.vimeo.com/video/' + m[1] };
  return /^https:\/\//.test(u) ? { src: u } : null;
}
async function openItem(i) {
  const x = ITEMS[i]; if (!x) { $('#player').innerHTML = '<div class="xcard"><div><i>📭</i><p>لا يوجد محتوى في هذه المحاضرة بعد</p></div></div>'; return; }
  cur = i; clearInterval(wmTimer); clearTimeout(markTimer); $$('.ci').forEach(el => el.classList.toggle('on', +el.dataset.i === i)); $('#ttl').textContent = x.title;
  $('#below').innerHTML = i === 0 && L._notes ? '<div class="note">' + esc(L._notes) + '</div>' : '';
  if (x.kind === 'exam') return showExam(x);
  if (x.kind === 'link') { $('#player').innerHTML = '<div class="xcard"><div><i>🔗</i><h2>' + esc(x.title) + '</h2><p>الرابط هيتفتح في تبويب جديد</p><a class="btn" href="' + esc(x.url) + '" target="_blank" rel="noopener">فتح الرابط</a></div></div>'; schedMark(x); return; }
  let e = null;
  if (x.legacy && x.path) { const { data: s, error } = await supabaseClient.storage.from('lesson-files').createSignedUrl(x.path, 3600); if (error) { $('#player').innerHTML = '<div class="xcard"><div><i>⚠️</i><p>تعذر فتح الملف</p></div></div>'; return; } e = { src: s.signedUrl }; }
  else e = embedOf(x.url);
  if (!e) { $('#player').innerHTML = '<div class="xcard"><div><i>⚠️</i><p>الرابط غير صالح</p></div></div>'; return; }
  const p = currentProfile, wm = [p.first_name, p.last_name].join(' ') + ' • ' + p.phone_number;
  $('#player').innerHTML = '<div class="vwrap' + (x.kind === 'pdf' ? ' pdf' : '') + '" id="vw"><iframe src="' + esc(e.src) + '" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>' + (e.yt ? '<div class="sh t"></div><div class="sh b"></div>' : '') + (e.dr ? '<div class="sh dr"></div>' : '') + '<div class="wm" id="wm">' + esc(wm) + '</div></div>';
  const w = $('#wm'), box = $('#vw'), mv = () => { w.style.top = (8 + Math.random() * (box.clientHeight - 50)) + 'px'; w.style.left = (8 + Math.random() * Math.max(10, box.clientWidth - w.clientWidth - 16)) + 'px'; };
  mv(); wmTimer = setInterval(mv, 4000); schedMark(x);
}
function showExam(x) {
  const q = QZ[x.url], at = ATT[x.url] || [], n = Date.now();
  if (!q) { $('#player').innerHTML = '<div class="xcard"><div><i>📝</i><p>الامتحان غير متاح حالياً</p></div></div>'; return; }
  const o = q.opens_at && new Date(q.opens_at) > n, cl = q.closes_at && new Date(q.closes_at) < n, left = (q.max_attempts || 1) - at.length, a = at[0];
  const res = a ? '<p>آخر نتيجة: <b>' + a.score + ' / ' + a.total + '</b>' + (a.status === 'pending' ? ' (في انتظار تصحيح الأسئلة المقالية)' : a.total ? ' (' + (a.score / a.total * 100).toFixed(1) + '%)' : '') + '<br>المحاولات المتاحة: ' + Math.max(left, 0) + '</p>' : '<p>' + esc(q.title) + '</p>';
  $('#player').innerHTML = '<div class="xcard"><div><i>📝</i><h2>' + esc(q.title) + '</h2>' + res + (o ? '<b>الامتحان لسه ما فتحش</b>' : cl ? '<b style="color:#dc2626">انتهى وقت الامتحان</b>' : left > 0 ? '<a class="btn" href="quiz.html?id=' + q.id + '">' + (a ? 'محاولة جديدة' : 'ابدأ الامتحان') + '</a>' : '') + '</div></div>';
}
function schedMark(x) { if (x.legacy || DONE.has(x.id)) return; markTimer = setTimeout(() => markDone(x), 5000); }
async function markDone(x) {
  if (DONE.has(x.id)) return;
  const { error } = await supabaseClient.from('lesson_item_progress').insert({ student_id: currentUser.id, item_id: x.id });
  if (error && error.code !== '23505') return;
  DONE.add(x.id); list();
  const track = ITEMS.filter(i => !i.legacy);
  if (track.length && track.every(i => DONE.has(i.id)) && !L._lessonDone) {
    const r = await supabaseClient.from('lesson_progress').insert({ student_id: currentUser.id, lesson_id: LID });
    if (!r.error || r.error.code === '23505') { L._lessonDone = true; toast('أحسنت! خلّصت المحاضرة ✅'); }
  }
}
document.addEventListener('contextmenu', e => { if (e.target.closest('.vwrap')) e.preventDefault(); });
if (window.currentProfile) init(); else document.addEventListener('auth-ready', init);
</script>
