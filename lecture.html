<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>المحاضرة - The Leader In English</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
<style>
html{visibility:hidden}
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e6eaf2;--brand:#ef4444;--grad:linear-gradient(135deg,#ef4444,#ec4899);--ok:#16a34a;--sh:0 10px 30px -16px rgba(15,23,42,.2)}
[data-theme=dark]{--bg:#0a1020;--card:#121b30;--ink:#f1f5f9;--muted:#94a3b8;--line:#22304d;--brand:#f87171;--sh:0 10px 30px -16px rgba(0,0,0,.8)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}a{color:inherit;text-decoration:none}button{font-family:inherit}
body{background:var(--bg);color:var(--ink);min-height:100vh;transition:background .3s,color .3s}
.hdr{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 22px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px}.brand svg{width:46px;height:46px;flex:none}.brand b{display:block;font-size:17px;font-weight:900;line-height:1.2}.brand small{font-size:12px;font-weight:700;color:var(--brand)}
.tools{display:flex;align-items:center;gap:10px}
.back{width:48px;height:48px;border-radius:14px;border:none;background:rgba(239,68,68,.12);color:var(--brand);font-size:22px;font-weight:900;cursor:pointer;display:grid;place-items:center}
.sw{width:66px;height:34px;border-radius:34px;border:1px solid var(--line);background:var(--bg);position:relative;cursor:pointer}.sw i{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-style:normal;font-size:14px;transition:right .3s}[data-theme=dark] .sw i{right:35px}
.btn{display:inline-block;border:none;border-radius:13px;padding:11px 22px;font-weight:800;font-size:14px;cursor:pointer;background:var(--grad);color:#fff;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.g{background:none;border:2px solid var(--brand);color:var(--brand)}.btn:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .8s}
.empty{text-align:center;color:var(--muted);padding:44px 18px;font-weight:700;line-height:2}.empty i{display:block;font-size:46px;font-style:normal}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99}.toast{background:#1e293b;color:#fff;padding:12px 22px;border-radius:14px;font-weight:700;font-size:14px}
.wrap{max-width:1500px;margin:0 auto;padding:20px 18px 50px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
.ttl{font-size:26px;font-weight:900;margin:6px 0 16px;line-height:1.6}
.vwrap{position:relative;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden}.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.vwrap.pdf{aspect-ratio:auto;height:80vh}
.sh{position:absolute;z-index:3}.sh.t{top:0;left:0;right:0;height:62px}.sh.b{bottom:0;right:0;width:130px;height:46px}.sh.dr{top:0;right:0;width:70px;height:56px}
.wm{position:absolute;z-index:4;pointer-events:none;color:rgba(255,255,255,.55);font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.8);transition:all 2.5s ease;direction:ltr;white-space:nowrap}
.ph{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;background:var(--card);border:2px dashed var(--line);border-radius:18px;color:var(--muted);font-weight:700;line-height:2;padding:20px}.ph i{display:block;font-size:46px;font-style:normal}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.note{margin-top:16px;padding:16px;border-radius:16px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.5);font-weight:600;line-height:2;white-space:pre-wrap}
.side{padding:20px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}.side h2{font-size:22px;font-weight:900}.side .sub{color:var(--muted);font-weight:700;font-size:13px;margin:4px 0 12px}
.ci{display:flex;align-items:center;gap:12px;padding:16px;margin-top:10px;border:1px solid var(--line);border-radius:16px;cursor:pointer;font-weight:800;font-size:15px;line-height:1.6;transition:.2s}
.ci:hover{border-color:var(--brand)}.ci.on{border-color:var(--brand);background:rgba(239,68,68,.07)}.ci .g{flex:1}.ci small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.ck{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;color:transparent}.ci.dn .ck{border-color:var(--ok);color:var(--ok)}
.xq{padding:26px;text-align:center}.xq h3{font-size:22px;margin-bottom:6px}.xq p{color:var(--muted);font-weight:600;margin-bottom:16px;line-height:2}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}.side{position:static;max-height:none}.ttl{font-size:21px}.hdr{padding:9px 14px}.brand div{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><symbol id="logo" viewBox="0 0 64 64"><path d="M14 4h36a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10H32L20 61V50h-6A10 10 0 0 1 4 40V14A10 10 0 0 1 14 4z" fill="url(#rg)"/><path d="M21 21h8v19h14v8H21z" fill="#fff"/><path d="M18 19V11l5 4 4-7 4 7 5-4v8z" fill="#fbbf24"/></symbol></svg>
<header class="hdr">
  <a class="brand" href="home.html"><svg><use href="#logo"/></svg><div><b>مستر شريف خفاجي</b><small>The Leader In English</small></div></a>
  <div class="tools"><button class="sw" type="button" onclick="toggleTheme()" aria-label="الوضع"><i id="swi">☀️</i></button><a class="back" id="backBtn" href="course.html" aria-label="رجوع">←</a></div>
</header>
<main class="wrap" id="root"><div class="ph" style="grid-column:1/-1"><div><i>⏳</i>جاري تحميل المحاضرة...</div></div></main>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.guardFail = function (m) { document.documentElement.style.visibility = 'visible'; document.body.innerHTML = '<div style="max-width:460px;margin:12vh auto;padding:28px;font-family:Cairo,sans-serif;text-align:center;direction:rtl;border:2px solid #ef4444;border-radius:20px;line-height:2"><div style="font-size:46px">🔒</div><b>تعذر فتح الصفحة</b><p style="color:#64748b">' + m + '</p><a href="signin.html" style="color:#ef4444;font-weight:800">تسجيل الدخول</a></div>'; };
setTimeout(() => { if (!window.currentUser) guardFail('تأخر التحقق من حسابك. حدّث الصفحة.'); }, 15000);
</script>
<script>

(function () {
    const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.documentElement.style.visibility = 'hidden';

    (async () => { try {
        const { data } = await supabaseClient.auth.getSession();
        const session = data && data.session;
        if (!session) { location.replace('signin.html'); return; }

        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', session.user.id)
            .maybeSingle();

        if (!profile) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('signup.html');
            return;
        }

        if (profile.is_blocked === true) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('signin.html?blocked=1');
            return;
        }

        const kicked = async (allowReclaim) => {
            try {
                let { data: ok, error } = await supabaseClient.rpc('session_ok');
                if (!error && ok === false && allowReclaim) {
                    await supabaseClient.rpc('claim_session');
                    ({ data: ok, error } = await supabaseClient.rpc('session_ok'));
                }
                if (!error && ok === false) {
                    await supabaseClient.auth.signOut({ scope: 'local' });   // local: مايطلّعش الجهاز الجديد
                    location.replace('signin.html?kicked=1');
                    return true;
                }
            } catch (e) {}
            return false;
        };
        const fresh = sessionStorage.getItem('just_logged_in') === '1';
        sessionStorage.removeItem('just_logged_in');
        if (await kicked(fresh)) return;
        setInterval(() => kicked(false), 15000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) kicked(false); });

        let admin = false;
        try {
            const { data: a } = await supabaseClient.rpc('is_admin');
            admin = a === true;
        } catch (e) {}
        window.isAdmin = admin;

        window.currentUser = session.user;
        window.currentProfile = profile;
        document.documentElement.style.visibility = 'visible';
        document.dispatchEvent(new CustomEvent('auth-ready'));
    } catch (e) {
        console.error('auth-guard error:', e);
        if (window.guardFail) window.guardFail('حدث خطأ أثناء التحقق من حسابك: ' + (e && e.message ? e.message : e));
        else location.replace('signin.html');
    } })();

    window.requireAdmin = function () {
        if (!window.isAdmin) { location.replace('home.html'); return false; }
        return true;
    };

    window.logout = async function () {
        await supabaseClient.auth.signOut({ scope: 'local' });
        location.replace('signin.html');
    };
})();


</script>
<script>
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = m => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = m; $('#toasts').appendChild(e); setTimeout(() => e.remove(), 3000); };
function applyTheme(t) { document.body.setAttribute('data-theme', t); $('#swi').textContent = t === 'dark' ? '🌙' : '☀️'; }
function toggleTheme() { const t = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; localStorage.setItem('platform_theme', t); applyTheme(t); }
applyTheme(localStorage.getItem('platform_theme') || 'light');
const LID = new URLSearchParams(location.search).get('id'), WANT = new URLSearchParams(location.search).get('item');
const L = { lesson: null, course: null, lessons: [], items: [], done: new Set(), cur: -1, notes: '', timer: null, wmT: null, att: {} };
const ICON = { video: '🎬', pdf: '📄', link: '🔗', exam: '📝' };
function fail(t, back) { $('#root').innerHTML = '<div class="ph" style="grid-column:1/-1"><div><i>🔒</i>' + t + '<br><br><a class="btn" href="' + (back || 'home.html') + '">رجوع</a></div></div>'; }
async function init() {
  if (!LID) return fail('رابط المحاضرة غير صحيح');
  const ls = await supabaseClient.from('lessons').select('*').eq('id', LID).maybeSingle();
  if (!ls.data) return fail('المحاضرة غير موجودة أو غير متاحة لك.');
  L.lesson = ls.data; $('#backBtn').href = 'course.html?id=' + L.lesson.course_id;
  const [co, all, it, ct] = await Promise.all([
    supabaseClient.from('courses').select('id,title').eq('id', L.lesson.course_id).maybeSingle(),
    supabaseClient.from('lessons').select('id,title,position').eq('course_id', L.lesson.course_id).order('position'),
    supabaseClient.from('lesson_items').select('id,kind,title,url,position').eq('lesson_id', LID).order('position'),
    supabaseClient.from('lesson_content').select('video_url,notes,attachment_path').eq('lesson_id', LID).maybeSingle()
  ]);
  L.course = co.data; L.lessons = all.data || []; L.items = (it.data || []).slice();
  const d = ct.data || {}; L.notes = d.notes || '';
  if (d.video_url) L.items.unshift({ id: null, kind: 'video', title: 'فيديو الدرس', url: d.video_url });
  if (d.attachment_path) L.items.push({ id: null, kind: 'pdf', title: 'ملف الدرس (PDF)', url: '', path: d.attachment_path });
  const ids = L.items.filter(x => x.id).map(x => x.id);
  if (ids.length) { const ip = await supabaseClient.from('item_progress').select('item_id').in('item_id', ids); (ip.data || []).forEach(x => L.done.add(x.item_id)); }
  const ex = L.items.filter(x => x.kind === 'exam'); if (ex.length) { const at = await supabaseClient.from('quiz_attempts').select('id,quiz_id,score,total,status').in('quiz_id', ex.map(x => x.url)).order('created_at', { ascending: false }); (at.data || []).forEach(a => { if (!L.att[a.quiz_id]) L.att[a.quiz_id] = a; if (a.status !== 'pending' || true) L.done.add(L.items.find(x => x.url === a.quiz_id).id); }); }
  draw();
  const w = WANT ? L.items.findIndex(x => x.id === WANT) : -1; const first = w >= 0 ? w : Math.max(0, L.items.findIndex(x => x.id && !L.done.has(x.id)));
  if (L.items.length) show(L.items.length ? (first < 0 ? 0 : first) : 0);
}
function draw() {
  const i = L.lessons.findIndex(x => x.id === LID), pv = L.lessons[i - 1], nx = L.lessons[i + 1], real = L.items.filter(x => x.id), dn = real.filter(x => L.done.has(x.id)).length;
  $('#root').innerHTML = '<div><div class="ttl" id="ttl">' + esc(L.lesson.title) + '</div><div id="player"></div><div id="nt"></div>'
    + '<div class="nav"><button class="btn g" id="pv"' + (pv ? '' : ' disabled') + '>→ المحاضرة السابقة</button><button class="btn g" id="nx"' + (nx ? '' : ' disabled') + '>المحاضرة التالية ←</button></div></div>'
    + '<aside class="card side"><h2>محتوى المحاضرة</h2><div class="sub">' + esc(L.course && L.course.title) + (real.length ? ' • ' + dn + ' من ' + real.length + ' مكتمل' : '') + '</div><div id="its"></div></aside>';
  list();
  if (pv) $('#pv').onclick = () => location.href = 'lecture.html?id=' + pv.id; if (nx) $('#nx').onclick = () => location.href = 'lecture.html?id=' + nx.id;
  if (L.notes) $('#nt').innerHTML = '<div class="note">' + esc(L.notes) + '</div>';
}
function list() {
  $('#its').innerHTML = L.items.map((x, i) => '<div class="ci' + (i === L.cur ? ' on' : '') + (x.id && L.done.has(x.id) ? ' dn' : '') + '" data-i="' + i + '"><div class="g">' + ICON[x.kind] + ' ' + esc(x.title) + '</div><span class="ck">✓</span></div>').join('') || '<div class="ph" style="aspect-ratio:auto;margin-top:10px"><div><i>📭</i>لا يوجد محتوى لهذه المحاضرة بعد</div></div>';
  $$('.ci').forEach(el => el.onclick = () => show(+el.dataset.i));
}
function embedOf(u) {
  let m;
  if (/youtu/.test(u) && (m = u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/))) return { src: 'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&disablekb=1&origin=' + encodeURIComponent(location.origin), yt: 1 };
  if (/drive\.google\.com/.test(u) && (m = u.match(/\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/))) return { src: 'https://drive.google.com/file/d/' + m[1] + '/preview', dr: 1 };
  if ((m = u.match(/vimeo\.com\/(\d+)/))) return { src: 'https://player.vimeo.com/video/' + m[1] };
  return /^https:\/\//.test(u) ? { src: u } : null;
}
async function show(i) {
  const x = L.items[i]; if (!x) return; L.cur = i; clearTimeout(L.timer); clearInterval(L.wmT); list();
  $('#ttl').textContent = x.title + ' | ' + L.lesson.title;
  const p = currentProfile, wm = [p.first_name, p.last_name].join(' ') + ' • ' + p.phone_number;
  if (x.kind === 'exam') return showExam(x);
  if (x.path) { const { data: s, error } = await supabaseClient.storage.from('lesson-files').createSignedUrl(x.path, 3600); if (error) { $('#player').innerHTML = '<div class="ph"><div><i>⚠️</i>تعذر فتح الملف</div></div>'; return; } window.open(s.signedUrl, '_blank', 'noopener'); $('#player').innerHTML = '<div class="ph"><div><i>📄</i>تم فتح الملف في تبويب جديد</div></div>'; return; }
  if (x.kind === 'link') { $('#player').innerHTML = '<div class="card xq"><h3>' + esc(x.title) + '</h3><p>رابط خارجي</p><a class="btn" href="' + esc(x.url) + '" target="_blank" rel="noopener">فتح الرابط</a></div>'; schedule(x); return; }
  const e = embedOf(x.url);
  if (!e) { $('#player').innerHTML = '<div class="ph"><div><i>⚠️</i>الرابط غير صالح</div></div>'; return; }
  $('#player').innerHTML = '<div class="vwrap' + (x.kind === 'pdf' ? ' pdf' : '') + '" id="vw"><iframe src="' + esc(e.src) + '" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>' + (e.yt ? '<div class="sh t"></div><div class="sh b"></div>' : '') + (e.dr ? '<div class="sh dr"></div>' : '') + '<div class="wm" id="wm">' + esc(wm) + '</div></div>';
  const w = $('#wm'), box = $('#vw'), mv = () => { w.style.top = (8 + Math.random() * Math.max(10, box.clientHeight - 50)) + 'px'; w.style.left = (8 + Math.random() * Math.max(10, box.clientWidth - w.clientWidth - 16)) + 'px'; };
  mv(); L.wmT = setInterval(mv, 4000); schedule(x);
}
async function showExam(x) {
  $('#player').innerHTML = '<div class="card xq"><div class="ph" style="border:0;aspect-ratio:auto"><div><i>⏳</i></div></div></div>';
  const { data: q } = await supabaseClient.from('quizzes').select('id,title,opens_at,closes_at,max_attempts,time_limit_minutes').eq('id', x.url).maybeSingle();
  if (!q) { $('#player').innerHTML = '<div class="card xq"><h3>الامتحان غير متاح</h3><p>تأكد إنك مشترك في الكورس.</p></div>'; return; }
  const a = L.att[q.id], n = Date.now(), o = q.opens_at && new Date(q.opens_at) > n, cl = q.closes_at && new Date(q.closes_at) < n;
  $('#player').innerHTML = '<div class="card xq"><h3>📝 ' + esc(q.title) + '</h3><p>' + (q.time_limit_minutes ? '⏱ ' + q.time_limit_minutes + ' دقيقة • ' : '') + 'عدد المحاولات: ' + q.max_attempts + (a ? '<br>تم الحل: ' + (a.total ? Math.round(a.score / a.total * 100) : 0) + '%' : '') + (o ? '<br>يفتح ' + new Date(q.opens_at).toLocaleString('ar-EG') : '') + '</p>'
    + (o ? '<b style="color:var(--muted)">قريباً</b>' : cl ? '<b style="color:#dc2626">انتهى وقت الامتحان</b>' : '<a class="btn" href="quiz.html?id=' + q.id + '">' + (a ? 'عرض النتيجة / محاولة أخرى' : 'ابدأ الامتحان') + '</a>') + '</div>';
}
function schedule(x) { if (!x.id || L.done.has(x.id)) return; L.timer = setTimeout(() => markDone(x), 8000); }   // بعد 8 ثواني مشاهدة يتحسب العنصر مكتمل
async function markDone(x) {
  const { error } = await supabaseClient.from('item_progress').insert({ student_id: currentUser.id, item_id: x.id });
  if (error && error.code !== '23505') return;
  L.done.add(x.id); list();
  const real = L.items.filter(y => y.id);
  if (real.length && real.every(y => L.done.has(y.id))) { await supabaseClient.from('lesson_progress').insert({ student_id: currentUser.id, lesson_id: LID }); toast('أحسنت! أنهيت المحاضرة ✅'); }
  const s = $('.side .sub'); if (s) s.textContent = (L.course ? L.course.title : '') + ' • ' + real.filter(y => L.done.has(y.id)).length + ' من ' + real.length + ' مكتمل';
}
document.addEventListener('contextmenu', e => { if (e.target.closest('.vwrap')) e.preventDefault(); });
if (window.currentProfile) init(); else document.addEventListener('auth-ready', init);
</script>
