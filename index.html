<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Leader In English - Mr. Sherif Khafagy</title>
    <!-- استدعاء خط Cairo الاحترافي المريح للعين -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة Supabase للربط بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* الوضع الفاتح: تصميم ناصح، مرتب، أبيض هادئ مع درجات كحلي وذهبي خفيف */
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --border-subtle: #e2e8f0;
            --primary-color: #1e3a8a; /* كحلي ملكي رايق */
            --accent-gold: #d97706;   /* لمسة ذهبية شيك */
            --shadow-subtle: 0 4px 20px rgba(15, 23, 42, 0.05);
            --shadow-hover: 0 10px 30px rgba(15, 23, 42, 0.1);
        }

        [data-theme="dark"] {
            /* الوضع الداكن: كحلي داكن فخم جداً ومريح للقراءة مش أسود مطفي */
            --bg-page: #090d16;
            --card-bg: #111827;
            --text-main: #f9fafb;
            --text-secondary: #9ca3af;
            --border-subtle: #1f2937;
            --primary-color: #3b82f6;
            --accent-gold: #fbbf24;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            position: relative;
        }

        /* زر تبديل الثيم المرتب في الزاوية */
        .theme-toggle {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            box-shadow: var(--shadow-subtle);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        .theme-toggle:hover {
            border-color: var(--primary-color);
        }

        /* الهيدر العلوي المرتب */
        header {
            text-align: center;
            margin-top: 15px;
            z-index: 2;
        }

        .teacher-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .teacher-title span {
            color: var(--accent-gold);
        }

        .developer-credit {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* الكارت الرئيسي المنظم في المنتصف */
        .main-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 650px;
            text-align: center;
            box-shadow: var(--shadow-subtle);
            margin: auto 0;
            position: relative;
            z-index: 2;
        }

        .platform-title {
            font-size: clamp(32px, 4vw, 44px);
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 12px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        /* مؤشر الكتابة الهادئ اللي بيختفي أول ما الجملة تخلص */
        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 38px;
            background-color: var(--primary-color);
            margin-right: 5px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }
        .typing-cursor.hidden {
            display: none !important;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .platform-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-weight: 600;
        }

        /* أزرار التسجيل (Sign Up & Sign In) منظمة بشكل احترافي مريح */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-signup {
            background-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(30, 58, 138, 0.2);
        }
        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .btn-signin {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--border-subtle);
        }
        .btn-signin:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        footer {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            z-index: 2;
            font-weight: 600;
        }

        /* شاشات الموبايل */
        @media(max-width: 600px) {
            .actions-grid {
                grid-template-columns: 1fr;
            }
            .main-container {
                padding: 35px 20px;
            }
        }
    </style>
</head>
<body data-theme="light">

    <!-- زر تبديل الثيم -->
    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">الوضع الداكن</span>
    </button>

    <!-- الهيدر -->
    <header>
        <h1 class="teacher-title">Mr. Sherif Khafagy <span>★</span></h1>
        <div class="developer-credit">Developed By / Mohamed Sherif Khafagy</div>
    </header>

    <!-- المحتوى الرئيسي المنظم -->
    <div class="main-container">
        <h2 class="platform-title">
            <span id="typedText"></span><span class="typing-cursor" id="typingCursor"></span>
        </h2>
        <p class="platform-subtitle">المنصة التعليمية الرسمية لمادة اللغة الإنجليزية للثانوية العامة</p>

        <div class="actions-grid">
            <!-- Sign In (على الشمال) -->
            <a href="signin.html" class="btn btn-signin">تسجيل الدخول</a>
            <!-- Sign Up (على اليمين) -->
            <a href="signup.html" class="btn btn-signup">حساب جديد</a>
        </div>
    </div>

    <footer>
        &copy; 2026 The Leader In English. All Rights Reserved.
    </footer>

    <script>
        // ==========================================
        // 1. كود الاتصال بقاعدة البيانات (Supabase)
        // ==========================================
        const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lNpmx_7cT_frhxmkMKnlVQ_D9MhsqWi';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function verifyDatabaseConnection() {
            try {
                const { error } = await supabaseClient.from('profiles').select('id', { count: 'exact', head: true });
                if (!error) console.log("Database connected and stable.");
            } catch (err) {
                console.log("Database initialized.");
            }
        }

        // ==========================================
        // 2. إدارة الثيمات (داكن / فاتح)
        // ==========================================
        function initTheme() {
            const savedTheme = localStorage.getItem('platform_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            updateThemeUI(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('platform_theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'dark') {
                icon.innerText = '☀️';
                text.innerText = 'الوضع الفاتح';
            } else {
                icon.innerText = '🌙';
                text.innerText = 'الوضع الداكن';
            }
        }

        // ==========================================
        // 3. كتابة العنوان حرف بحرف وإخفاء المؤشر
        // ==========================================
        const textTarget = document.getElementById('typedText');
        const cursorTarget = document.getElementById('typingCursor');
        const phrase = "The Leader In English";
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < phrase.length) {
                textTarget.innerHTML += phrase.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 80);
            } else {
                cursorTarget.classList.add('hidden'); // يختفي تماماً بـشياكة
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            verifyDatabaseConnection();
            setTimeout(typeWriter, 400);
        });
    </script>
</body>
</html>
