<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Leader In English - Mr. Sherif Khafagy</title>
    <!-- استدعاء خطوط Google الفخمة -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- استدعاء مكتبة Supabase للربط الحقيقي بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* ثيم الفاتح العصري الفخم (أزرق سماوي عميق مع لمسات تيتانيوم وفيروزي) */
            --bg-base: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #090d16;
            --text-muted: #475569;
            --accent-1: #0ea5e9;
            --accent-2: #6366f1;
            --accent-3: #ec4899;
            --glow-color: rgba(14, 165, 233, 0.35);
            --shadow-color: rgba(15, 23, 42, 0.08);
        }

        [data-theme="dark"] {
            /* ثيم الداكن الخرافي المريح (أزرق فضاء عميق مزيج مع كحلي ستيل) */
            --bg-base: #030712;
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-1: #38bdf8;
            --accent-2: #818cf8;
            --accent-3: #f472b6;
            --glow-color: rgba(56, 189, 248, 0.45);
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease, transform 0.3s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            padding: 30px 20px;
            position: relative;
        }

        /* خلفية ديناميكية متحركة تفاعلية تملى الفراغ وتلغي أي إحساس بالبدائية */
        .dynamic-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            filter: blur(100px);
            border-radius: 50%;
            opacity: 0.5;
            animation: moveBlob 12s infinite alternate ease-in-out;
        }

        .blob-1 {
            top: -10%;
            right: -10%;
            width: 450px;
            height: 450px;
            background: var(--accent-1);
        }

        .blob-2 {
            bottom: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: var(--accent-2);
            animation-delay: -4s;
        }

        .blob-3 {
            top: 40%;
            left: 30%;
            width: 350px;
            height: 350px;
            background: var(--accent-3);
            opacity: 0.25;
            animation-delay: -8s;
        }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.15); }
        }

        /* زر تبديل الثيم العصري الفاخر */
        .theme-toggle {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 8px 32px var(--shadow-color);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(16px);
        }
        .theme-toggle:hover {
            transform: scale(1.08) translateY(-2px);
            border-color: var(--accent-1);
        }

        /* الهيدر العلوي الخرافي */
        header {
            text-align: center;
            margin-top: 10px;
            position: relative;
            z-index: 2;
        }

        .teacher-badge {
            display: inline-block;
            padding: 6px 18px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px var(--shadow-color);
        }

        .teacher-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            display: inline-block;
            filter: drop-shadow(0 0 25px var(--glow-color));
        }

        /* إضاءة ليد سفلية نابضة تحت اسم المستر */
        .teacher-title::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 10%;
            width: 80%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-1), var(--accent-3), transparent);
            box-shadow: 0 0 15px var(--accent-1);
            border-radius: 50%;
            animation: pulseLed 3s infinite ease-in-out;
        }

        .developer-credit {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        @keyframes pulseLed {
            0%, 100% { opacity: 0.5; transform: scaleX(0.9); }
            50% { opacity: 1; transform: scaleX(1.1); }
        }

        /* منتصف الشاشة: كارت زجاجي محترف ومجسّم */
        .hero-section {
            text-align: center;
            margin: auto 0;
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 850px;
            padding: 45px 30px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px var(--shadow-color);
        }

        .main-heading {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(30px, 5vw, 56px);
            font-weight: 900;
            color: var(--text-main);
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
        }

        .main-heading span {
            background: linear-gradient(90deg, var(--text-main), var(--accent-1));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--glow-color);
        }

        /* مؤشر الكتابة الاحترافي */
        .typing-cursor {
            display: inline-block;
            width: 4px;
            height: 50px;
            background-color: var(--accent-1);
            margin-right: 6px;
            animation: blinkCursor 0.8s infinite;
            box-shadow: 0 0 15px var(--accent-1);
            vertical-align: middle;
            border-radius: 2px;
        }
        .typing-cursor.hidden {
            display: none !important;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .hero-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            margin-top: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* أزرار الإجراءات (Sign Up & Sign In) مع ليد دوار ثلاثي الأبعاد */
        .actions-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            width: 100%;
            max-width: 600px;
            z-index: 2;
        }

        .led-btn-wrapper {
            position: relative;
            flex: 1;
            border-radius: 20px;
            padding: 3px; /* مساحة دوران الإضاءة */
            overflow: hidden;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
            box-shadow: 0 15px 35px var(--shadow-color);
        }

        /* إضاءة الليد الدوارة الميكانيكية */
        .led-btn-wrapper::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: conic-gradient(transparent, transparent, transparent, var(--accent-1), var(--accent-2), var(--accent-3));
            animation: rotateLed 3.5s linear infinite;
        }

        @keyframes rotateLed {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .led-btn {
            position: relative;
            background: var(--glass-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px 24px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 800;
            z-index: 1;
            backdrop-filter: blur(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease, color 0.3s ease;
        }

        .led-btn:hover {
            transform: translateY(-5px);
            background: var(--accent-1);
            color: #ffffff;
            box-shadow: 0 10px 25px var(--glow-color);
        }

        footer {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            z-index: 2;
            letter-spacing: 1px;
            font-weight: 600;
        }

        @media(max-width: 768px) {
            .actions-container {
                flex-direction: column;
                gap: 18px;
            }
            .hero-section {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <!-- خلفية ديناميكية متحركة بالبلازما والألوان الفخمة -->
    <div class="dynamic-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- زر تبديل الثيم -->
    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span> <span id="themeText">الوضع الفاتح</span>
    </button>

    <!-- الهيدر الفخم المخصص -->
    <header>
        <div class="teacher-badge">Official Learning Portal</div>
        <h1 class="teacher-title">Mr. Sherif Khafagy</h1>
        <div class="developer-credit">Developed By / Mohamed Sherif Khafagy</div>
    </header>

    <!-- الكارت الزجاجي المركزي واسم المنصة -->
    <div class="hero-section">
        <h2 class="main-heading">
            <span id="typedText"></span><span class="typing-cursor" id="typingCursor"></span>
        </h2>
        <p class="hero-subtitle">المنصة التعليمية الأولى في مصر لتأهيلك للدرجة النهائية باحترافية</p>
    </div>

    <!-- الأزرار السفلية بإضاءة ليد تفاعلية -->
    <div class="actions-container">
        <!-- Sign Up (يمين) -->
        <div class="led-btn-wrapper">
            <a href="signup.html" class="led-btn">إنشاء حساب جديد (Sign Up)</a>
        </div>
        <!-- Sign In (يسار) -->
        <div class="led-btn-wrapper">
            <a href="signin.html" class="led-btn">تسجيل الدخول (Sign In)</a>
        </div>
    </div>

    <footer>
        &copy; 2026 The Leader In English. All Rights Reserved.
    </footer>

    <script>
        // ==========================================
        // 1. كود الاتصال وقاعدة البيانات الحية (Supabase)
        // ==========================================
        const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lNpmx_7cT_frhxmkMKnlVQ_D9MhsqWi';
        
        // تهيئة عميل قاعدة البيانات
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function verifyDatabaseSync() {
            try {
                const { count, error } = await supabaseClient
                    .from('profiles')
                    .select('*', { count: 'exact', head: true });
                
                if (!error) {
                    console.log("Database connection verified successfully. Total registered profiles:", count);
                }
            } catch (err) {
                console.warn("Database initialization pending network response.");
            }
        }

        // ==========================================
        // 2. نظام الثيمات الذكي المتقدم
        // ==========================================
        function initTheme() {
            const savedTheme = localStorage.getItem('platform_theme') || 'dark'; // الافتراضي الداكن الفخم ينافس المنصات الكبرى
            document.body.setAttribute('data-theme', savedTheme);
            updateThemeToggleUI(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('platform_theme', newTheme);
            updateThemeToggleUI(newTheme);
        }

        function updateThemeToggleUI(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'dark') {
                icon.innerText = '☀️';
                text.innerText = 'الوضع الفاتح';
            } else {
                icon.innerText = '🌙';
                text.innerText = 'الوضع الداكن';
            }
        }

        // ==========================================
        // 3. محرك الكتابة التلقائية الاحترافي
        // ==========================================
        const textTarget = document.getElementById('typedText');
        const cursorTarget = document.getElementById('typingCursor');
        const phrase = "The Leader In English";
        let charIndex = 0;

        function typeWriterEffect() {
            if (charIndex < phrase.length) {
                textTarget.innerHTML += phrase.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriterEffect, 90);
            } else {
                // إخفاء مؤشر الكتابة للأبد فور انتهاء النص لمنع أي إزعاج بصري
                cursorTarget.classList.add('hidden');
            }
        }

        // التشغيل التلقائي فور تحميل الرندر
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            verifyDatabaseSync();
            setTimeout(typeWriterEffect, 500);
        });
    </script>
</body>
</html>
