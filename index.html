<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Leader In English - المنصة التعليمية</title>
    <!-- استدعاء خط Cairo للعناوين والنصوص العربية الفخمة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* وضع الفاتح (الافتراضي للزائر الجديد) - درجات كشميرية ناعمة / أزرق سماوي هادئ ورايق مريح للعين */
            --bg-gradient: linear-gradient(135deg, #f4f7f6 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.4);
            --border-color: rgba(2, 132, 199, 0.2);
            --led-color: #00d2ff;
        }

        [data-theme="dark"] {
            /* الوضع الداكن - ألوان فخمة جداً (أزرق داكن ممزوج بـ تيتانيوم) بعيد عن السواد التام */
            --bg-gradient: linear-gradient(135deg, #0b1120 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.6);
            --border-color: rgba(56, 189, 248, 0.3);
            --led-color: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background 0.4s ease, color 0.4s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            position: relative;
        }

        /* زر تبديل الوضع (داكن / فاتح) السري العائم */
        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle:hover {
            transform: scale(1.05);
        }

        /* الهيدر العلوي: اسم المستر والتوقيع */
        header {
            text-align: center;
            margin-top: 10px;
            position: relative;
            z-index: 2;
        }

        .teacher-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #f59e0b, #ec4899, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 25px var(--accent-glow);
        }

        /* إضاءة الليد الهادئة تحت اسم المستر */
        .teacher-title::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 10%;
            width: 80%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--led-color), transparent);
            box-shadow: 0 0 12px var(--led-color);
            border-radius: 50%;
            animation: pulseLed 3s infinite ease-in-out;
        }

        .developer-credit {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* منتصف الشاشة: العنوان الرئيسي والآلة الكتابية المنسابة */
        .hero-section {
            text-align: center;
            margin: auto 0;
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 800px;
            padding: 0 15px;
        }

        .main-heading {
            font-size: clamp(32px, 5vw, 64px);
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 20px;
            min-height: 85px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
        }

        /* إضاءة ليد خلفية وعلوية لاسم المنصة */
        .main-heading span {
            text-shadow: 0 0 20px var(--accent-glow);
        }

        /* مؤشر الكتابة المخصص (يتشيل تماماً لما الجملة تخلص) */
        .typing-cursor {
            display: inline-block;
            width: 4px;
            height: 50px;
            background-color: var(--accent-primary);
            margin-right: 5px;
            animation: blinkCursor 0.8s infinite;
            box-shadow: 0 0 10px var(--accent-primary);
            vertical-align: middle;
            border-radius: 2px;
        }
        .typing-cursor.hidden {
            display: none !important;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes pulseLed {
            0%, 100% { opacity: 0.6; transform: scaleX(0.95); }
            50% { opacity: 1; transform: scaleX(1.05); }
        }

        /* الأزرار أو الأشكال في الأسفل (Sign Up & Sign In) مع إضاءة ليد تدور حولها */
        .actions-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 550px;
            z-index: 2;
        }

        .led-btn-wrapper {
            position: relative;
            flex: 1;
            border-radius: 16px;
            padding: 3px; /* مساحة لدوران الليد */
            overflow: hidden;
            background: linear-gradient(0deg, rgba(255,255,255,0.1), rgba(255,255,255,0.1));
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* حركة الليد الدوارة السحرية */
        .led-btn-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, var(--accent-primary));
            animation: rotateLed 4s linear infinite;
        }

        @keyframes rotateLed {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .led-btn {
            position: relative;
            background: var(--card-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 24px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            z-index: 1;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .led-btn:hover {
            transform: translateY(-3px);
            background: var(--accent-primary);
            color: #ffffff;
        }

        /* تفصيل بسيط لتنسيق الفوتر العام */
        footer {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            z-index: 2;
            letter-spacing: 0.5px;
        }

        /* تكييف الأجهزة الصغيرة */
        @media(max-width: 600px) {
            .actions-container {
                flex-direction: column;
                gap: 15px;
            }
            .teacher-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body data-theme="light">

    <!-- زر التحكم بالوضع الداكن / الفاتح -->
    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">الوضع الداكن</span>
    </button>

    <!-- الهيدر: اسم المستر مع الليد والتوقيع المطلوب -->
    <header>
        <h1 class="teacher-title">Mr. Sherif Khafagy</h1>
        <div class="developer-credit">Developed By / Mohamed Sherif Khafagy</div>
    </header>

    <!-- منتصف الشاشة: اسم المنصة بالكتابة التلقائية الحرفية والمؤشر الذكي -->
    <div class="hero-section">
        <h2 class="main-heading">
            <span id="typedText"></span><span class="typing-cursor" id="typingCursor"></span>
        </h2>
    </div>

    <!-- الأشكال والشاشات التحتية: Sign Up على اليمين و Sign In على الشمال مع ليد يدور -->
    <div class="actions-container">
        <!-- Sign Up (ليمين الواجهة في RTL) -->
        <div class="led-btn-wrapper">
            <a href="signup.html" class="led-btn">إنشاء حساب (Sign Up)</a>
        </div>
        <!-- Sign In (يسار الواجهة في RTL) -->
        <div class="led-btn-wrapper">
            <a href="signin.html" class="led-btn">تسجيل الدخول (Sign In)</a>
        </div>
    </div>

    <footer>
        &copy; 2026 The Leader In English. All Rights Reserved.
    </footer>

    <script>
        // التحقق الذكي من قاعدة البيانات المححلية أو سجل الطالب القديم لتحديد الوضع الافتراضي
        // لو الطالب دخل قبل كده مسجل أو مفعل ثيم، بنظبطه، لو لأ بنخليه الوضع الفاتح الأساسي
        function initTheme() {
            const savedTheme = localStorage.getItem('platform_theme');
            const hasVisitedBefore = localStorage.getItem('student_logged_in'); // مؤشر ارتباطه بقاعدة البيانات سابقاً
            
            if (savedTheme) {
                document.body.setAttribute('data-theme', savedTheme);
                updateThemeToggleUI(savedTheme);
            } else if (hasVisitedBefore === 'true') {
                // الطالب القديم يفتح له الوضع الداكن الفخم مباشرة لو مفضل
                document.body.setAttribute('data-theme', 'dark');
                updateThemeToggleUI('dark');
            } else {
                // الطالب الجديد يفتح على الفاتح الرايق المريح
                document.body.setAttribute('data-theme', 'light');
                updateThemeToggleUI('light');
            }
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('platform_theme', newTheme);
            updateThemeToggleUI(newTheme);
        }

        function updateThemeToggleUI(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'dark') {
                icon.innerText = '☀️';
                text.innerText = 'الوضع الفاتح';
            } else {
                icon.innerText = '🌙';
                text.innerText = 'الوضع الداكن';
            }
        }

        // تأثير الكتابة حرف بحرف الحصري وإزالة المؤشر تماماً فور انتهاء الجملة نهائياً
        const textTarget = document.getElementById('typedText');
        const cursorTarget = document.getElementById('typingCursor');
        const phrase = "The Leader In English";
        let charIndex = 0;

        function typeWriterEffect() {
            if (charIndex < phrase.length) {
                textTarget.innerHTML += phrase.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriterEffect, 110); // سرعة كتابة رايقة ومريحة
            } else {
                // الجملة خلصت تماماً: إخفاء مؤشر الكتابة المزعج فوراً
                cursorTarget.classList.add('hidden');
            }
        }

        // تشغيل الآلة الحرفية بعد تحميل الصفحة بقليل
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            setTimeout(typeWriterEffect, 500);
        });
    </script>
</body>
</html>
