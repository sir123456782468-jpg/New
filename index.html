    return '<section class="sc rv" id="cards"><div class="w">' + head(C.cards_title, C.cards_sub) + '<div class="cards">' + C.cards.map(function (c) { return '<div class="fc" style="--t:' + esc(c.tint) + '"><div class="e">' + esc(c.icon) + '</div><h3>' + esc(c.title) + '</h3><p>' + esc(c.text) + '</p></div>'; }).join('') + '</div></div></section>';
  }
  function gradesHtml() {
    var g = C.grades.filter(function (x) { return x.on !== false; }); if (!C.show_grades || !g.length) return '';
    return '<section class="sc rv" id="grades"><div class="w">' + head(C.grades_title, C.grades_sub) + '<div class="grades">' + g.map(function (x) { return '<a class="gp" href="#courses" data-grade="' + esc(x.name) + '"><span>' + esc(x.name) + '</span>' + (x.en ? '<small>' + esc(x.en) + '</small>' : '') + (x.desc ? '<em>' + esc(x.desc) + '</em>' : '') + '</a>'; }).join('') + '</div></div></section>';
  }
  function ctaHtml() {
    if (!C.show_cta) return '';
    var u = loggedIn ? '/home.html' : safe(C.cta_url), t = loggedIn ? C.btn_in_text : C.cta_btn;
    return '<div class="w rv"><div class="final" id="cta"><h2>' + esc(C.cta_title) + '</h2>' + (C.cta_sub ? '<p>' + esc(C.cta_sub) + '</p>' : '') + '<a class="btn bp" href="' + esc(u) + '">' + esc(t) + '</a></div></div>';
  }
  function footHtml() {
    return window.SiteFooter ? SiteFooter.html(C, { name: D.platform_name, teacher: D.teacher_name, onIndex: true, loggedIn: loggedIn }) : '';
  }
  function menuHtml() {
    var links = C.show_nav ? C.nav.map(function (n) { return '<a href="' + esc(safe(n.href)) + '">' + esc(n.label) + '</a>'; }).join('') : '';
    var b = loggedIn ? '<a class="btn bw" href="/home.html">' + esc(C.btn_in_text) + '</a>' : ((C.nav_signup ? '<a class="btn bp" href="/signup.html">' + esc(C.nav_signup_text) + '</a>' : '') + (C.nav_login ? '<a class="btn bg" href="/signin.html">' + esc(C.nav_login_text) + '</a>' : ''));
    return '<button class="cl" id="mclose" aria-label="إغلاق">✕</button>' + links + b;
  }
  var SECT = { courses: coursesHtml, mock: mockHtml, cards: cardsHtml, grades: gradesHtml, cta: ctaHtml };
  function render() {
    C = LP_merge(D.cfg); applyVars(); loggedIn = detectIn() && !PREVIEW;
    document.title = C.seo_title || document.title;
    var md = document.querySelector('meta[name=description]'); if (md) md.setAttribute('content', C.seo_desc || '');
    var html = heroHtml() + stripHtml() + C.order.filter(function (k) { return SECT[k]; }).map(function (k) { return SECT[k](); }).join('') + footHtml();
    $('#app').innerHTML = html; $('#mm').innerHTML = menuHtml();
    reveal();
  }
  function reveal() {
    var els = document.querySelectorAll('.rv:not(.in)');
    if (!('IntersectionObserver' in window) || PREVIEW) { els.forEach(function (e) { e.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (en) { en.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }); }, { rootMargin: '0px 0px -8% 0px', threshold: .05 });
    els.forEach(function (e) { io.observe(e); });
    setTimeout(function () { els.forEach(function (e) { e.classList.add('in'); }); }, 2500);
  }
  function redrawGrid() { var g = $('#cgrid'); if (g) { g.innerHTML = gridHtml(); reveal(); } }
  // —— نافذة الكورس
  function openCourse(id) {
    var c = D.courses.filter(function (x) { return x.id === id; })[0]; if (!c) return;
    var y = YC[c.year] || ['#1e3a8a', '#7a1558', '📚'], free = !(+c.price > 0), mn = mins(c.minutes);
    var act = loggedIn ? '<a class="btn bp" href="' + courseUrl(c) + '">فتح الكورس ←</a>' : '<a class="btn bp" href="/signup.html">إنشاء حساب</a><a class="btn bd" href="/signin.html">تسجيل الدخول</a>';
    $('#mdb').innerHTML = '<button class="x" id="mx" aria-label="إغلاق">✕</button><div class="cv" style="--c1:' + y[0] + ';--c2:' + y[1] + '">' + (c.thumb ? '<img src="' + esc(c.thumb) + '" alt="" onerror="this.remove()">' : '<span>' + y[2] + '</span>') + (c.year ? '<span class="gb">' + esc(c.year) + '</span>' : '') + '</div><div class="bd"><h3>' + esc(c.title) + '</h3>' + (c.desc ? '<p class="ds">' + esc(c.desc) + '</p>' : '')
      + '<div class="stt">' + (C.show_price ? '<span>' + (free ? '🆓 مجاني' : '💰 ' + esc(c.price) + ' ج.م') + '</span>' : '') + '<span>📚 ' + (c.lessons || 0) + ' درس</span>' + (mn ? '<span>⏱ ' + mn + '</span>' : '') + (c.free > 0 ? '<span>🎁 ' + c.free + ' درس مجاني</span>' : '') + '<span>👨‍🏫 ' + esc(D.teacher_name) + '</span></div><div class="ac">' + act + '</div>' + (loggedIn ? '' : '<p class="note">سجّل دخولك عشان تشترك وتبدأ الكورس.</p>') + '</div>';
    $('#md').classList.add('on'); document.body.style.overflow = 'hidden'; var x = $('#mx'); if (x) x.focus();
  }
  function closeModal() { $('#md').classList.remove('on'); document.body.style.overflow = ''; }
  function menu(on) { $('#mm').classList.toggle('on', on); document.body.style.overflow = on ? 'hidden' : ''; }
  // —— الأحداث (تفويض)
  document.addEventListener('click', function (e) {
    var t = e.target;
    var a = t.closest && t.closest('a[href]');
    if (PREVIEW && a) { var h = a.getAttribute('href'); if (!/^#/.test(h) || h === '#') { e.preventDefault(); return; } }
    if (t.closest('#mbtn')) return menu(true);
    if (t.closest('#mclose') || (t.closest('#mm') && a)) menu(false);
    var tab = t.closest('[data-tab]'); if (tab) { ST.tab = tab.getAttribute('data-tab'); document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === ST.tab); }); return redrawGrid(); }
    var g = t.closest('[data-grade]'); if (g && C.show_courses && $('#courses')) { ST.tab = g.getAttribute('data-grade'); var has = D.courses.some(function (c) { return c.year === ST.tab; }); if (!has) ST.tab = ''; var cs = document.querySelector('#courses'); if (cs) { var old = cs.querySelector('.tabs'); if (old) old.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === ST.tab); }); } redrawGrid(); }
    if (a && a.getAttribute('href') === '#support') { e.preventDefault(); openSupport(); return; }
    var card = t.closest('.cc'); if (card) return openCourse(card.getAttribute('data-id'));
    if (t.id === 'md' || t.closest('#mx')) closeModal();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeModal(); menu(false); } if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('cc')) { e.preventDefault(); openCourse(e.target.getAttribute('data-id')); } });
  document.addEventListener('input', function (e) { if (e.target.id === 'cq') { ST.q = e.target.value; redrawGrid(); } });
  // —— الدعم الفني (فني بس — برّه المنصة)
  var supportLoaded = false;
  function loadSupport() {
    if (PREVIEW || supportLoaded || !C.show_support) return; supportLoaded = true;
    var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = function () {
      try { window.supabaseClient = window.supabase.createClient(SB, KEY); } catch (e) { return; }
      var w = document.createElement('script'); w.src = '/support-widget.js'; document.body.appendChild(w);
    }; document.head.appendChild(s);
  }
  function openSupport() { if (PREVIEW) return; if (!supportLoaded) loadSupport(); var n = 0, t = setInterval(function () { var b = document.getElementById('spw-b'); if (b) { clearInterval(t); b.click(); } else if (++n > 40) clearInterval(t); }, 150); }
  // —— تحميل البيانات (من الكاش فوراً ثم تحديث من السيرفر)
  function cacheGet() { try { return JSON.parse(localStorage.getItem('lp_cache_v1') || 'null'); } catch (e) { return null; } }
  function cacheSet(d) { try { localStorage.setItem('lp_cache_v1', JSON.stringify(d)); } catch (e) {} }
  function loadPhoto(v) {
    if (!v) { photo = null; try { localStorage.removeItem('lp_photo_v1'); } catch (e) {} return Promise.resolve(); }
    try { var c = JSON.parse(localStorage.getItem('lp_photo_v1') || 'null'); if (c && c.v === v && c.p) { photo = c.p; return Promise.resolve(); } } catch (e) {}
    return rpc('landing_photo').then(function (p) { photo = typeof p === 'string' && /^data:image\//.test(p) ? p : null; try { localStorage.setItem('lp_photo_v1', JSON.stringify({ v: v, p: photo })); } catch (e) {} }).catch(function () {});
  }
  function fetchAll(cfgOverride) {
    return rpc('landing_get', cfgOverride ? { p_cfg: cfgOverride } : {}).then(function (d) {
      if (!d || typeof d !== 'object') throw new Error('bad');
      D.cfg = cfgOverride || d.cfg || {}; D.courses = d.courses || []; D.teacher_name = d.teacher_name || D.teacher_name; D.platform_name = d.platform_name || D.platform_name; D.photo_v = d.photo_v || null; D.failed = false;
      if (!PREVIEW) cacheSet({ cfg: d.cfg, courses: d.courses, teacher_name: D.teacher_name, platform_name: D.platform_name, photo_v: D.photo_v });
      return loadPhoto(D.photo_v);
    }).catch(function () { if (!D.loaded) D.failed = true; });
  }
  // —— وضع المعاينة من لوحة التحكم
  if (PREVIEW) {
    var lastCourseKey = '';
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin) return; var m = e.data; if (!m || m.type !== 'lp-preview') return;
      D.cfg = m.cfg || {}; if (m.teacher_name) D.teacher_name = m.teacher_name; if (m.platform_name) D.platform_name = m.platform_name; if ('photo' in m) photo = m.photo && /^data:image\//.test(m.photo) ? m.photo : null;
      var key = JSON.stringify([D.cfg.show_courses, D.cfg.courses_mode, D.cfg.courses_ids, D.cfg.courses_limit]);
      if (key !== lastCourseKey) { lastCourseKey = key; render(); fetchAll(D.cfg).then(function () { D.loaded = true; render(); }); } else render();
      if (m.scrollTo === 'top') window.scrollTo({ top: 0, behavior: 'smooth' }); else if (m.scrollTo === 'bottom') window.scrollTo({ top: 1e6, behavior: 'smooth' }); else if (m.scrollTo) { var el = document.getElementById(m.scrollTo); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
    window.parent.postMessage({ type: 'lp-ready' }, location.origin);
    render();
    return;
  }
  var cached = cacheGet();
  if (cached) { D.cfg = cached.cfg || {}; D.courses = cached.courses || []; D.teacher_name = cached.teacher_name || D.teacher_name; D.platform_name = cached.platform_name || D.platform_name; D.photo_v = cached.photo_v || null; D.loaded = true; try { var pc = JSON.parse(localStorage.getItem('lp_photo_v1') || 'null'); if (pc && pc.v === D.photo_v) photo = pc.p; } catch (e) {} }
  render();
  fetchAll().then(function () { D.loaded = true; render(); });
  (window.requestIdleCallback || function (f) { setTimeout(f, 1800); })(loadSupport);
  if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', function () { try { navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {}); } catch (e) {} });
})();
</script>
