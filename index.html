<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Leader In English | البداية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body {
            background: #f8fafc;
            background-image: radial-gradient(circle at 50% 50%, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            color: #1e293b;
            overflow: hidden;
            position: relative;
        }

        /* اسم الأستاذ فوق على الشمال */
        .instructor-brand {
            position: absolute;
            top: 25px;
            left: 35px;
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 18px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .instructor-brand i {
            color: #b8860b;
        }

        /* المحتوى الرئيسي في المنتصف */
        .hero-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: auto;
            width: 100%;
            max-width: 900px;
        }

        /* العنوان الرئيسي اللي بيتكتب حرف بحرف */
        .typing-title {
            font-size: 48px;
            font-weight: 900;
            color: #b8860b; /* لون دهبي رايق وواضح */
            margin-bottom: 15px;
            min-height: 70px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(184, 134, 11, 0.15);
            border-left: 3px solid #b8860b;
            padding-left: 5px;
            animation: blinkCursor 0.8s infinite;
        }

        @keyframes blinkCursor {
            0%, 100% { border-color: transparent; }
            50% { border-color: #b8860b; }
        }

        /* خط الليد المتحرك */
        .led-line {
            width: 150px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            border-radius: 4px;
            margin-bottom: 45px;
            position: relative;
            box-shadow: 0 0 10px #d4af37;
            animation: moveLed 3s ease-in-out infinite alternate;
        }

        @keyframes moveLed {
            0% { width: 100px; box-shadow: 0 0 5px #d4af37; }
            100% { width: 280px; box-shadow: 0 0 20px #d4af37, 0 0 30px #b8860b; }
        }

        /* أزرار Sign In و Sign Up (على اليمين والشمال أو جنب بعض بشكل فخم) */
        .actions-wrapper {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .led-btn {
            position: relative;
            padding: 16px 36px;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 16px;
            background: #ffffff;
            color: #0f172a;
            border: 2px solid #d4af37;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        /* إضاءة الليد اللي بتلف حوالين الزرار وتنبض */
        .led-btn::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 18px;
            background: linear-gradient(45deg, #d4af37, #f59e0b, #3b82f6, #d4af37);
            z-index: -1;
            opacity: 0.7;
            filter: blur(4px);
            animation: glowingLed 4s linear infinite;
        }

        @keyframes glowingLed {
            0% { filter: blur(4px); opacity: 0.6; }
            50% { filter: blur(8px); opacity: 1; }
            100% { filter: blur(4px); opacity: 0.6; }
        }

        .led-btn:hover {
            transform: translateY(-4px) scale(1.03);
            background: #0f172a;
            color: #d4af37;
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.3);
        }

        .led-btn.signup-btn {
            background: #0f172a;
            color: #fff;
        }

        .led-btn.signup-btn:hover {
            background: #d4af37;
            color: #0f172a;
        }

        /* الفوتر السفلي البسيط */
        .footer-note {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
        }

        /* تجاوب الشاشات الصغيرة */
        @media (max-width: 768px) {
            .typing-title { font-size: 32px; min-height: 50px; }
            .instructor-brand { top: 15px; left: 15px; font-size: 13px; padding: 6px 12px; }
            .actions-wrapper { flex-direction: column; width: 100%; gap: 15px; }
            .led-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- اسم الأستاذ فوق على الشمال -->
    <div class="instructor-brand">
        <i class="fa-solid fa-chalkboard-user"></i>
        <span>Mr. Sherif Khafagy</span>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="hero-container">
        <!-- العنوان المتحرك -->
        <h1 class="typing-title" id="typingText"></h1>
        
        <!-- خط الليد المتحرك -->
        <div class="led-line"></div>

        <!-- الأزرار بإنارة ليد -->
        <div class="actions-wrapper">
            <a href="login.html" class="led-btn">
                <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول (Sign In)
            </a>
            <a href="register.html" class="led-btn signup-btn">
                <i class="fa-solid fa-user-plus"></i> إنشاء حساب جديد (Sign Up)
            </a>
        </div>
    </div>

    <!-- الفوتر -->
    <div class="footer-note">
        جميع الحقوق محفوظة © The Leader In English
    </div>

    <script>
        // كود الكتابة حرف بحرف (Typing Effect)
        const textToType = "The Leader In English";
        let index = 0;
        const speed = 110; // سرعة الكتابة بالمللي ثانية

        function typeWriter() {
            if (index < textToType.length) {
                document.getElementById("typingText").innerHTML += textToType.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            }
        }

        // بدء الأنيميشن أول ما الصفحة تفتح
        window.onload = function() {
            setTimeout(typeWriter, 500);
        };
    </script>
</body>
</html>
