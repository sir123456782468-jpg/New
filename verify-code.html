<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الكود - The Leader In English</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #0284c7;
            --border-color: rgba(2, 132, 199, 0.2);
            --input-bg: rgba(255, 255, 255, 0.8);
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 50% 20%, #0f172a 0%, #0b1120 50%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --border-color: rgba(56, 189, 248, 0.25);
            --input-bg: rgba(15, 23, 42, 0.6);
            --error-color: #f87171;
            --success-color: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(12px);
        }
        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: var(--accent-primary);
        }

        header {
            text-align: center;
            margin-top: 15px;
            z-index: 2;
        }

        .teacher-title {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            backdrop-filter: blur(16px);
            margin: 20px 0;
            z-index: 2;
            text-align: center;
        }

        .form-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .form-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 25px;
            text-align: right;
        }

        label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 20px;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            font-weight: 900;
        }

        input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.25);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #10b981);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        footer {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            z-index: 2;
        }
    </style>
</head>
<body data-theme="light">

    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">الوضع الداكن</span>
    </button>

    <header>
        <h1 class="teacher-title">Mr. Sherif Khafagy</h1>
    </header>

    <div class="form-container">
        <h2 class="form-title">التحقق من البريد الإلكتروني</h2>
        <p class="form-subtitle">قمنا بإرسال كود مكون من 6 أرقام إلى بريدك الإلكتروني. أدخله أدناه للمتابعة وحفظ بياناتك.</p>
        
        <form id="verifyForm" onsubmit="handleVerify(event)">
            <div class="input-group">
                <label>كود التحقق (OTP)</label>
                <input type="text" id="otpCode" placeholder="••••••" maxlength="6" required autocomplete="off">
            </div>

            <button type="submit" class="submit-btn" id="verifyBtn">تحقق ومتابعة</button>
        </form>
    </div>

    <footer>
        &copy; 2026 The Leader In English. All Rights Reserved.
    </footer>

    <script>
        const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lNpmx_7cT_frhxmkMKnlVQ_D9MhsqWi';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function initTheme() {
            const savedTheme = localStorage.getItem('platform_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            updateThemeToggleUI(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('platform_theme', newTheme);
            updateThemeToggleUI(newTheme);
        }

        function updateThemeToggleUI(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'dark') {
                icon.innerText = '☀️';
                text.innerText = 'الوضع الفاتح';
            } else {
                icon.innerText = '🌙';
                text.innerText = 'الوضع الداكن';
            }
        }

        // جلب الإيميل الممرر عبر الـ URL
        const urlParams = new URLSearchParams(window.location.search);
        const userEmail = urlParams.get('email');

        async function handleVerify(event) {
            event.preventDefault();
            const enteredToken = document.getElementById('otpCode').value.trim();
            const verifyBtn = document.getElementById('verifyBtn');

            if (!userEmail) {
                alert('حدث خطأ، لم يتم العثور على البريد الإلكتروني. يرجى إعادة المحاولة من صفحة التسجيل.');
                window.location.href = 'index.html';
                return;
            }

            if (enteredToken.length < 6) {
                alert('يرجى إدخال الكود المكون من 6 أرقام كاملاً.');
                return;
            }

            verifyBtn.innerText = 'جاري التحقق...';

            try {
                // استرجاع البيانات المؤقتة والكود المخزن من الخطوة الأولى
                const storedDataString = localStorage.getItem('temp_signup_data');
                if (!storedDataString) {
                    alert('انتهت صلاحية الجلسة، يرجى التسجيل مرة أخرى.');
                    window.location.href = 'index.html';
                    return;
                }

                const storedData = JSON.parse(storedDataString);

                // مقارنة الكود المدخل بالكود اللي اتبعت عبر EmailJS
                if (storedData.otpCode !== enteredToken) {
                    alert('كود التحقق غير صحيح، تأكد من الأرقام المرسلة لبريدك.');
                    verifyBtn.innerText = 'تحقق ومتابعة';
                    return;
                }

                alert('تم التحقق من بريدك بنجاح يا فنان! جاري حفظ بياناتك في قاعدة البيانات...');

                // حفظ البيانات بشكل نهائي في جدول profiles في Supabase
                const { error: dbError } = await supabaseClient
                    .from('profiles')
                    .insert([
                        {
                            first_name: storedData.firstName,
                            middle_name: storedData.middleName,
                            last_name: storedData.lastName,
                            email: storedData.studentEmail,
                            student_phone: storedData.studentPhone,
                            parent_phone: storedData.parentPhone
                        }
                    ]);

                if (dbError) {
                    console.error(dbError);
                    alert('حدث خطأ أثناء حفظ بياناتك في قاعدة البيانات: ' + dbError.message);
                    verifyBtn.innerText = 'تحقق ومتابعة';
                    return;
                }

                alert('تم إنشاء الحساب وحفظ البيانات في قاعدة البيانات بنجاح!');
                
                // مسح البيانات المؤقتة والانتقال لصفحة تسجيل الدخول
                localStorage.removeItem('temp_signup_data');
                window.location.href = 'signin.html';

            } catch (err) {
                console.error(err);
                alert('حدث خطأ غير متوقع، يرجى المحاولة مرة أخرى.');
                verifyBtn.innerText = 'تحقق ومتابعة';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
        });
    </script>
</body>
</html>
