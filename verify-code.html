<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الكود - The Leader In English</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #ef4444;
            --border-color: rgba(239, 68, 68, 0.2);
            --input-bg: rgba(255, 255, 255, 0.8);
        }
        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 50% 20%, #0f172a 0%, #0b1120 50%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-primary: #f87171;
            --border-color: rgba(248, 113, 113, 0.25);
            --input-bg: rgba(15, 23, 42, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 25px; position: relative; }
        .theme-toggle { position: absolute; top: 25px; left: 25px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 18px; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 13px; z-index: 10; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(12px); }
        header { text-align: center; margin-top: 15px; z-index: 2; }
        .teacher-title { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 800; color: var(--accent-primary); }
        .form-container { width: 100%; max-width: 500px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); backdrop-filter: blur(16px); margin: 20px 0; z-index: 2; text-align: center; }
        .form-title { font-size: 22px; font-weight: 800; margin-bottom: 15px; color: var(--text-main); }
        .form-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; text-align: right; }
        label { font-size: 14px; font-weight: 700; color: var(--text-main); }
        input { width: 100%; padding: 14px 16px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); font-size: 16px; text-align: center; letter-spacing: 3px; outline: none; }
        input:focus { border-color: var(--accent-primary); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
        .submit-btn-wrapper { border-radius: 16px; padding: 2px; overflow: hidden; margin-top: 10px; background: var(--accent-primary); }
        .submit-btn { width: 100%; background: var(--card-bg); color: var(--text-main); border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; backdrop-filter: blur(15px); }
        .submit-btn:hover { background: var(--accent-primary); color: #ffffff; }
        footer { font-size: 11px; color: var(--text-muted); text-align: center; z-index: 2; }
    </style>
</head>
<body data-theme="light">
    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">الوضع الداكن</span>
    </button>

    <header>
        <h1 class="teacher-title">Mr. Sherif Khafagy</h1>
    </header>

    <div class="form-container">
        <h2 class="form-title">تأكيد البريد الإلكتروني</h2>
        <p class="form-desc">تم إرسال كود التحقق المكون من 6 أرقام إلى بريدك الإلكتروني، برجاء إدخاله أدناه لإتمام إنشاء الحساب.</p>
        
        <form id="verifyForm" onsubmit="handleVerification(event)">
            <div class="input-group">
                <label>كود التحقق</label>
                <input type="text" id="verificationCodeInput" placeholder="------" maxlength="6" required>
            </div>

            <!-- حقل تعيين كلمة المرور الخاصة بحساب الطالب -->
            <div class="input-group">
                <label>أنشئ كلمة المرور لحسابك</label>
                <input type="password" id="userPassword" placeholder="••••••••" style="letter-spacing: normal; text-align: right;" required>
            </div>

            <div class="submit-btn-wrapper">
                <button type="submit" class="submit-btn" id="verifyBtn">تأكيد وإنشاء الحساب ✅</button>
            </div>
        </form>
    </div>

    <footer>&copy; 2026 The Leader In English. All Rights Reserved.</footer>

    <script>
        const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('platform_theme', newTheme);
            document.getElementById('themeIcon').innerText = newTheme === 'dark' ? '☀️' : '🌙';
            document.getElementById('themeText').innerText = newTheme === 'dark' ? 'الوضع الفاتح' : 'الوضع الداكن';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('platform_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            
            // التأكد من وجود البيانات المؤقتة
            if (!localStorage.getItem('temp_signup_data')) {
                alert('انتهت صلاحية الجلسة أو لم تقم بإدخال البيانات الأساسية.');
                window.location.href = 'signup.html';
            }
        });

        async function handleVerification(event) {
            event.preventDefault();

            const enteredCode = document.getElementById('verificationCodeInput').value.trim();
            const password = document.getElementById('userPassword').value.trim();
            const btn = document.getElementById('verifyBtn');

            const tempData = JSON.parse(localStorage.getItem('temp_signup_data'));

            if (enteredCode !== tempData.code) {
                alert('كود التحقق غير صحيح، تأكد من الأرقام المرسلة إليك.');
                return;
            }

            if (password.length < 6) {
                alert('كلمة المرور يجب أن تكون 6 أحرف أو أرقام على الأقل.');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'جاري إنشاء الحساب وحفظ البيانات...';

            try {
                // 1. إنشاء المستخدم في مصادقة Supabase Auth
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: tempData.studentEmail,
                    password: password
                });

                if (authError) {
                    throw authError;
                }

                const userId = authData.user ? authData.user.id : null;

                if (!userId) {
                    throw new Error('فشل استخراج معرف المستخدم.');
                }

                // 2. حفظ كافة بيانات الطالب تفصيلياً في جدول profiles لتظهر للآدمن
                const { error: profileError } = await supabaseClient
                    .from('profiles')
                    .insert([
                        {
                            id: userId,
                            first_name: tempData.firstName,
                            middle_name: tempData.middleName,
                            last_name: tempData.lastName,
                            email: tempData.studentEmail,
                            phone_number: tempData.studentPhone,
                            parent_phone: tempData.parentPhone
                        }
                    ]);

                if (profileError) {
                    throw profileError;
                }

                alert('تم إنشاء الحساب بنجاح! أهلاً بك في المنصة.');
                localStorage.removeItem('temp_signup_data');
                window.location.href = 'dashboard.html'; // أو صفحة الدخول الخاصة بك

            } catch (err) {
                console.error('Error:', err);
                alert('حدث خطأ أثناء إنشاء الحساب: ' + (err.message || 'يرجى المحاولة مرة أخرى'));
                btn.disabled = false;
                btn.innerText = 'تأكيد وإنشاء الحساب ✅';
            }
        }
    </script>
</body>
</html>
