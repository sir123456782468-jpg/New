<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The Leader In English</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#ef4444">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--mut:#64748b;--card:#fff;--bd:#e2e8f0}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--fg:#f1f5f9;--mut:#94a3b8;--card:#111a2e;--bd:#1f2b45}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:'Cairo',system-ui,sans-serif;text-align:center;padding:20px}
.b{max-width:420px;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:34px 24px;box-shadow:0 12px 40px rgba(15,23,42,.12)}
.n{font-size:64px;font-weight:800;background:linear-gradient(135deg,#ef4444,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
h1{font-size:20px;margin:8px 0}p{color:var(--mut);margin:0 0 18px;font-size:14px;line-height:1.8}
a{display:inline-block;background:linear-gradient(135deg,#ef4444,#ec4899);color:#fff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:14px}
.sp{width:34px;height:34px;border-radius:50%;border:3px solid var(--bd);border-top-color:#ef4444;margin:0 auto 14px;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#nf{display:none}
/* بدون علامة زرقاء عند الضغط على الشعار */
.brand,.brand *,.logo,.logo *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.brand,.brand:focus,.brand:focus-visible,.brand:active,.logo:focus{outline:none;-webkit-tap-highlight-color:transparent}.brand img,.logo img{-webkit-user-drag:none;user-drag:none;outline:none}a,button{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div class="b" id="ld"><div class="sp"></div><p>جاري التحميل…</p></div>
<div class="b" id="nf">
  <div class="n">404</div>
  <h1>الصفحة دي مش موجودة</h1>
  <p>ممكن يكون الرابط اتغيّر أو الصفحة اتحذفت. ارجع للرئيسية وكمّل من هناك.</p>
  <a href="/home">الرئيسية</a>
</div>
<script>
/* Vercel بيعرض الصفحة دي لأي رابط مالوش ملف. لو الرابط هو رابط "شكل جميل" لكورس/درس/امتحان
   بنحوّله هنا للصفحة الحقيقية بدل ما يظهر 404 عند التحديث (Refresh). */
(function () {
  var p = location.pathname, s = location.search || '', h = location.hash || '', d = p, m, to = null;
  try { d = decodeURIComponent(p); } catch (e) {}
  function add(q, kv) { return (q ? q + '&' : '?') + kv; }
  if ((m = d.match(/^\/course\/(\d+)(?:-[^\/]*)?(?:\/lesson-(\d+))?\/?$/))) {
    to = '/course.html' + add(s, 'n=' + m[1] + (m[2] ? '&ln=' + m[2] : ''));
  } else if ((m = d.match(/^\/exam\/(\d+)(?:-[^\/]*)?\/?$/))) {
    to = '/quiz.html' + add(s, 'n=' + m[1]);
  } else if ((m = d.match(/^\/(course|exam|quiz|home|signin|signup|admin|support)\/?$/))) {
    to = '/' + (m[1] === 'exam' ? 'quiz' : m[1]) + '.html' + s;
  } else if ((m = d.match(/^\/(home|signin|signup|admin|support|course|quiz)\.html\/.+$/))) {
    to = '/' + m[1] + '.html' + s;
  }
  if (to && to.split('?')[0] !== p) { location.replace(to + h); return; }
  document.getElementById('ld').style.display = 'none';
  document.getElementById('nf').style.display = 'block';
})();
</script>
</body>
</html>
