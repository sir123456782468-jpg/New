<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>الامتحان - The Leader In English</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
<style>
html{visibility:hidden}
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e6eaf2;--soft:#f1f4f9;--brand:#ef4444;--grad:linear-gradient(135deg,#ef4444,#ec4899);--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b}
[data-theme=dark]{--bg:#0a1020;--card:#121b30;--ink:#f1f5f9;--muted:#94a3b8;--line:#22304d;--soft:#0e1729;--brand:#f87171}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea{-webkit-user-select:text;user-select:text}
body{background:var(--bg);color:var(--ink);min-height:100vh}
@media print{body{display:none!important}}
.wmo{position:fixed;inset:0;z-index:60;pointer-events:none;background-image:var(--wm)}

/* ===== الهيدر: اسم المنصة + اسم المستر + الرابط ===== */
.hdr{position:relative;z-index:50;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:9px 20px;background:var(--card);border-bottom:3px solid;border-image:linear-gradient(90deg,#ef4444,#ec4899) 1}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:46px;height:46px;flex:none}
.brand b{display:block;font-family:'Cinzel',serif;font-size:17px;line-height:1.15}.brand small{display:block;font-size:12px;font-weight:800;color:var(--brand);margin-top:2px}
.url{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:50px;background:var(--soft);border:1px solid var(--line);font-weight:800;font-size:12.5px;color:var(--muted);direction:ltr}
.hr{display:flex;align-items:center;gap:8px}
.pill{display:inline-block;padding:6px 16px;border-radius:50px;background:var(--soft);border:1px solid var(--line);font-weight:800;font-size:13px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:18px}

.wrap{max-width:920px;margin:0 auto;padding:18px 14px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 34px -18px rgba(15,23,42,.25)}
.c{text-align:center}.big{font-size:56px}.c h2{margin:8px 0;font-size:24px}.c p{color:var(--muted);font-weight:600;line-height:2;margin-bottom:16px}.sub{color:var(--muted);font-weight:700;margin-bottom:14px}

/* ===== الأزرار ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:13px 26px;font-weight:900;font-size:15px;cursor:pointer;background:var(--grad);color:#fff;text-decoration:none;transition:.2s}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.g{background:none;border:2px solid var(--brand);color:var(--brand)}
.btn.red{background:#f43f5e}.btn.grn{background:#16a34a}.btn.amb{background:#f59e0b}.btn.ind{background:#6366f1}.btn.blk{display:flex;width:100%;margin-top:10px}

/* ===== بطاقات الأرقام ===== */
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.kc{padding:16px 10px;border-radius:20px;background:var(--soft);border:1px solid var(--line);text-align:center}
.kc small{display:block;font-weight:800;font-size:13px;color:var(--muted);margin-bottom:4px}.kc b{display:block;font-size:32px;line-height:1.25;font-weight:900}.kc em{font-style:normal;color:var(--muted);font-weight:700;font-size:13px}
.kc.ok b{color:var(--ok)}.kc.no b{color:var(--bad)}.kc.wt b{color:var(--warn)}.kc.pd b{color:#6366f1;font-size:24px}
.rules{text-align:right;list-style:none;margin:14px 0 20px}.rules li{padding:10px 14px;margin-bottom:7px;border-radius:12px;background:var(--soft);font-weight:700;font-size:14px;line-height:1.8}
.meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0}

/* ===== شريط الوقت الثابت ===== */
.tbar{position:sticky;top:0;z-index:55;margin:-18px -14px 14px;padding:10px 16px 9px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 8px 20px -16px rgba(15,23,42,.45)}
.tb1{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:900}
.tb1 .t{flex:1;min-width:0;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmr{font-size:24px;font-weight:900;letter-spacing:1px;direction:ltr;font-variant-numeric:tabular-nums}
.tmr.low{color:var(--bad);animation:bl 1s infinite}@keyframes bl{50%{opacity:.4}}
.pbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:8px}.pbar i{display:block;height:100%;background:var(--grad);transition:width .4s}

/* ===== لوحة الامتحان (إحصائيات + تنقل) ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.sb{padding:10px 6px;text-align:center;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
.sb small{display:block;font-size:12px;font-weight:800;color:var(--muted)}.sb b{font-size:28px;font-weight:900;line-height:1.3}.sb.g b{color:var(--ok)}.sb.r b{color:var(--bad)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.acts .btn{padding:12px 8px;font-size:14px}
.qh{display:flex;justify-content:space-between;font-weight:800;font-size:13px;color:var(--muted);margin-bottom:8px}
.qn{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.qb{position:relative;width:46px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font-weight:900;font-size:15px;cursor:pointer}
.qb.seen{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.55)}
.qb.done{background:var(--ok);border-color:var(--ok);color:#fff}
.qb.cur{outline:3px solid #6366f1;outline-offset:2px}
.qb.flag::after{content:"";position:absolute;top:-6px;left:-6px;width:14px;height:14px;border-radius:50%;background:var(--warn);border:2px solid var(--card)}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted)}.lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:5px}

/* ===== السؤال ===== */
.qc{padding:20px}
.qt1{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}.qt1 h3{font-size:24px;font-weight:900;color:var(--muted)}
.tg{padding:6px 14px;border-radius:12px;font-weight:800;font-size:13px}.tg.t{background:rgba(99,102,241,.14);color:#6366f1}.tg.p{background:rgba(245,158,11,.16);color:#d97706}
.bk{margin-inline-start:auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--muted);cursor:pointer;display:grid;place-items:center}.bk.on{color:var(--warn);background:rgba(245,158,11,.14);border-color:var(--warn)}
.q canvas{display:block;width:100%;margin-bottom:14px}
.qi{display:block;max-width:100%;border-radius:14px;margin:0 auto 14px;pointer-events:none}
.opts{display:grid;gap:10px}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px 16px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
.op:hover{border-color:var(--brand)}
.op b{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-size:14px}.op span{flex:1;line-height:1.7}
.op.on{border-color:var(--brand);background:rgba(239,68,68,.09)}.op.on b{background:var(--grad);color:#fff;border:0}
textarea{width:100%;min-height:170px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font-size:16px;outline:none;resize:vertical}textarea:focus{border-color:var(--brand)}
.nv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding-top:18px;border-top:2px solid var(--line)}

/* ===== النوافذ ===== */
.ov{position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.78);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ov .card{position:relative;width:100%;max-width:540px;max-height:92vh;overflow:auto}
.x{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:16px;cursor:pointer;font-weight:900}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.bx{padding:16px 8px;border-radius:20px;font-weight:800}.bx small{display:block;font-size:13px;margin-bottom:6px}.bx b{font-size:22px}.bx.b1{background:rgba(14,165,233,.14);color:#0284c7}.bx.b2{background:rgba(244,63,94,.14);color:#e11d48}
.wn{color:#d97706!important}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;border-radius:12px;background:var(--soft);cursor:pointer;font-weight:700;font-size:14px;text-align:right}
.rrow:hover{outline:2px solid var(--brand)}
.rrow .rn{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-weight:900}
.rrow .rtx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rst{flex:none;font-size:12px;font-weight:900;padding:3px 10px;border-radius:50px;color:#fff}.rst.a{background:var(--ok)}.rst.u{background:var(--bad)}

/* ===== شاشة النتيجة ===== */
.rt0{font-size:28px;font-weight:900;text-align:center}
.hero{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap;margin:14px 0 8px}
.ring{flex:none;width:156px;height:156px;border-radius:50%;background:conic-gradient(var(--c) 0 calc(var(--p) * 1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--card)}
.ring div{position:relative;text-align:center;line-height:1.15}.ring b{display:block;font-size:36px;font-weight:900}.ring small{color:var(--muted);font-weight:800;font-size:12px}
.vd{text-align:center}.vd .vi{font-size:44px}.vd h3{font-size:22px;margin:4px 0}.vd p{color:var(--muted);font-weight:700;margin:0}
.nt{margin-top:10px;padding:12px 16px;border-radius:14px;background:rgba(99,102,241,.1);font-weight:700;line-height:1.9;text-align:center}.nt.wn{background:rgba(245,158,11,.12)}
.ra{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.fc{padding:8px 16px;border-radius:50px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:13px;cursor:pointer}.fc.on{background:var(--grad);color:#fff;border-color:transparent}
.dq{padding:16px;margin-bottom:12px;border-radius:18px;border:1px solid var(--line);border-right:6px solid var(--line);background:var(--card);text-align:right}
.dq.ok{border-right-color:var(--ok)}.dq.no{border-right-color:var(--bad)}.dq.na{border-right-color:var(--warn)}.dq.es{border-right-color:#6366f1}
.dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-weight:800}
.st{padding:4px 12px;border-radius:50px;font-size:12px;font-weight:900;color:#fff}.st.ok{background:var(--ok)}.st.no{background:var(--bad)}.st.na{background:var(--warn)}.st.es{background:#6366f1}
.pp{margin-inline-start:auto;color:var(--muted);font-size:13px}
.dt{font-size:16px;font-weight:700;line-height:1.9;margin-bottom:10px;white-space:pre-wrap}
.do{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-weight:600;font-size:14.5px;line-height:1.7}
.do b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:12px}.do span{flex:1}
.do.right{background:rgba(22,163,74,.13);border-color:var(--ok)}.do.right b{background:var(--ok);color:#fff;border:0}
.do.wrong{background:rgba(220,38,38,.12);border-color:var(--bad)}.do.wrong b{background:var(--bad);color:#fff;border:0}
.do i{flex:none;font-style:normal;font-size:12px;font-weight:900}.do.right i{color:var(--ok)}.do.wrong i{color:var(--bad)}
.eb{padding:12px;border-radius:12px;background:var(--soft);border:1px dashed var(--line);white-space:pre-wrap;line-height:1.9;font-weight:600}

@media(max-width:700px){.url{order:3;flex-basis:100%;justify-content:center;padding:4px 12px}.pill{max-width:120px}.hdr{padding:8px 12px}}
@media(max-width:600px){.card{padding:16px}.stats{gap:6px}.sb b{font-size:22px}.qb{width:40px;height:38px}.qt1 h3{font-size:19px}.op{font-size:15px;padding:10px 12px}.ring{width:130px;height:130px}.ring b{font-size:30px}.kc b{font-size:26px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><symbol id="logo" viewBox="0 0 64 64"><path d="M14 4h36a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10H32L20 61V50h-6A10 10 0 0 1 4 40V14A10 10 0 0 1 14 4z" fill="url(#rg)"/><path d="M21 21h8v19h14v8H21z" fill="#fff"/><path d="M18 19V11l5 4 4-7 4 7 5-4v8z" fill="#fbbf24"/></symbol></svg>
<div class="wmo" id="wmo"></div>
<header class="hdr">
  <div class="brand"><svg><use href="#logo"/></svg><div><b>The Leader In English</b><small>Mr. Sherif Khafagy</small></div></div>
  <span class="url" id="url">🌐</span>
  <div class="hr"><span class="pill" id="who"></span><button class="sw" id="th" type="button" aria-label="تغيير الوضع">☀️</button></div>
</header>
<main class="wrap" id="stage"><div class="card c"><div class="big">⏳</div><p>جاري تجهيز الامتحان...</p></div></main>
