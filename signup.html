<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب - The Leader In English</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-gradient: radial-gradient(
                circle at 50% 20%,
                #f8fafc 0%,
                #f1f5f9 50%,
                #e2e8f0 100%
            );

            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #ef4444;
            --border-color: rgba(239, 68, 68, 0.2);
            --input-bg: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --bg-gradient: radial-gradient(
                circle at 50% 20%,
                #0f172a 0%,
                #0b1120 50%,
                #020617 100%
            );

            --card-bg: rgba(15, 23, 42, 0.85);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-primary: #f87171;
            --border-color: rgba(248, 113, 113, 0.25);
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition:
                background 0.4s ease,
                color 0.4s ease,
                border-color 0.4s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;

            padding: 25px;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 25px;
            left: 25px;

            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);

            padding: 10px 18px;
            border-radius: 50px;

            cursor: pointer;
            font-weight: 700;
            font-size: 13px;

            z-index: 10;

            display: flex;
            align-items: center;
            gap: 8px;

            backdrop-filter: blur(12px);
        }

        header {
            text-align: center;
            margin-top: 15px;
            z-index: 2;
        }

        .teacher-title {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-primary);
        }

        .form-container {
            width: 100%;
            max-width: 650px;

            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;

            padding: 30px;

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);

            backdrop-filter: blur(16px);

            margin: 20px 0;
            z-index: 2;
        }

        .form-title {
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        .name-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        input,
        select {
            width: 100%;

            padding: 14px 16px;

            background: var(--input-bg);

            border: 1px solid var(--border-color);
            border-radius: 12px;

            color: var(--text-main);

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: var(--accent-primary);

            box-shadow:
                0 0 10px rgba(239, 68, 68, 0.2);
        }

        select option {
            background: var(--card-bg);
            color: var(--text-main);
        }

        .submit-btn-wrapper {
            border-radius: 16px;
            padding: 2px;
            overflow: hidden;
            margin-top: 10px;
            background: var(--accent-primary);
        }

        .submit-btn {
            width: 100%;

            background: var(--card-bg);
            color: var(--text-main);

            border: none;

            padding: 16px;

            border-radius: 14px;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            backdrop-filter: blur(15px);
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--accent-primary);
            color: #ffffff;
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .form-msg {
            display: none;

            margin-top: 16px;

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 14px;
            font-weight: 600;

            text-align: center;
            line-height: 1.8;

            background: rgba(239, 68, 68, 0.1);

            border: 1px solid var(--border-color);

            color: var(--text-main);
        }

        .form-msg.success {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .form-msg a {
            color: var(--accent-primary);
            font-weight: 800;
        }

        footer {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            z-index: 2;
        }

        @media(max-width: 768px) {
            .name-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .form-container {
                padding: 22px;
            }

            .teacher-title {
                font-size: 23px;
            }

            .theme-toggle {
                top: 15px;
                left: 15px;
            }
        }
    </style>
</head>

<body data-theme="light">

    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span>
        <span id="themeText">الوضع الداكن</span>
    </button>

    <header>
        <h1 class="teacher-title">
            Mr. Sherif Khafagy
        </h1>
    </header>

    <div class="form-container">

        <h2 class="form-title">
            إنشاء حساب جديد
        </h2>

        <form id="signupForm">

            <!-- الاسم -->
            <div class="name-row">

                <div class="input-group">
                    <label for="firstName">
                        الاسم الأول
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="middleName">
                        الاسم الثاني
                    </label>

                    <input
                        type="text"
                        id="middleName"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="lastName">
                        الاسم الأخير
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        autocomplete="family-name"
                        required
                    >
                </div>

            </div>

            <!-- البريد -->
            <div class="input-group">

                <label for="studentEmail">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="studentEmail"
                    placeholder="example@gmail.com"
                    autocomplete="email"
                    required
                >

            </div>

            <!-- الصف -->
            <div class="input-group">

                <label for="academicYear">
                    السنة الدراسية (الصف)
                </label>

                <select id="academicYear" required>

                    <option value="" disabled selected>
                        اختر السنة الدراسية
                    </option>

                    <option value="أولى إعدادي">
                        أولى إعدادي
                    </option>

                    <option value="ثانية إعدادي">
                        ثانية إعدادي
                    </option>

                    <option value="ثالثة إعدادي">
                        ثالثة إعدادي
                    </option>

                    <option value="أولى ثانوي">
                        أولى ثانوي
                    </option>

                    <option value="ثانية ثانوي">
                        ثانية ثانوي
                    </option>

                    <option value="ثالثة ثانوي">
                        ثالثة ثانوي
                    </option>

                </select>

            </div>

            <!-- رقم الطالب -->
            <div class="input-group">

                <label for="studentPhone">
                    رقم الهاتف الشخصي
                </label>

                <input
                    type="tel"
                    id="studentPhone"
                    placeholder="01xxxxxxxxx"
                    maxlength="11"
                    inputmode="numeric"
                    autocomplete="tel"
                    required
                >

            </div>

            <!-- رقم ولي الأمر -->
            <div class="input-group">

                <label for="parentPhone">
                    رقم ولي الأمر
                </label>

                <input
                    type="tel"
                    id="parentPhone"
                    placeholder="01xxxxxxxxx"
                    maxlength="11"
                    inputmode="numeric"
                    required
                >

            </div>

            <!-- زر الإرسال -->
            <div class="submit-btn-wrapper">

                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn"
                >
                    إرسال كود التحقق 🚀
                </button>

            </div>

            <div
                class="form-msg"
                id="formMsg"
            ></div>

        </form>

    </div>

    <footer>
        &copy; 2026 The Leader In English. All Rights Reserved.
    </footer>


<script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
        'https://cxtmvsoxgfsormhcklfx.supabase.co';

    const SUPABASE_ANON_KEY =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* =========================================
       THEME
    ========================================= */

    function toggleTheme() {

        const currentTheme =
            document.body.getAttribute('data-theme');

        const newTheme =
            currentTheme === 'light'
                ? 'dark'
                : 'light';

        document.body.setAttribute(
            'data-theme',
            newTheme
        );

        localStorage.setItem(
            'platform_theme',
            newTheme
        );

        document.getElementById('themeIcon').innerText =
            newTheme === 'dark'
                ? '☀️'
                : '🌙';

        document.getElementById('themeText').innerText =
            newTheme === 'dark'
                ? 'الوضع الفاتح'
                : 'الوضع الداكن';
    }


    window.addEventListener(
        'DOMContentLoaded',
        () => {

            const savedTheme =
                localStorage.getItem('platform_theme') || 'light';

            document.body.setAttribute(
                'data-theme',
                savedTheme
            );

            document.getElementById('themeIcon').innerText =
                savedTheme === 'dark'
                    ? '☀️'
                    : '🌙';

            document.getElementById('themeText').innerText =
                savedTheme === 'dark'
                    ? 'الوضع الفاتح'
                    : 'الوضع الداكن';
        }
    );


    /* =========================================
       MESSAGE
    ========================================= */

    function showMsg(message, type = 'error') {

        const box =
            document.getElementById('formMsg');

        box.innerHTML = message;

        box.className = 'form-msg';

        if (type === 'success') {
            box.classList.add('success');
        }

        box.style.display = 'block';
    }


    /* =========================================
       FORM
    ========================================= */

    document
        .getElementById('signupForm')
        .addEventListener('submit', handleFirstStep);


    async function handleFirstStep(event) {

        event.preventDefault();

        const btn =
            document.getElementById('submitBtn');

        const formMsg =
            document.getElementById('formMsg');

        formMsg.style.display = 'none';


        /* =====================================
           GET DATA
        ===================================== */

        const firstName =
            document.getElementById('firstName')
                .value
                .trim();

        const middleName =
            document.getElementById('middleName')
                .value
                .trim();

        const lastName =
            document.getElementById('lastName')
                .value
                .trim();

        const email =
            document.getElementById('studentEmail')
                .value
                .trim()
                .toLowerCase();

        const academicYear =
            document.getElementById('academicYear')
                .value;

        const phone =
            document.getElementById('studentPhone')
                .value
                .trim();

        const parentPhone =
            document.getElementById('parentPhone')
                .value
                .trim();


        /* =====================================
           VALIDATION
        ===================================== */

        const phoneRegex =
            /^01[0-9]{9}$/;


        if (!firstName || !middleName || !lastName) {

            showMsg(
                'برجاء كتابة الاسم بالكامل.'
            );

            return;
        }


        if (!email) {

            showMsg(
                'برجاء كتابة البريد الإلكتروني.'
            );

            return;
        }


        if (!academicYear) {

            showMsg(
                'برجاء اختيار السنة الدراسية.'
            );

            return;
        }


        if (!phoneRegex.test(phone)) {

            showMsg(
                'رقم الهاتف الشخصي غير صحيح، يجب أن يتكون من 11 رقمًا ويبدأ بـ 01.'
            );

            return;
        }


        if (!phoneRegex.test(parentPhone)) {

            showMsg(
                'رقم ولي الأمر غير صحيح، يجب أن يتكون من 11 رقمًا ويبدأ بـ 01.'
            );

            return;
        }


        if (phone === parentPhone) {

            showMsg(
                'رقم ولي الأمر يجب أن يكون مختلفًا عن رقمك الشخصي.'
            );

            return;
        }


        /* =====================================
           DISABLE BUTTON
        ===================================== */

        btn.disabled = true;

        btn.innerText =
            'جاري إرسال كود التحقق...';


        try {

            /* =================================
               إرسال OTP مباشرة إلى الإيميل

               تم إزالة student_exists من هنا
               لأنه كان ممكن يمنع الوصول
               إلى خطوة إرسال الكود.
            ================================= */

            console.log(
                'Sending OTP to:',
                email
            );


            const {
                data,
                error
            } = await supabaseClient.auth.signInWithOtp({

                email: email,

                options: {

                    shouldCreateUser: true

                }

            });


            console.log(
                'Supabase OTP response:',
                data
            );

            console.log(
                'Supabase OTP error:',
                error
            );


            if (error) {

                throw error;

            }


            /* =================================
               حفظ بيانات الطالب مؤقتًا
            ================================= */

            const tempData = {

                firstName: firstName,

                middleName: middleName,

                lastName: lastName,

                studentEmail: email,

                academicYear: academicYear,

                studentPhone: phone,

                parentPhone: parentPhone

            };


            localStorage.setItem(
                'temp_signup_data',
                JSON.stringify(tempData)
            );


            /* =================================
               نجاح
            ================================= */

            showMsg(
                'تم إرسال كود التحقق إلى بريدك الإلكتروني.<br>افتح البريد الإلكتروني واكتب الكود في الصفحة التالية.',
                'success'
            );


            /*
             * ننتظر لحظة بسيطة ثم ننتقل
             * إلى صفحة إدخال الكود.
             */

            setTimeout(() => {

                window.location.href =
                    'verify-code.html';

            }, 1200);


        } catch (err) {

            console.error(
                'FULL SIGNUP ERROR:',
                err
            );


            let errorMessage =
                'حدث خطأ أثناء إرسال كود التحقق.';


            if (err && err.message) {

                console.error(
                    'Supabase error message:',
                    err.message
                );


                const message =
                    err.message.toLowerCase();


                if (
                    message.includes('rate limit') ||
                    message.includes('rate_limit') ||
                    message.includes('too many')
                ) {

                    errorMessage =
                        'تم إرسال طلبات كثيرة. برجاء الانتظار قليلًا ثم المحاولة مرة أخرى.';

                }

                else if (
                    message.includes('invalid email')
                ) {

                    errorMessage =
                        'البريد الإلكتروني غير صحيح.';

                }

                else if (
                    message.includes('email')
                ) {

                    errorMessage =
                        'حدثت مشكلة في إرسال البريد الإلكتروني. تأكد من إعدادات البريد في Supabase.';

                }

                else {

                    errorMessage +=
                        '<br><small>' +
                        err.message +
                        '</small>';

                }

            }


            showMsg(
                errorMessage
            );


            btn.disabled = false;

            btn.innerText =
                'إرسال كود التحقق 🚀';

        }

    }

</script>

</body>
</html>
