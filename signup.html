<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - The Leader In English</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #ef4444;
            --border-color: rgba(239, 68, 68, 0.2);
            --input-bg: rgba(255, 255, 255, 0.8);
        }
        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 50% 20%, #0f172a 0%, #0b1120 50%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-primary: #f87171;
            --border-color: rgba(248, 113, 113, 0.25);
            --input-bg: rgba(15, 23, 42, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 25px; }
        .form-container { width: 100%; max-width: 550px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); margin: auto 0; }
        .form-title { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 25px; color: var(--text-main); }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .name-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        @media (max-width: 480px) { .name-row { grid-template-columns: 1fr; } }
        label { font-size: 14px; font-weight: 700; color: var(--text-main); }
        input, select { width: 100%; padding: 14px 16px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); font-size: 15px; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1); }
        select option { background: var(--card-bg); color: var(--text-main); }
        .submit-btn-wrapper { border-radius: 16px; padding: 2px; background: var(--accent-primary); margin-top: 20px; }
        .submit-btn { width: 100%; background: var(--card-bg); color: var(--text-main); border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: var(--accent-primary); color: #fff; }
        footer { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 15px; }
    </style>
</head>
<body data-theme="light">
    <div class="form-container">
        <h2 class="form-title">إنشاء حساب جديد - بيانات الطالب</h2>
        
        <form id="signupForm" onsubmit="handleNextStep(event)">
            <!-- الاسم الثلاثي -->
            <div class="input-group">
                <label>الاسم الثلاثي</label>
                <div class="name-row">
                    <input type="text" id="firstName" placeholder="الاسم الأول" required>
                    <input type="text" id="middleName" placeholder="اسم الأب" required>
                    <input type="text" id="lastName" placeholder="اسم العائلة" required>
                </div>
            </div>

            <!-- البريد الإلكتروني -->
            <div class="input-group">
                <label>البريد الإلكتروني للطالب</label>
                <input type="email" id="studentEmail" placeholder="example@domain.com" required>
            </div>

            <!-- الصف الدراسي (يشمل كل المراحل) -->
            <div class="input-group">
                <label>الصف الدراسي</label>
                <select id="academicYear" required>
                    <option value="" disabled selected>اختر صفك الدراسي</option>
                    <option value="أولى إعدادي">أولى إعدادي</option>
                    <option value="تانية إعدادي">تانية إعدادي</option>
                    <option value="تالتة إعدادي">تالتة إعدادي</option>
                    <option value="أولى ثانوي">أولى ثانوي</option>
                    <option value="تانية ثانوي">تانية ثانوي</option>
                    <option value="ثالثة ثانوي">ثالثة ثانوي (ثانوية عامة)</option>
                </select>
            </div>

            <!-- رقم هاتف الطالب -->
            <div class="input-group">
                <label>رقم هاتف الطالب</label>
                <input type="tel" id="studentPhone" placeholder="010XXXXXXXX" pattern="01[0-9]{9}" required>
            </div>

            <!-- رقم ولي الأمر -->
            <div class="input-group">
                <label>رقم هاتف ولي الأمر</label>
                <input type="tel" id="parentPhone" placeholder="010XXXXXXXX" pattern="01[0-9]{9}" required>
            </div>

            <div class="submit-btn-wrapper">
                <button type="submit" class="submit-btn">التالي: تعيين كلمة المرور ⬅️</button>
            </div>
        </form>
    </div>

    <footer>&copy; 2026 The Leader In English. All Rights Reserved.</footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('platform_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
        });

        function handleNextStep(event) {
            event.preventDefault();

            const tempData = {
                firstName: document.getElementById('firstName').value.trim(),
                middleName: document.getElementById('middleName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                studentEmail: document.getElementById('studentEmail').value.trim(),
                academicYear: document.getElementById('academicYear').value,
                studentPhone: document.getElementById('studentPhone').value.trim(),
                parentPhone: document.getElementById('parentPhone').value.trim()
            };

            localStorage.setItem('temp_signup_data', JSON.stringify(tempData));
            window.location.href = 'password.html';
        }
    </script>
</body>
</html>
