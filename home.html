<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - The Leader In English</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #ef4444;
            --accent-2: #ec4899;
            --border-color: rgba(239, 68, 68, 0.2);
            --input-bg: rgba(255, 255, 255, 0.8);
            --grad: linear-gradient(135deg, #ef4444, #ec4899);
            --shadow: 0 18px 40px -18px rgba(239, 68, 68, 0.35);
        }
        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #0f172a 0%, #0b1120 50%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.88);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-primary: #f87171;
            --accent-2: #f472b6;
            --border-color: rgba(248, 113, 113, 0.25);
            --input-bg: rgba(15, 23, 42, 0.6);
            --grad: linear-gradient(135deg, #ef4444, #db2777);
            --shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.8);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); min-height: 100vh; transition: background 0.4s, color 0.4s; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        .nav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 22px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); backdrop-filter: blur(16px); }
        .brand { font-family: 'Cinzel', serif; font-weight: 800; font-size: 20px; color: var(--accent-primary); }
        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .pill { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 50px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .pill:hover { background: var(--accent-primary); color: #fff; }
        .user { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-weight: 900; }

        .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 16px 40px; }

        .hero { position: relative; overflow: hidden; border-radius: 28px; padding: 38px 30px; color: #fff; background: var(--grad); box-shadow: var(--shadow); }
        .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,0.14); }
        .hero::before { width: 260px; height: 260px; top: -90px; left: -60px; animation: drift 9s ease-in-out infinite; }
        .hero::after { width: 160px; height: 160px; bottom: -60px; right: 22%; animation: drift 7s ease-in-out infinite reverse; }
        @keyframes drift { 50% { transform: translate(22px, 18px) scale(1.08); } }
        .hero > * { position: relative; z-index: 1; }
        .chip { display: inline-block; background: rgba(255,255,255,0.22); padding: 6px 16px; border-radius: 50px; font-weight: 800; font-size: 13px; margin-bottom: 14px; backdrop-filter: blur(6px); }
        .hero h1 { font-size: clamp(26px, 5.5vw, 42px); font-weight: 900; line-height: 1.4; }
        .wave { display: inline-block; transform-origin: 70% 70%; animation: wave 2.2s infinite; }
        @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(16deg); } 20%,40% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
        .quote { direction: ltr; text-align: right; margin: 10px 0 24px; font-size: 17px; font-weight: 700; min-height: 28px; opacity: 0.95; transition: opacity 0.4s; }
        .cta { display: inline-block; background: #fff; color: var(--accent-primary); font-weight: 900; padding: 14px 28px; border-radius: 16px; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 10px 24px -10px rgba(0,0,0,0.4); }
        .cta:hover { transform: translateY(-3px) scale(1.03); }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0 30px; }
        .stat { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 18px 12px; text-align: center; transition: transform 0.25s; }
        .stat:hover { transform: translateY(-5px); }
        .stat .n { font-size: 32px; font-weight: 900; color: var(--accent-primary); line-height: 1.2; }
        .stat .l { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .stat .e { font-size: 22px; }

        .sec-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
        .sec-head h2 { font-size: 24px; font-weight: 900; }
        .sec-head h2 span { color: var(--accent-primary); }
        .tabs { display: flex; gap: 8px; background: var(--input-bg); border: 1px solid var(--border-color); padding: 5px; border-radius: 50px; }
        .tab { border: none; background: none; color: var(--text-muted); padding: 8px 18px; border-radius: 50px; font-weight: 800; font-size: 14px; cursor: pointer; transition: all 0.25s; }
        .tab.on { background: var(--grad); color: #fff; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s; animation: up 0.5s ease both; animation-delay: calc(var(--i, 0) * 70ms); }
        @keyframes up { from { opacity: 0; transform: translateY(20px); } }
        .card:hover { transform: translateY(-8px); box-shadow: var(--shadow); }
        .thumb { position: relative; height: 150px; background: var(--grad); display: grid; place-items: center; font-size: 56px; overflow: hidden; }
        .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .price, .ok { position: absolute; top: 12px; padding: 5px 12px; border-radius: 50px; font-size: 12px; font-weight: 900; background: rgba(0,0,0,0.55); color: #fff; backdrop-filter: blur(6px); }
        .price { right: 12px; }
        .ok { left: 12px; background: #22c55e; }
        .body { padding: 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .body h3 { font-size: 18px; font-weight: 800; }
        .body p { font-size: 13.5px; color: var(--text-muted); line-height: 1.8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .meta { font-size: 13px; font-weight: 700; color: var(--text-muted); }
        .bar { height: 8px; border-radius: 8px; background: var(--border-color); overflow: hidden; }
        .bar i { display: block; height: 100%; background: var(--grad); border-radius: 8px; transition: width 1s ease; }
        .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }
        .btn { flex: 1; text-align: center; padding: 12px; border-radius: 14px; font-weight: 800; font-size: 14px; border: 2px solid var(--accent-primary); cursor: pointer; transition: all 0.2s; }
        .btn.main { background: var(--grad); color: #fff; border-color: transparent; }
        .btn.alt { background: none; color: var(--accent-primary); }
        .btn.alt:hover { background: var(--accent-primary); color: #fff; }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: wait; }

        .skel { height: 330px; border-radius: 22px; background: linear-gradient(90deg, var(--input-bg) 25%, var(--border-color) 50%, var(--input-bg) 75%); background-size: 200% 100%; animation: sh 1.4s infinite; }
        @keyframes sh { to { background-position: -200% 0; } }
        .empty { grid-column: 1 / -1; text-align: center; padding: 50px 20px; background: var(--card-bg); border: 2px dashed var(--border-color); border-radius: 22px; color: var(--text-muted); font-weight: 700; line-height: 2; }
        .empty .big { font-size: 54px; display: block; animation: drift 4s ease-in-out infinite; }

        .ann { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 13px 18px; border-radius: 16px; background: rgba(251,191,36,0.14); border: 1px solid rgba(251,191,36,0.55); font-weight: 700; font-size: 14px; line-height: 1.8; animation: up 0.5s ease both; }
        .ann small { display: block; font-weight: 600; color: var(--text-muted); }
        .redeem { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin: -8px 0 30px; padding: 18px 20px; background: var(--card-bg); border: 2px dashed var(--border-color); border-radius: 20px; }
        .redeem b { display: block; font-size: 16px; }
        .redeem span { font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .redeem form { display: flex; gap: 8px; flex: 1; min-width: 260px; max-width: 420px; }
        .redeem input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-size: 15px; font-weight: 800; letter-spacing: 2px; text-align: center; text-transform: uppercase; outline: none; }
        .redeem input:focus { border-color: var(--accent-primary); }
        .redeem .btn { flex: none; padding: 12px 22px; }
        footer { text-align: center; font-size: 11px; color: var(--text-muted); padding: 10px 0 24px; }
        #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
        #toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 101; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .toast { background: #1e293b; color: #fff; padding: 12px 22px; border-radius: 14px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: up 0.3s ease; }
        @media (max-width: 600px) { .hero { padding: 28px 20px; } .stats { gap: 8px; } .stat .n { font-size: 26px; } .user span:last-child { display: none; } .nav { padding: 10px 14px; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
</head>
<body data-theme="light">
    <nav class="nav">
        <div class="brand">Mr. Sherif Khafagy</div>
        <div class="nav-actions">
            <button class="pill" type="button" onclick="toggleTheme()" id="themeBtn">🌙</button>
            <div class="user"><span class="avatar" id="avatar">؟</span><span id="navName"></span></div>
            <button class="pill" type="button" onclick="logout()">خروج</button>
        </div>
    </nav>

    <div class="wrap">
        <section class="hero">
            <span class="chip" id="yearChip">...</span>
            <h1 id="greet">أهلاً بيك <span class="wave">👋</span></h1>
            <div class="quote" id="quote">Practice makes perfect!</div>
            <a href="#courses" class="cta">ابدأ رحلتك الآن 🚀</a>
        </section>
        <div id="ann"></div>

        <section class="stats">
            <div class="stat"><div class="e">📚</div><div class="n" id="sMine">0</div><div class="l">كورساتي</div></div>
            <div class="stat"><div class="e">✅</div><div class="n" id="sDone">0</div><div class="l">دروس مكتملة</div></div>
            <div class="stat"><div class="e">🎯</div><div class="n" id="sAll">0</div><div class="l">كورسات متاحة</div></div>
        </section>

        <section class="redeem">
            <div><b>🎟️ عندك كود تفعيل؟</b><span>اكتب الكود واشترك في الكورس فوراً</span></div>
            <form id="redeemForm">
                <input id="codeIn" dir="ltr" placeholder="XXXX-XXXX-XXXX" maxlength="14" autocomplete="off" required>
                <button class="btn main" type="submit" id="redeemBtn">تفعيل</button>
            </form>
        </section>

        <section id="courses">
            <div class="sec-head">
                <h2>كورسات <span id="yearName"></span></h2>
                <div class="tabs">
                    <button class="tab on" type="button" data-f="all">كل الكورسات</button>
                    <button class="tab" type="button" data-f="mine">كورساتي</button>
                </div>
            </div>
            <div class="grid" id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
        </section>
    </div>

    <footer>&copy; 2026 The Leader In English. All Rights Reserved.</footer>
    <canvas id="confetti"></canvas>
    <div id="toasts"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-guard.js"></script>
    <script>
        const $ = s => document.querySelector(s);
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        let courses = [], enrolled = new Set(), doneBy = {}, filter = 'all';

        function applyTheme(t) {
            document.body.setAttribute('data-theme', t);
            $('#themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const t = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            localStorage.setItem('platform_theme', t);
            applyTheme(t);
        }
        applyTheme(localStorage.getItem('platform_theme') || 'light');

        function toast(msg) {
            const el = document.createElement('div');
            el.className = 'toast';
            el.textContent = msg;
            $('#toasts').appendChild(el);
            setTimeout(() => el.remove(), 3200);
        }

        function confetti() {
            const c = $('#confetti'), x = c.getContext('2d');
            c.width = innerWidth; c.height = innerHeight;
            const cols = ['#ef4444', '#ec4899', '#fbbf24', '#22d3ee', '#a78bfa', '#22c55e'];
            const ps = Array.from({ length: 130 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.6, vx: (Math.random() - 0.5) * 18, vy: Math.random() * -16 - 4, r: Math.random() * 6 + 3, c: cols[Math.random() * cols.length | 0], a: 1 }));
            (function f() {
                x.clearRect(0, 0, c.width, c.height);
                let alive = false;
                ps.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.36; p.a -= 0.008;
                    if (p.a > 0) { alive = true; x.globalAlpha = p.a; x.fillStyle = p.c; x.fillRect(p.x, p.y, p.r, p.r * 1.6); }
                });
                if (alive) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
            })();
        }

        function countUp(el, to) {
            const s = performance.now();
            (function t(n) {
                const k = Math.min((n - s) / 900, 1);
                el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
                if (k < 1) requestAnimationFrame(t);
            })(s);
        }

        const quotes = ['Practice makes perfect! 💪', 'Every day is a new lesson ✨', "Speak up, don't be shy! 🗣️", 'Small steps, big results 🚀', 'You are getting better every day 🔥', 'Mistakes help you learn! 🌟'];
        let qi = 0;
        function rotateQuotes() {
            const q = $('#quote');
            q.textContent = quotes[0];
            setInterval(() => {
                q.style.opacity = 0;
                setTimeout(() => { qi = (qi + 1) % quotes.length; q.textContent = quotes[qi]; q.style.opacity = 1; }, 400);
            }, 3800);
        }

        function greeting() {
            const h = new Date().getHours();
            return h < 12 ? 'صباح الخير' : h < 18 ? 'نهارك سعيد' : 'مساء الخير';
        }

        function updateStats() {
            let done = 0;
            Object.values(doneBy).forEach(n => done += n);
            countUp($('#sMine'), enrolled.size);
            countUp($('#sDone'), done);
            countUp($('#sAll'), courses.length);
        }

        function render() {
            const list = courses.filter(c => filter === 'all' || enrolled.has(c.id));
            const grid = $('#grid');
            if (!list.length) {
                grid.innerHTML = filter === 'mine'
                    ? '<div class="empty"><span class="big">🎒</span>لسه مشتركتش في أي كورس.<br>اختار كورس من "كل الكورسات" وابدأ دلوقتي!</div>'
                    : '<div class="empty"><span class="big">🚀</span>الكورسات الجديدة قريباً جداً!<br>استنّى الإضافات الجاية.</div>';
                return;
            }
            grid.innerHTML = list.map((c, i) => {
                const total = (c.lessons && c.lessons[0] && c.lessons[0].count) || 0;
                const isIn = enrolled.has(c.id);
                const done = doneBy[c.id] || 0;
                const pct = total ? Math.min(100, Math.round(done / total * 100)) : 0;
                const free = Number(c.price) === 0;
                const img = c.thumbnail_url && /^https:\/\//.test(c.thumbnail_url) ? '<img src="' + esc(c.thumbnail_url) + '" alt="">' : '';
                return '<article class="card" style="--i:' + i + '">'
                    + '<div class="thumb">📚' + img
                    + '<span class="price">' + (free ? 'مجاني' : esc(c.price) + ' ج.م') + '</span>'
                    + (isIn ? '<span class="ok">✓ مشترك</span>' : '') + '</div>'
                    + '<div class="body"><h3>' + esc(c.title) + '</h3><p>' + esc(c.description) + '</p>'
                    + '<div class="meta">🎬 ' + total + ' درس' + (isIn ? ' • ' + pct + '% مكتمل' : '') + '</div>'
                    + (isIn ? '<div class="bar"><i style="width:0" data-w="' + pct + '"></i></div>' : '')
                    + '<div class="actions"><a class="btn main" href="course.html?id=' + esc(c.id) + '">' + (isIn ? 'متابعة التعلم' : 'عرض التفاصيل') + '</a>'
                    + (!isIn && free ? '<button class="btn alt" type="button" data-enroll="' + esc(c.id) + '">اشترك مجاناً</button>' : '')
                    + '</div></div></article>';
            }).join('');
            requestAnimationFrame(() => document.querySelectorAll('.bar i').forEach(b => b.style.width = b.dataset.w + '%'));
        }

        async function enroll(id, btn) {
            btn.disabled = true;
            const { error } = await supabaseClient.from('enrollments').insert({ student_id: currentUser.id, course_id: id });
            if (error && error.code !== '23505') {
                console.error(error);
                toast('تعذر الاشتراك، حاول مرة أخرى');
                btn.disabled = false;
                return;
            }
            enrolled.add(id);
            confetti();
            toast('مبروك! تم اشتراكك في الكورس 🎉');
            render();
            updateStats();
        }

        async function loadAnnouncements() {
            const { data, error } = await supabaseClient.from('announcements')
                .select('title,body').eq('is_active', true).order('created_at', { ascending: false }).limit(3);
            if (error || !data) return;
            $('#ann').innerHTML = data.map(a => '<div class="ann"><span>📢</span><div>' + esc(a.title)
                + (a.body ? '<small>' + esc(a.body) + '</small>' : '') + '</div></div>').join('');
        }

        async function redeem(e) {
            e.preventDefault();
            const btn = $('#redeemBtn');
            const code = $('#codeIn').value.trim();
            if (!code) return;
            btn.disabled = true;
            const { data, error } = await supabaseClient.rpc('redeem_code', { p_code: code });
            btn.disabled = false;
            if (error) {
                const m = (error.message || '');
                toast(m.includes('invalid_code') ? 'الكود غير صحيح، تأكد منه وحاول مرة أخرى'
                    : m.includes('code_used') ? 'الكود ده اتستخدم قبل كده'
                    : 'تعذر تفعيل الكود، حاول مرة أخرى');
                return;
            }
            enrolled.add(data);
            $('#codeIn').value = '';
            confetti();
            toast('تم تفعيل الكورس بنجاح 🎉');
            render();
            updateStats();
            document.getElementById('courses').scrollIntoView({ behavior: 'smooth' });
        }
        $('#redeemForm').addEventListener('submit', redeem);

        async function init() {
            const p = window.currentProfile;
            const first = p.first_name || '';
            $('#avatar').textContent = first.charAt(0) || '؟';
            $('#navName').textContent = first;
            $('#yearChip').textContent = '🎓 ' + p.academic_year;
            $('#yearName').textContent = p.academic_year;
            $('#greet').innerHTML = greeting() + ' يا <b>' + esc(first) + '</b> <span class="wave">👋</span>';
            rotateQuotes();
            loadAnnouncements();

            const [c, e, pr] = await Promise.all([
                supabaseClient.from('courses').select('id,title,description,thumbnail_url,price,lessons(count)').eq('academic_year', p.academic_year).order('sort_order'),
                supabaseClient.from('enrollments').select('course_id'),
                supabaseClient.from('lesson_progress').select('lesson_id, lessons(course_id)')
            ]);

            if (c.error) {
                console.error(c.error);
                $('#grid').innerHTML = '<div class="empty"><span class="big">⚠️</span>تعذر تحميل الكورسات، حدّث الصفحة وحاول مرة أخرى.</div>';
                return;
            }
            courses = c.data || [];
            enrolled = new Set((e.data || []).map(r => r.course_id));
            (pr.data || []).forEach(r => { const cid = r.lessons && r.lessons.course_id; if (cid) doneBy[cid] = (doneBy[cid] || 0) + 1; });

            render();
            updateStats();
        }

        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
            t.classList.add('on');
            filter = t.dataset.f;
            render();
        }));
        $('#grid').addEventListener('click', e => {
            const b = e.target.closest('[data-enroll]');
            if (b) enroll(b.dataset.enroll, b);
        });

        // auth-guard.js يتأكد من الجلسة ثم ينادي الحدث ده
        if (window.currentProfile) init();
        else document.addEventListener('auth-ready', init);
    </script>
</body>
</html>
