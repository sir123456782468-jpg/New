<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | The Leader In English</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { emailjs.init("YOUR_PUBLIC_KEY"); })();
    </script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: #0b0f19;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 75%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f1f5f9;
        }
        #toastNotification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 14px 28px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            transition: top 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        #toastNotification.error { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 10px 30px rgba(244, 63, 94, 0.4); }
        #toastNotification.show { top: 25px; }

        .platform-card {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }
        .platform-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #60a5fa, #d4af37);
        }
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header h1 { font-size: 24px; font-weight: 900; color: #f8fafc; margin-bottom: 5px; }
        .brand-header h1 span { color: #d4af37; }
        .brand-header p { font-size: 13px; color: #94a3b8; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        .form-control {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 1.5px solid #334155;
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-control:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }
        
        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            margin-top: 10px;
        }
        .btn-primary { background: linear-gradient(135deg, #d4af37, #aa7c11); color: #0b0f19; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        
        .forgot-link { text-align: left; font-size: 12px; margin-top: 5px; }
        .forgot-link a { color: #94a3b8; text-decoration: none; }
        .forgot-link a:hover { color: #d4af37; text-decoration: underline; }

        .switch-auth { text-align: center; margin-top: 20px; font-size: 13px; color: #94a3b8; }
        .switch-auth a { color: #d4af37; text-decoration: none; font-weight: 700; }
        .switch-auth a:hover { text-decoration: underline; }

        .auth-section, .recovery-section { display: none; }
        .auth-section.active, .recovery-section.active { display: block; }
    </style>
</head>
<body>

    <div id="toastNotification">
        <i class="fa-solid fa-circle-check" id="toastIcon" style="font-size: 18px;"></i>
        <span id="toastText">تم بنجاح!</span>
    </div>

    <div class="platform-card">
        <div class="brand-header">
            <h1>The Leader <span>In English</span></h1>
            <p id="subHeaderText">تسجيل الدخول إلى حسابك</p>
        </div>

        <!-- قسم تسجيل الدخول الأساسي -->
        <div id="loginSection" class="auth-section active">
            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> البريد الإلكتروني أو رقم الهاتف</label>
                <input type="text" id="loginIdentifier" class="form-control" placeholder="أدخل إيميلك أو رقم هاتفك">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> كلمة المرور</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="أدخل كلمة المرور">
                <div class="forgot-link">
                    <a href="#" onclick="showRecovery()">نسيت كلمة المرور؟</a>
                </div>
            </div>

            <button type="button" class="btn btn-primary" onclick="handleLogin()">دخول للمنصة <i class="fa-solid fa-arrow-left"></i></button>
        </div>

        <!-- قسم استعادة كلمة المرور عبر الإيميل -->
        <div id="recoverySection" class="recovery-section">
            <div id="recStep1">
                <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 15px; text-align: center;">أدخل بريدك الإلكتروني المسجل لنرسل لك كود استعادة كلمة المرور.</p>
                <div class="form-group">
                    <label><i class="fa-solid fa-envelope"></i> البريد الإلكتروني</label>
                    <input type="email" id="recEmail" class="form-control" placeholder="example@gmail.com">
                </div>
                <button type="button" class="btn btn-primary" onclick="sendRecoveryCode()">إرسال كود الاستعادة</button>
            </div>

            <div id="recStep2" style="display: none;">
                <div class="form-group">
                    <label><i class="fa-solid fa-key"></i> أدخل كود التحقق المُرسل</label>
                    <input type="text" id="recCode" class="form-control" placeholder="123456" style="text-align: center; letter-spacing: 4px;">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-lock"></i> كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="أدخل الباسورد الجديد">
                </div>
                <button type="button" class="btn btn-primary" onclick="resetPassword()">تحديث كلمة المرور</button>
            </div>
            
            <div style="text-align: center; margin-top: 15px;">
                <a href="#" onclick="backToLogin()" style="font-size: 13px; color: #d4af37; text-decoration: none;"><i class="fa-solid fa-arrow-right"></i> العودة لتسجيل الدخول</a>
            </div>
        </div>

        <div class="switch-auth">
            ليس لديك حساب؟ <a href="register.html">أنشئ حساباً جديداً</a>
        </div>
    </div>

    <script>
        let recGeneratedCode = '';
        let targetUserEmail = '';

        function showToast(message, isError = false) {
            const toast = document.getElementById('toastNotification');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastText').innerText = message;
            
            if(isError) {
                toast.classList.add('error');
                icon.className = "fa-solid fa-triangle-exclamation";
            } else {
                toast.classList.remove('error');
                icon.className = "fa-solid fa-circle-check";
            }
            
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        function handleLogin() {
            let identifier = document.getElementById('loginIdentifier').value.trim();
            let password = document.getElementById('loginPassword').value;

            if(!identifier || !password) {
                showToast("الرجاء إدخال بيانات الدخول كاملة!", true);
                return;
            }

            let users = JSON.parse(localStorage.getItem('leader_users') || '[]');
            let matchedUser = users.find(u => (u.email === identifier || u.phone === identifier) && u.password === password);

            if(matchedUser) {
                localStorage.setItem('current_student', JSON.stringify(matchedUser));
                showToast("أهلاً بك يا " + matchedUser.fullName + "، جاري تحويلك...");
                setTimeout(() => {
                    // window.location.href = "dashboard.html"; 
                }, 2000);
            } else {
                showToast("بيانات الدخول غير صحيحة أو الحساب غير مسجل!", true);
            }
        }

        function showRecovery() {
            document.getElementById('loginSection').classList.remove('active');
            document.getElementById('recoverySection').classList.add('active');
            document.getElementById('subHeaderText').innerText = "استعادة كلمة المرور";
        }

        function backToLogin() {
            document.getElementById('recoverySection').classList.remove('active');
            document.getElementById('loginSection').classList.add('active');
            document.getElementById('subHeaderText').innerText = "تسجيل الدخول إلى حسابك";
        }

        function sendRecoveryCode() {
            let email = document.getElementById('recEmail').value.trim();
            let users = JSON.parse(localStorage.getItem('leader_users') || '[]');
            let user = users.find(u => u.email === email);

            if(!user) {
                showToast("البريد الإلكتروني غير مسجل لدينا!", true);
                return;
            }

            targetUserEmail = email;
            recGeneratedCode = Math.floor(100000 + Math.random() * 900000).toString();

            let templateParams = {
                to_email: email,
                to_name: user.fullName,
                pass_code: recGeneratedCode
            };

            showToast("جاري إرسال كود الاستعادة...");

            emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
                .then(function(response) {
                    showToast("تم إرسال كود الاستعادة إلى إيميلك!");
                    document.getElementById('recStep1').style.display = 'none';
                    document.getElementById('recStep2').style.display = 'block';
                }, function(error) {
                    showToast("الكود التجريبي لاستعادة كلمة المرور: " + recGeneratedCode, true);
                    document.getElementById('recStep1').style.display = 'none';
                    document.getElementById('recStep2').style.display = 'block';
                });
        }

        function resetPassword() {
            let code = document.getElementById('recCode').value.trim();
            let newPass = document.getElementById('newPassword').value;

            if(code !== recGeneratedCode) {
                showToast("كود التحقق غير صحيح!", true);
                return;
            }

            if(!newPass || newPass.length < 6) {
                showToast("الرجاء إدخال كلمة مرور جديدة لا تقل عن 6 أحرف!", true);
                return;
            }

            let users = JSON.parse(localStorage.getItem('leader_users') || '[]');
            let userIndex = users.findIndex(u => u.email === targetUserEmail);

            if(userIndex !== -1) {
                users[userIndex].password = newPass;
                localStorage.setItem('leader_users', JSON.stringify(users));
                showToast("تم تحديث كلمة المرور بنجاح! سجل دخولك الآن.");
                setTimeout(() => {
                    backToLogin();
                }, 2000);
            }
        }
    </script>
</body>
</html>
