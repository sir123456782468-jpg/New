<style>
html{visibility:hidden}
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e6eaf2;--brand:#ef4444;--grad:linear-gradient(135deg,#ef4444,#ec4899);--ok:#16a34a;--bad:#dc2626}
[data-theme=dark]{--bg:#0a1020;--card:#121b30;--ink:#f1f5f9;--muted:#94a3b8;--line:#22304d;--brand:#f87171}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea{-webkit-user-select:text;user-select:text}
body{background:var(--bg);color:var(--ink);min-height:100vh}
@media print{body{display:none!important}}
.wmo{position:fixed;inset:0;z-index:60;pointer-events:none;background-image:var(--wm)}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 20px;background:var(--card);border-bottom:3px solid;border-image:linear-gradient(90deg,#ef4444,#ec4899) 1}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:42px;height:42px}.brand b{display:block;font-family:'Cinzel',serif;font-size:16px;line-height:1.15}.brand small{font-size:11px;font-weight:800;color:var(--brand)}
.wrap{max-width:780px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 34px -18px rgba(15,23,42,.25)}
.c{text-align:center}.big{font-size:56px}.c h2{margin:8px 0;font-size:24px}.c p{color:var(--muted);font-weight:600;line-height:2;margin-bottom:16px}
.btn{display:inline-block;border:none;border-radius:14px;padding:13px 28px;font-weight:900;font-size:15px;cursor:pointer;background:var(--grad);color:#fff;text-decoration:none;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.g{background:none;border:2px solid var(--brand);color:var(--brand)}
.rules{text-align:right;list-style:none;margin:14px 0 20px}.rules li{padding:9px 14px;margin-bottom:7px;border-radius:12px;background:var(--bg);font-weight:700;font-size:14px}
.meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}.pill{display:inline-block;padding:6px 16px;border-radius:50px;background:var(--bg);border:1px solid var(--line);font-weight:800;font-size:13px}.pill.t{background:var(--grad);color:#fff;border:0}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--grad);transition:width .4s}
.q canvas{display:block;width:100%;margin-bottom:12px}.qi{max-width:100%;border-radius:14px;margin-bottom:12px;pointer-events:none}.pts{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:12px}
.opts{display:grid;gap:10px}.op{display:flex;align-items:center;gap:12px;text-align:start;width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
.op:hover{border-color:var(--brand)}.op b{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:14px}.op span{flex:1}
.op.on{border-color:var(--brand);background:rgba(239,68,68,.1)}.op.on b{background:var(--grad);color:#fff;border:0}
.op.right{border-color:var(--ok);background:rgba(22,163,74,.12)}.op.wrong{border-color:var(--bad);background:rgba(220,38,38,.1)}
textarea{width:100%;min-height:150px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;outline:none;resize:vertical}textarea:focus{border-color:var(--brand)}
#nx{width:100%;margin-top:16px}
.score{font-size:64px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rv{text-align:right;margin-top:18px}.rv .card{padding:16px;margin-bottom:12px;border-radius:16px}.rv h5{font-size:15px;line-height:1.8;margin-bottom:8px}
.ov{position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.88);display:flex;align-items:center;justify-content:center;padding:20px}.ov .card{max-width:420px}
@media(max-width:600px){.hdr{padding:8px 12px}.brand div{display:none}.card{padding:18px}}
</style>

<header class="hdr"><div class="brand"><svg><use href="#logo"/></svg><div><b>The Leader In English</b><small>Mr. Sherif Khafagy</small></div></div><span class="pill" id="who"></span></header>
<main class="wrap" id="stage"><div class="card c"><div class="big">⏳</div><p>جاري تجهيز الامتحان...</p></div></main>

<script>
window.guardFail = function (m) { document.documentElement.style.visibility = 'visible'; document.body.innerHTML = '<div style="max-width:460px;margin:12vh auto;padding:28px;font-family:Cairo,sans-serif;text-align:center;direction:rtl;border:2px solid #ef4444;border-radius:20px;line-height:2"><div style="font-size:46px">🔒</div><b>تعذر فتح الصفحة</b><p style="color:#64748b">' + m + '</p><a href="signin.html" style="color:#ef4444;font-weight:800">تسجيل الدخول</a></div>'; };
setTimeout(() => { if (!window.currentUser) guardFail('تأخر التحقق من حسابك. حدّث الصفحة.'); }, 15000);
</script>
<script>
(function () {
    const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.documentElement.style.visibility = 'hidden';

    (async () => { try {
        const { data } = await supabaseClient.auth.getSession();
        const session = data && data.session;
        if (!session) { location.replace('signin.html'); return; }

        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', session.user.id)
            .maybeSingle();

        if (!profile) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('signup.html');
            return;
        }

        if (profile.is_blocked === true) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('signin.html?blocked=1');
            return;
        }

        const kicked = async (allowReclaim) => {
            try {
                let { data: ok, error } = await supabaseClient.rpc('session_ok');
                if (!error && ok === false && allowReclaim) {
                    await supabaseClient.rpc('claim_session');
                    ({ data: ok, error } = await supabaseClient.rpc('session_ok'));
                }
                if (!error && ok === false) {
                    await supabaseClient.auth.signOut({ scope: 'local' });   // local: مايطلّعش الجهاز الجديد
                    location.replace('signin.html?kicked=1');
                    return true;
                }
            } catch (e) {}
            return false;
        };
        const fresh = sessionStorage.getItem('just_logged_in') === '1';
        sessionStorage.removeItem('just_logged_in');
        if (await kicked(fresh)) return;
        setInterval(() => kicked(false), 15000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) kicked(false); });

        let admin = false;
        try {
            const { data: a } = await supabaseClient.rpc('is_admin');
            admin = a === true;
        } catch (e) {}
        window.isAdmin = admin;

        window.currentUser = session.user;
        window.currentProfile = profile;
        document.documentElement.style.visibility = 'visible';
        document.dispatchEvent(new CustomEvent('auth-ready'));
    } catch (e) {
        console.error('auth-guard error:', e);
        if (window.guardFail) window.guardFail('حدث خطأ أثناء التحقق من حسابك: ' + (e && e.message ? e.message : e));
        else location.replace('signin.html');
    } })();

    window.requireAdmin = function () {
        if (!window.isAdmin) { location.replace('home.html'); return false; }
        return true;
    };

    window.logout = async function () {
        await supabaseClient.auth.signOut({ scope: 'local' });
        location.replace('signin.html');
    };
})();

<script>
const P = new URLSearchParams(location.search), MODE = P.get('mode') === 'mistakes' ? 'mistakes' : 'exam', QID = P.get('id'), MAXV = 2;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let E = null, running = false, finished = false, timer = null, lastV = 0, KEY = '';
document.body.setAttribute('data-theme', localStorage.getItem('platform_theme') || 'light');

function rng(seed) { let a = 0; for (let i = 0; i < seed.length; i++) a = (a * 31 + seed.charCodeAt(i)) | 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function msg(icon, title, text, btn) { $('#stage').innerHTML = '<div class="card c"><div class="big">' + icon + '</div><h2>' + title + '</h2><p>' + (text || '') + '</p>' + (btn || '<a class="btn" href="home.html">الرئيسية</a>') + '</div>'; }
const LET = 'ABCDEF';

// ===== تحميل الامتحان =====
async function init() {
  const p = currentProfile, name = [p.first_name, p.last_name].join(' ');
  $('#who').textContent = name;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200"><text x="20" y="110" font-size="17" font-family="Cairo,sans-serif" font-weight="700" fill="rgba(120,120,120,0.16)" transform="rotate(-24 180 100)">' + esc(name + ' • ' + p.phone_number) + '</text></svg>';
  document.documentElement.style.setProperty('--wm', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
  KEY = 'qz:' + (QID || 'm') + ':' + currentUser.id;
  return MODE === 'mistakes' ? loadMistakes() : loadExam();
}
async function loadExam() {
  if (!QID) return msg('⚠️', 'رابط غير صحيح');
  const { data: qz } = await supabaseClient.from('quizzes').select('id,title,kind,pass_percent,time_limit_minutes,max_attempts,shuffle,courses(title)').eq('id', QID).maybeSingle();
  if (!qz) return msg('🔒', 'الامتحان غير متاح', 'تأكد إنك مشترك في الكورس وإن الامتحان منشور.');
  const [a, b] = await Promise.all([supabaseClient.from('quiz_questions').select('id,position,question,options,qtype,points,image_url').eq('quiz_id', QID).order('position'), supabaseClient.from('quiz_attempts').select('id', { count: 'exact', head: true }).eq('quiz_id', QID)]);
  if ((b.count || 0) >= qz.max_attempts) return msg('✅', 'تم تسليم هذا الامتحان', 'استنفدت عدد المحاولات المسموحة.');
  if (!a.data || !a.data.length) return msg('📭', 'لا توجد أسئلة في هذا الامتحان');
  const r = rng(currentUser.id + QID);
  let list = a.data.map(q => ({ id: q.id, type: q.qtype, text: q.question, img: q.image_url, pts: q.points, opts: q.options ? q.options.map((t, i) => ({ t, i })) : [] }));
  if (qz.shuffle) { list = shuffle(list, r); list.forEach(q => q.opts = shuffle(q.opts, r)); }
  E = { qz, qs: list, ans: {}, idx: 0, viol: 0, left: qz.time_limit_minutes ? qz.time_limit_minutes * 60 : null };
  try { const s = JSON.parse(sessionStorage.getItem(KEY)); if (s) { E.ans = s.ans || {}; E.idx = Math.min(s.idx || 0, list.length - 1); E.viol = s.viol || 0; } } catch (e) {}
  intro();
}
async function loadMistakes() {
  const { data } = await supabaseClient.rpc('my_mistakes');
  const seen = new Set(), uniq = (data || []).filter(m => m.options && !seen.has(m.question) && seen.add(m.question));
  if (uniq.length < 3) return msg('🎉', 'مفيش أخطاء كفاية', 'الامتحان ده بيتعمل من الأسئلة اللي غلطت فيها. لما تتجمع عندك 3 أخطاء على الأقل هيتفتح لك.');
  const list = shuffle(uniq, Math.random).slice(0, 20).map((m, k) => ({ id: 'm' + k, type: 'mcq', text: m.question, pts: 1, correct: m.correct_index, opts: shuffle(m.options.map((t, i) => ({ t, i })), Math.random) }));
  E = { qz: { title: 'امتحان من أخطائي', pass_percent: 50 }, qs: list, ans: {}, idx: 0, viol: 0, left: null, practice: true };
  intro();
}
function intro() {
  const q = E.qz, n = E.qs.length, pts = E.qs.reduce((s, x) => s + x.pts, 0);
  $('#stage').innerHTML = '<div class="card c"><div class="big">' + (E.practice ? '🎯' : '📝') + '</div><h2>' + esc(q.title) + '</h2>'
    + '<div class="meta"><span class="pill">' + n + ' سؤال</span><span class="pill">' + pts + ' درجة</span>' + (E.left != null ? '<span class="pill t">⏱ ' + q.time_limit_minutes + ' دقيقة</span>' : '') + '</div>'
    + '<ul class="rules">' + (E.practice
      ? '<li>🔒 تدريب خاص بك: نتيجته لا تُسجَّل ولا تظهر لأي حد، ولا تأثير لها على درجاتك.</li><li>🎯 الأسئلة من الأخطاء اللي غلطت فيها قبل كده.</li>'
      : '<li>🖥️ الامتحان بيتفتح بملء الشاشة، ومحاولة واحدة فقط (حسب إعداد الامتحان).</li><li>🚫 ممنوع الخروج من الصفحة أو فتح تبويب آخر: تحذيرين، وفي الثالثة بيتسلّم الامتحان تلقائياً.</li><li>🚫 النسخ واللصق والطباعة والتصوير مقفولة، واسمك ورقمك ظاهرين على الصفحة.</li><li>➡️ مفيش رجوع للسؤال اللي فات، والإجابات بتتحفظ لو الصفحة اتعمل لها ريفريش.</li>')
    + '</ul><button class="btn" id="go">' + (E.practice ? 'ابدأ التدريب' : 'ابدأ الامتحان') + '</button> <a class="btn g" href="home.html">رجوع</a></div>';
  $('#go').onclick = start;
}

// ===== البدء والحماية =====
async function start() {
  $('#go').disabled = true;
  if (!E.practice) {
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    try { const { data } = await supabaseClient.rpc('start_quiz', { p_quiz: QID }); if (E.qz.time_limit_minutes && data) { const el = Math.floor((Date.now() - new Date(data).getTime()) / 1000); E.left = Math.max(5, E.qz.time_limit_minutes * 60 - el); } } catch (e) {}
  }
  running = true; if (!E.practice) arm();
  $('#stage').innerHTML = ''; $('#wmo').style.display = E.practice ? 'none' : 'block';
  render(); if (E.left != null) timer = setInterval(tick, 1000);
}
function arm() {
  const v = why => { if (!running || Date.now() - lastV < 1500) return; lastV = Date.now(); violation(why); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) v('غادرت صفحة الامتحان'); });
  window.addEventListener('blur', () => v('خرجت من نافذة الامتحان'));
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) v('خرجت من وضع ملء الشاشة'); });
  ['contextmenu', 'copy', 'cut', 'paste', 'dragstart'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (e.key === 'F12' || e.key === 'PrintScreen' || ((e.ctrlKey || e.metaKey) && ['c', 'x', 'v', 'a', 'u', 's', 'p', 'i', 'j'].includes(k))) { e.preventDefault(); if (e.key === 'PrintScreen') navigator.clipboard && navigator.clipboard.writeText(' ').catch(() => {}); } });
  window.addEventListener('beforeunload', e => { if (running) { e.preventDefault(); e.returnValue = ''; } });
}
function save() { if (!E.practice) sessionStorage.setItem(KEY, JSON.stringify({ ans: E.ans, idx: E.idx, viol: E.viol })); }
function violation(why) {
  E.viol++; save();
  if (E.viol > MAXV) { submit(true); return; }
  const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = '<div class="card c"><div class="big">⚠️</div><h2>تحذير ' + E.viol + ' من ' + MAXV + '</h2><p>' + why + '. لو تكرر هيتم تسليم الامتحان تلقائياً.</p><button class="btn" id="bk">العودة للامتحان</button></div>';
  document.body.appendChild(o);
  $('#bk').onclick = async () => { o.remove(); try { await document.documentElement.requestFullscreen(); } catch (e) {} };
}
function tick() {
  E.left--; const m = Math.floor(Math.max(E.left, 0) / 60), s = Math.max(E.left, 0) % 60, t = $('#tm');
  if (t) t.textContent = '⏱ ' + m + ':' + String(s).padStart(2, '0');
  if (E.left <= 0) submit(true);
}

// ===== عرض السؤال =====
function render() {
  const q = E.qs[E.idx], n = E.qs.length, last = E.idx === n - 1;
  $('#stage').innerHTML = '<div class="qhead"><span>سؤال ' + (E.idx + 1) + ' من ' + n + '</span><span class="pill t" id="tm">' + (E.left != null ? '⏱' : '') + '</span></div><div class="bar"><i style="width:' + (E.idx / n * 100) + '%"></i></div>'
    + '<div class="card q"><canvas id="qc"></canvas>' + (q.img ? '<img class="qi" draggable="false" src="' + esc(q.img) + '">' : '') + '<div class="pts">' + q.pts + (q.pts === 1 ? ' درجة' : ' درجات') + '</div>'
    + (q.type === 'essay' ? '<textarea id="es" placeholder="اكتب إجابتك هنا...">' + esc(E.ans[q.id] || '') + '</textarea>'
      : '<div class="opts">' + q.opts.map((o, k) => '<button class="op' + (E.ans[q.id] === o.i ? ' on' : '') + '" data-i="' + o.i + '" dir="auto"><b>' + LET[k] + '</b><span>' + esc(o.t) + '</span></button>').join('') + '</div>')
    + '</div><button class="btn" id="nx">' + (last ? 'تسليم الامتحان ✅' : 'التالي ←') + '</button>';
  drawQ(q.text); tick2();
  document.querySelectorAll('.op').forEach(b => b.onclick = () => { E.ans[q.id] = +b.dataset.i; save(); document.querySelectorAll('.op').forEach(x => x.classList.toggle('on', x === b)); });
  const es = $('#es'); if (es) es.oninput = () => { E.ans[q.id] = es.value; save(); };
  $('#nx').onclick = () => {
    if (q.type === 'mcq' && E.ans[q.id] == null) { $('.opts').animate([{ transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'none' }], { duration: 250 }); return; }
    if (last) { if (confirm('تسليم الامتحان الآن؟ مش هتقدر تعدّل بعد كده.')) submit(false); } else { E.idx++; save(); render(); }
  };
}
function tick2() { if (E.left != null) { E.left++; tick(); } }
function drawQ(text) {
  const c = $('#qc'), w = Math.min(c.parentElement.clientWidth - 48, 720), dpr = window.devicePixelRatio || 1, ar = /[\u0600-\u06FF]/.test(text);
  const ctx = c.getContext('2d'); ctx.font = '700 21px Cairo, sans-serif'; ctx.direction = ar ? 'rtl' : 'ltr';
  const lines = []; text.split('\n').forEach(par => { let line = ''; par.split(/\s+/).forEach(wd => { const t = line ? line + ' ' + wd : wd; if (ctx.measureText(t).width > w && line) { lines.push(line); line = wd; } else line = t; }); lines.push(line); });
  const h = lines.length * 36 + 14; c.width = w * dpr; c.height = h * dpr; c.style.height = h + 'px';
  const x = c.getContext('2d'); x.scale(dpr, dpr); x.font = '700 21px Cairo, sans-serif'; x.direction = ar ? 'rtl' : 'ltr'; x.textAlign = ar ? 'right' : 'left'; x.textBaseline = 'top';
  x.fillStyle = getComputedStyle(document.body).getPropertyValue('--ink') || '#000';
  lines.forEach((l, i) => x.fillText(l, ar ? w : 0, 8 + i * 36));
}
window.addEventListener('resize', () => { if (running && E) drawQ(E.qs[E.idx].text); });

// ===== التسليم والنتيجة =====
async function submit(auto) {
  if (finished) return; finished = true; running = false; clearInterval(timer);
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  $('#wmo').style.display = 'none';
  if (E.practice) return practiceResult();
  msg('⏳', auto ? 'تم تسليم الامتحان تلقائياً' : 'جاري التسليم...', 'من فضلك لا تغلق الصفحة.');
  const m = {}; E.qs.forEach(q => { if (E.ans[q.id] != null) m[q.id] = q.type === 'essay' ? String(E.ans[q.id]) : E.ans[q.id]; });
  const { data, error } = await supabaseClient.rpc('submit_quiz', { p_quiz: QID, p_answers: m, p_violations: E.viol });
  if (error) { finished = false; const t = error.message || ''; return msg('⚠️', 'تعذر التسليم', t.includes('max_attempts') ? 'تم تسليم الامتحان قبل كده.' : 'تأكد من الاتصال بالإنترنت وحاول مرة أخرى (إجاباتك محفوظة).', t.includes('max_attempts') ? '' : '<button class="btn" onclick="submit(false)">إعادة المحاولة</button>'); }
  sessionStorage.removeItem(KEY);
  const pct = data.total ? Math.round(data.score / data.total * 100) : 0;
  $('#stage').innerHTML = '<div class="card c"><div class="big">' + (data.pending ? '📨' : data.passed ? '🏆' : '💪') + '</div><h2>' + (data.pending ? 'تم تسليم إجاباتك' : data.passed ? 'مبروك! عدّيت الامتحان' : 'حاول تاني، إنت قدها!') + '</h2><div class="score">' + pct + '%</div><p>' + data.score + ' من ' + data.total + ' درجة' + (data.pending ? '<br>فيه أسئلة مقالية هتتصحح يدوياً، وهتتحدّث درجتك بعد التصحيح.' : '') + (E.viol ? '<br>مرات الخروج من الامتحان: ' + E.viol : '') + '</p><a class="btn" href="home.html#mistakes">راجع أخطائي</a> <a class="btn g" href="home.html">الرئيسية</a></div>';
}
function practiceResult() {
  let ok = 0; const wrong = [];
  E.qs.forEach(q => { if (E.ans[q.id] === q.correct) ok++; else wrong.push(q); });
  const pct = Math.round(ok / E.qs.length * 100);
  $('#stage').innerHTML = '<div class="card c"><div class="big">' + (pct >= 50 ? '🌟' : '💪') + '</div><h2>نتيجتك في التدريب</h2><div class="score">' + pct + '%</div><p>' + ok + ' من ' + E.qs.length + '<br>🔒 النتيجة دي ليك إنت بس ومش بتتسجّل.</p><button class="btn" onclick="location.reload()">تدريب جديد 🎯</button> <a class="btn g" href="home.html">الرئيسية</a></div>'
    + (wrong.length ? '<div class="rv"><h3 style="margin:18px 0 10px">لسه غلطان فيها:</h3>' + wrong.map(q => '<div class="card"><h5 dir="auto">' + esc(q.text) + '</h5>' + q.opts.map(o => '<div class="op ' + (o.i === q.correct ? 'right' : o.i === E.ans[q.id] ? 'wrong' : '') + '" dir="auto"><span>' + esc(o.t) + '</span></div>').join('') + '</div>').join('') + '</div>' : '');
}

if (window.currentProfile) init(); else document.addEventListener('auth-ready', init);
</script>
