<style>

/* ===== النوافذ ===== */
.ov{position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.78);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}

.flt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.fc{padding:8px 16px;border-radius:50px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:13px;cursor:pointer}.fc.on{background:var(--grad);color:#fff;border-color:transparent}

.do b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:12px}.do span{flex:1;text-align:start}
.do.right{background:rgba(22,163,74,.13);border-color:var(--ok)}.do.right b{background:var(--ok);color:#fff;border:0}
.do.wrong{background:rgba(220,38,38,.12);border-color:var(--bad)}.do.wrong b{background:var(--bad);color:#fff;border:0}
.do i{flex:none;font-style:normal;font-size:12px;font-weight:900}.do.right i{color:var(--ok)}.do.wrong i{color:var(--bad)}
.eb{padding:12px;border-radius:12px;background:var(--soft);border:1px dashed var(--line);white-space:pre-wrap;line-height:1.9;font-weight:600}
.eim{margin-top:12px;padding:12px;border-radius:16px;border:2px dashed var(--line);background:var(--soft);text-align:center}.eim p{font-weight:700;font-size:14px;line-height:1.9;margin:6px 0}.eim .ok{color:#16a34a}.eim .er{color:#dc2626}.eim .mu{color:var(--muted);font-weight:600;font-size:13px}
.eim img{max-width:100%;max-height:340px;border-radius:12px;border:1px solid var(--line);display:block;margin:8px auto;-webkit-user-select:none;user-select:none}.eim .rw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}

@media(max-width:700px){.url{order:3;flex-basis:100%;justify-content:center;padding:4px 12px}.pill{max-width:120px}.hdr{padding:8px 12px}}

.st.pt{background:rgba(245,158,11,.18);color:#d97706}.pk{margin:0 0 10px;padding:9px 13px;border-radius:12px;background:rgba(99,102,241,.1);font-weight:700;font-size:14px}
.nb{margin-top:10px;padding:11px 14px;border-radius:12px;background:rgba(245,158,11,.12);border:1px dashed rgba(245,158,11,.5);font-weight:600;line-height:1.9;white-space:pre-wrap}.nb.fb{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.45)}
#shd{position:fixed;inset:0;z-index:2147483000;background:#000;color:#e2e8f0;display:none;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:18px;padding:20px}#shd.on{display:flex}

<script>
window.guardFail = function (m) { document.documentElement.style.visibility = 'visible'; document.body.innerHTML = '<div style="max-width:460px;margin:12vh auto;padding:28px;font-family:Cairo,sans-serif;text-align:center;direction:rtl;border:2px solid #ef4444;border-radius:20px;line-height:2"><div style="font-size:46px">🔒</div><b>تعذر فتح الصفحة</b><p style="color:#64748b">' + m + '</p><a href="/signin.html" style="color:#ef4444;font-weight:800">تسجيل الدخول</a></div>'; };
setTimeout(() => { if (!window.currentUser) guardFail('تأخر التحقق من حسابك. حدّث الصفحة.'); }, 15000);
</script>
<script>
(function () {
    const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.documentElement.style.visibility = 'hidden';

    (async () => { try {
        const { data } = await supabaseClient.auth.getSession();
        const session = data && data.session;
        if (!session) { location.replace('/signin.html'); return; }

        // طلبات التحقق بتتبعت كلها مرة واحدة بالتوازي (كانت ورا بعض = بطء)
        const fresh = sessionStorage.getItem('just_logged_in') === '1';
        sessionStorage.removeItem('just_logged_in');
        const kicked = async (allowReclaim) => {
            try {
                if (allowReclaim) await supabaseClient.rpc('claim_session');          // دخول جديد = الجهاز ده هو المعتمد وأي جهاز تاني بيتخرّج
                let { data: ok, error } = await supabaseClient.rpc('session_ok');
                if (!error && ok === false) {
                    await supabaseClient.auth.signOut({ scope: 'local' });   // local: مايطلّعش الجهاز الجديد
                    location.replace('/signin.html?kicked=1');
                    return true;
                }
            } catch (e) {}
            return false;
        };
        const pAdmin = supabaseClient.rpc('is_admin').then(r => r.data === true, () => false);
        const pKick = kicked(fresh);
        let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).maybeSingle();

        if (!profile) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('/signup.html');
            return;
        }

        if (profile.is_blocked === true) {                       // الإيقاف المؤقت ممكن يكون خلص: السيرفر بيفتح الحساب تلقائياً
            try { const g = await supabaseClient.rpc('account_gate'); if (g.data && g.data.blocked === false) { const r2 = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).maybeSingle(); if (r2.data) profile = r2.data; } } catch (e) {}
        }
        if (profile.is_blocked === true) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('/signin.html?blocked=1');
            return;
        }

        if (await pKick) return;
        setInterval(() => { if (!document.hidden) kicked(false); }, 45000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) kicked(false); });

        const admin = await pAdmin;
        window.isAdmin = admin;

        window.currentUser = session.user;
        window.currentProfile = profile;
        document.documentElement.style.visibility = 'visible';
        document.dispatchEvent(new CustomEvent('auth-ready'));
    } catch (e) {

// ===== مقالي بصورة: اختيار → إرسال الصورة (رفع + تأكيد) → بتوصل للمدرس بعد تسليم الامتحان بس =====
function pickGrace(ms) { if (!E) return; E.picks = (E.picks || 0) + 1; E.pickUntil = E.picks > 20 ? 0 : Date.now() + (ms || 90000); }
async function cmpImg(file) {
  const img = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('bad_image')); i.src = r.result; }; r.onerror = () => rej(new Error('bad_image')); r.readAsDataURL(file); });

    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', qlt));

}

async function eiRaw(q, file) {            // يرفع ويتأكد إن الصورة موجودة وبتتفتح، ويرجّع بياناتها
  const blob = await cmpImg(file);
  const path = currentUser.id + '/' + QID + '-' + q.id + '-' + Date.now().toString(36) + '.jpg';
  const st = supabaseClient.storage.from('essay-files');
  const up = await st.upload(path, blob, { contentType: 'image/jpeg', upsert: false }); if (up.error) throw up.error;
  const sg = await st.createSignedUrl(path, 3600); if (sg.error || !sg.data || !sg.data.signedUrl) throw new Error('verify');
  await new Promise((res, rej) => { const im = new Image(); im.onload = res; im.onerror = () => rej(new Error('verify')); im.src = sg.data.signedUrl; });
  return { path, ok: true, url: sg.data.signedUrl, kb: Math.round(blob.size / 1024) };

function drawTxt(c, text, fs, lh) {

async function submit(auto) {

  clearTimeout(svT);

  const m = answersMap(); const lw = $('#lw'); if (lw) lw.remove();
  let { data, error } = await supabaseClient.rpc('quiz_submit_full', { p_quiz: QID, p_answers: m, p_violations: E.viol });
  if (error && /quiz_submit_full|could not find|does not exist/i.test(error.message || '')) {      // لو ملف الـSQL الجديد لسه ما اتشغّلش
    const m2 = {}; Object.keys(m).forEach(k => m2[k] = Array.isArray(m[k]) ? m[k][0] : m[k]);
    ({ data, error } = await supabaseClient.rpc('submit_quiz', { p_quiz: QID, p_answers: m2, p_violations: E.viol }));
  }
  if (error) { finished = false; const t = error.message || ''; return msg('⚠️', 'تعذر التسليم', t.includes('max_attempts') ? 'تم تسليم الامتحان قبل كده.' : 'تأكد من الاتصال بالإنترنت وحاول مرة أخرى (إجاباتك محفوظة).', t.includes('max_attempts') ? '' : '<button class="btn" onclick="submit(false)">إعادة المحاولة</button>'); }
  try { localStorage.removeItem(KEY); } catch (e) {}
  try { await supabaseClient.rpc('draft_done', { p_quiz: QID }); } catch (e) {}
  // نجيب التفاصيل الكاملة (صح / غلط / إجابات) من الدالة الجديدة، ولو مش متاحة نعرض النتيجة الأساسية

    const id = (data && data.attempt_id) || await latestAttempt();
    if (id) { const r = await supabaseClient.rpc('quiz_review', { p_attempt: id }); if (!r.error && r.data) R = r.data; }

}

  x.fillStyle = '#fff'; x.beginPath(); const r = 44, bx = 60, by = 210, bw = W - 120, bh = 960; x.moveTo(bx + r, by); x.arcTo(bx + bw, by, bx + bw, by + bh, r); x.arcTo(bx + bw, by + bh, bx, by + bh, r); x.arcTo(bx, by + bh, bx, by, r); x.arcTo(bx, by, bx + bw, by, r); x.closePath(); x.fill();

function pdfOfJpeg(bytes, w, h) {
  const enc = new TextEncoder(), parts = [], off = []; let len = 0, pw = 595, ph = Math.round(595 * h / w);
  const add = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
  add('%PDF-1.4\n');
  const obj = (n, body) => { off[n] = len; add(n + ' 0 obj\n' + body + '\nendobj\n'); };
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>'); obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  off[4] = len; add('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + w + ' /Height ' + h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + bytes.length + ' >>\nstream\n'); add(bytes); add('\nendstream\nendobj\n');
  const cs = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im0 Do Q'; obj(5, '<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream');
  const xr = len; add('xref\n0 6\n0000000000 65535 f \n' + [1, 2, 3, 4, 5].map(n => String(off[n]).padStart(10, '0') + ' 00000 n \n').join('') + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF');
  return new Blob(parts, { type: 'application/pdf' });
}
async function shareCard(o, kind, btn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = '⏳...';
  try {
    const c = await drawResultCard(o), fn = 'result-' + new Date().toISOString().slice(0, 10) + (kind === 'pdf' ? '.pdf' : '.png');
    let blob;
    if (kind === 'pdf') { const b64 = c.toDataURL('image/jpeg', 0.92).split(',')[1], bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); blob = pdfOfJpeg(u, c.width, c.height); }
    else blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
    const file = new File([blob], fn, { type: blob.type });
    if (kind === 'png' && navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'نتيجتي في ' + (o.title || 'الامتحان') }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 20000);
  } catch (e) { try { toast('تعذر تجهيز الصورة'); } catch (z) { alert('تعذر تجهيز الصورة'); } }
  finally { btn.disabled = false; btn.textContent = old; }
}

function detailsHTML(R) {
  const qs = R.questions.slice().sort((a, b) => (a.position || 0) - (b.position || 0));
  const stt = q => q.qtype === 'essay' ? 'es' : q.chosen_index == null ? 'na' : ((q.is_correct != null ? q.is_correct : q.chosen_index === q.correct_index) ? 'ok' : (q.pick_n > 1 && +q.multi_score > 0 ? 'pt' : 'no'));
  const cnt = { all: qs.length, ok: 0, pt: 0, no: 0, na: 0, es: 0 }; qs.forEach(q => cnt[stt(q)]++);
  const chips = [['all', 'الكل'], ['ok', '✓ صحيحة'], ['pt', '◐ جزئية'], ['no', '✗ خاطئة'], ['na', 'بدون إجابة'], ['es', '✍️ مقالي']].filter(c => c[0] === 'all' || cnt[c[0]]).map((c, i) => '<button type="button" class="fc' + (i ? '' : ' on') + '" data-f="' + c[0] + '">' + c[1] + ' (' + cnt[c[0]] + ')</button>').join('');
  const shownP = {};
  const cards = qs.map((q, i) => {
    const s = stt(q), lab = { ok: '✓ إجابة صحيحة', pt: '◐ إجابة جزئية', no: '✗ إجابة خاطئة', na: 'لم تُجب', es: q.essay_score == null ? '🕒 بانتظار التصحيح' : 'تم التصحيح' }[s];
    const earned = s === 'ok' ? q.points : s === 'pt' ? q.multi_score : s === 'es' ? (q.essay_score == null ? '—' : q.essay_score) : 0;
    const body = q.qtype === 'essay'
      ? ((q.essay_text || '').trim() || !q.essay_image ? '<div class="eb" dir="auto">' + (esc(q.essay_text || '').trim() || 'لم تكتب إجابة') + '</div>' : '') + (q.essay_image ? '<div class="eimg"><img data-eimg="' + esc(q.essay_image) + '" alt="صورة إجابتك" draggable="false"></div>' : '')
      : (q.options || []).map((t, j) => { const mu = q.pick_n > 1, right = mu ? (q.correct_set || [q.correct_index]).includes(j) : j === q.correct_index, mine = mu ? (q.chosen_multi || []).includes(j) : j === q.chosen_index; return '<div class="do ' + (right ? 'right' : mine ? 'wrong' : '') + '" dir="' + (AR.test(t) ? 'rtl' : 'ltr') + '"><b>' + LET[j] + '</b><span>' + esc(t) + '</span>' + (right ? '<i>' + (mine ? 'إجابتك ✓ صحيحة' : 'الإجابة الصحيحة') + '</i>' : mine ? '<i>إجابتك ✗</i>' : '') + '</div>'; }).join('');
    const pa = q.passage_id && (R.passages || []).find(z => z.id === q.passage_id), firstP = pa && !shownP[pa.id] && (shownP[pa.id] = 1);
    return '<div class="dq ' + s + '" data-s="' + s + '"><div class="dh"><b>السؤال ' + (i + 1) + '</b><span class="st ' + s + '">' + lab + '</span><span class="pp">' + earned + ' / ' + q.points + ' درجة</span></div>' + (pa ? '<details class="dpass"' + (firstP ? ' open' : '') + '><summary>📖 Passage' + (pa.title ? ' — ' + esc(pa.title) : '') + '</summary><div class="dt" dir="auto">' + esc(pa.body) + '</div></details>' : '') + '<div class="dt" dir="auto">' + esc(q.question) + '</div>' + (q.image_url ? '<img class="qi" draggable="false" src="' + esc(q.image_url) + '">' : '') + body + (q.note ? '<div class="nb">💡 ملاحظة: ' + esc(q.note) + '</div>' : '') + (q.feedback ? '<div class="nb fb">👨‍🏫 تعليق المدرس: ' + esc(q.feedback) + '</div>' : '') + '</div>';
  }).join('');
  return '<div class="card"><h2 class="rt0" style="font-size:22px">تفاصيل الإجابات</h2><div class="flt" style="justify-content:center;margin-top:12px">' + chips + '</div>' + cards + '</div>';
}
