<style>
html{visibility:hidden}
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e6eaf2;--soft:#f1f4f9;--brand:#ef4444;--grad:linear-gradient(135deg,#ef4444,#ec4899);--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b}
[data-theme=dark]{--bg:#0a1020;--card:#121b30;--ink:#f1f5f9;--muted:#94a3b8;--line:#22304d;--soft:#0e1729;--brand:#f87171}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

body{background:var(--bg);color:var(--ink);min-height:100vh}
@media print{body{display:none!important}}
.wmo{position:fixed;inset:0;z-index:60;pointer-events:none;background-image:var(--wm)}

/* ===== الهيدر: اسم المنصة + اسم المستر + الرابط ===== */
.hdr{position:relative;z-index:50;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:9px 20px;background:var(--card);border-bottom:3px solid;border-image:linear-gradient(90deg,#ef4444,#ec4899) 1}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:46px;height:46px;flex:none}

.url{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:50px;background:var(--soft);border:1px solid var(--line);font-weight:800;font-size:12.5px;color:var(--muted);direction:ltr}
.hr{display:flex;align-items:center;gap:8px}
.pill{display:inline-block;padding:6px 16px;border-radius:50px;background:var(--soft);border:1px solid var(--line);font-weight:800;font-size:13px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:18px}

.wrap{max-width:920px;margin:0 auto;padding:18px 14px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 34px -18px rgba(15,23,42,.25)}

/* ===== الأزرار ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:13px 26px;font-weight:900;font-size:15px;cursor:pointer;background:var(--grad);color:#fff;text-decoration:none;transition:.2s}

.btn.g{background:none;border:2px solid var(--brand);color:var(--brand)}
.btn.red{background:#f43f5e}.btn.grn{background:#16a34a}.btn.amb{background:#f59e0b}.btn.ind{background:#6366f1}.btn.blk{display:flex;width:100%;margin-top:10px}

/* ===== بطاقات الأرقام ===== */
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.kc{padding:16px 10px;border-radius:20px;background:var(--soft);border:1px solid var(--line);text-align:center}

/* ===== شريط الوقت الثابت ===== */
.tbar{position:sticky;top:0;z-index:55;margin:-18px -14px 14px;padding:10px 16px 9px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 8px 20px -16px rgba(15,23,42,.45)}

.tmr{font-size:24px;font-weight:900;letter-spacing:1px;direction:ltr;font-variant-numeric:tabular-nums}

.pbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:8px}.pbar i{display:block;height:100%;background:var(--grad);transition:width .4s}

.qh{display:flex;justify-content:space-between;font-weight:800;font-size:13px;color:var(--muted);margin-bottom:8px}

.qb{position:relative;width:46px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font-weight:900;font-size:15px;cursor:pointer}

/* ===== السؤال ===== */

.qt1{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}.qt1 h3{font-size:24px;font-weight:900;color:var(--muted)}

.rrow{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;border-radius:12px;background:var(--soft);cursor:pointer;font-weight:700;font-size:14px;text-align:right}

.rt0{font-size:28px;font-weight:900;text-align:center}
.hero{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap;margin:14px 0 8px}

.vd{text-align:center}.vd .vi{font-size:44px}.vd h3{font-size:22px;margin:4px 0}.vd p{color:var(--muted);font-weight:700;margin:0}
.nt{margin-top:10px;padding:12px 16px;border-radius:14px;background:rgba(99,102,241,.1);font-weight:700;line-height:1.9;text-align:center}.nt.wn{background:rgba(245,158,11,.12)}
.ra{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.fc{padding:8px 16px;border-radius:50px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:13px;cursor:pointer}.fc.on{background:var(--grad);color:#fff;border-color:transparent}
.dq{padding:16px;margin-bottom:12px;border-radius:18px;border:1px solid var(--line);border-right:6px solid var(--line);background:var(--card);text-align:right}
.dq.ok{border-right-color:var(--ok)}.dq.no{border-right-color:var(--bad)}.dq.na{border-right-color:var(--warn)}.dq.es{border-right-color:#6366f1}
.dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-weight:800}
.st{padding:4px 12px;border-radius:50px;font-size:12px;font-weight:900;color:#fff}.st.ok{background:var(--ok)}.st.no{background:var(--bad)}.st.na{background:var(--warn)}.st.es{background:#6366f1}
.pp{margin-inline-start:auto;color:var(--muted);font-size:13px}
.dt{font-size:16px;font-weight:700;line-height:1.9;margin-bottom:10px;white-space:pre-wrap}
.do{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-weight:600;font-size:14.5px;line-height:1.7}
.do b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:12px}.do span{flex:1;text-align:start}
.do.right{background:rgba(22,163,74,.13);border-color:var(--ok)}.do.right b{background:var(--ok);color:#fff;border:0}
.do.wrong{background:rgba(220,38,38,.12);border-color:var(--bad)}.do.wrong b{background:var(--bad);color:#fff;border:0}
.do i{flex:none;font-style:normal;font-size:12px;font-weight:900}.do.right i{color:var(--ok)}.do.wrong i{color:var(--bad)}
.eb{padding:12px;border-radius:12px;background:var(--soft);border:1px dashed var(--line);white-space:pre-wrap;line-height:1.9;font-weight:600}

@media(max-width:700px){.url{order:3;flex-basis:100%;justify-content:center;padding:4px 12px}.pill{max-width:120px}.hdr{padding:8px 12px}}
@media(max-width:600px){.kp{grid-template-columns:repeat(2,1fr)}.card{padding:16px}.stats{gap:6px}.sb b{font-size:22px}.qb{width:40px;height:38px}.qt1 h3{font-size:19px}.op{font-size:15px;padding:10px 12px}.ring{width:130px;height:130px}.ring b{font-size:30px}.kc b{font-size:26px}}
.nb{margin-top:10px;padding:11px 14px;border-radius:12px;background:rgba(245,158,11,.12);border:1px dashed rgba(245,158,11,.5);font-weight:600;line-height:1.9;white-space:pre-wrap}.nb.fb{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.45)}
#shd{position:fixed;inset:0;z-index:2147483000;background:#0b1020;color:#e2e8f0;display:none;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:18px;padding:20px}#shd.on{display:flex}

</style>

<script>
window.guardFail = function (m) { document.documentElement.style.visibility = 'visible'; document.body.innerHTML = '<div style="max-width:460px;margin:12vh auto;padding:28px;font-family:Cairo,sans-serif;text-align:center;direction:rtl;border:2px solid #ef4444;border-radius:20px;line-height:2"><div style="font-size:46px">🔒</div><b>تعذر فتح الصفحة</b><p style="color:#64748b">' + m + '</p><a href="signin.html" style="color:#ef4444;font-weight:800">تسجيل الدخول</a></div>'; };

</script>
<script>
(function () {
    const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.documentElement.style.visibility = 'hidden';

    (async () => { try {
        const { data } = await supabaseClient.auth.getSession();
        const session = data && data.session;
        if (!session) { location.replace('signin.html'); return; }

        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', session.user.id)
            .maybeSingle();

        if (!profile) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('signup.html');
            return;
        }

        if (profile.is_blocked === true) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('signin.html?blocked=1');
            return;
        }

        const kicked = async (allowReclaim) => {
            try {
                let { data: ok, error } = await supabaseClient.rpc('session_ok');
                if (!error && ok === false && allowReclaim) {
                    await supabaseClient.rpc('claim_session');
                    ({ data: ok, error } = await supabaseClient.rpc('session_ok'));
                }
                if (!error && ok === false) {
                    await supabaseClient.auth.signOut({ scope: 'local' });   // local: مايطلّعش الجهاز الجديد
                    location.replace('signin.html?kicked=1');
                    return true;
                }
            } catch (e) {}
            return false;
        };
        const fresh = sessionStorage.getItem('just_logged_in') === '1';
        sessionStorage.removeItem('just_logged_in');
        if (await kicked(fresh)) return;
        setInterval(() => kicked(false), 15000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) kicked(false); });

        let admin = false;
        try {
            const { data: a } = await supabaseClient.rpc('is_admin');
            admin = a === true;
        } catch (e) {}
        window.isAdmin = admin;

        window.currentUser = session.user;
        window.currentProfile = profile;
        document.documentElement.style.visibility = 'visible';
        document.dispatchEvent(new CustomEvent('auth-ready'));
    } catch (e) {
        console.error('auth-guard error:', e);
        if (window.guardFail) window.guardFail('حدث خطأ أثناء التحقق من حسابك: ' + (e && e.message ? e.message : e));
        else location.replace('signin.html');
    } })();

    window.requireAdmin = function () {
        if (!window.isAdmin) { location.replace('home.html'); return false; }
        return true;
    };

    window.logout = async function () {
        await supabaseClient.auth.signOut({ scope: 'local' });
        location.replace('signin.html');
    };
})();

</script>

const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));

    + '<div class="card qc"><div class="qt1"><h3>السؤال رقم: ' + (E.idx + 1) + '</h3><span class="tg t">' + (essay ? 'مقالي' : 'اختيار من متعدد') + '</span><span class="tg p">درجة السؤال: (' + q.pts + ')</span><button type="button" class="bk' + (E.flag.has(q.id) ? ' on' : '') + '" id="bm" title="علّم للمراجعة">' + BM + '</button></div>'
    + '<div class="q"><canvas id="qc"></canvas>' + (q.img ? '<img class="qi" draggable="false" src="' + esc(q.img) + '">' : '')
    + (essay ? '<textarea id="es" placeholder="اكتب إجابتك هنا...">' + esc(E.ans[q.id] || '') + '</textarea>'
      : '<div class="opts">' + q.opts.map((o, k) => '<button type="button" class="op' + (E.ans[q.id] === o.i ? ' on' : '') + '" data-i="' + o.i + '" dir="' + (AR.test(o.t) ? 'rtl' : 'ltr') + '"><b>' + LET[k] + '</b><span>' + esc(o.t) + '</span></button>').join('') + '</div>') + '</div>'
    + '<div class="nv"><button type="button" class="btn g" id="pv"' + (E.idx === 0 ? ' disabled' : '') + '>→ السابق</button>' + (last ? '<button type="button" class="btn grn" id="nx">إنهاء الاختبار ✅</button>' : '<button type="button" class="btn" id="nx">التالي ←</button>') + '</div></div>';
  drawQ(q.text); tick(); bindGrid();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (running && E.qs[E.idx] === q && $('#qc')) drawQ(q.text); });
  $$('.op').forEach(b => b.onclick = () => { E.ans[q.id] = +b.dataset.i; save(); $$('.op').forEach(x => x.classList.toggle('on', x === b)); refreshTop(); });
  const es = $('#es'); if (es) es.oninput = () => { E.ans[q.id] = es.value; save(); refreshTop(); };
  $('#bm').onclick = () => { E.flag.has(q.id) ? E.flag.delete(q.id) : E.flag.add(q.id); save(); $('#bm').classList.toggle('on', E.flag.has(q.id)); refreshTop(); };
  $('#pv').onclick = () => go(E.idx - 1);
  $('#nx').onclick = () => last ? finishModal() : go(E.idx + 1);
  $('#fin').onclick = finishModal; $('#rev').onclick = reviewModal;
}
function drawQ(text) {
  const c = $('#qc'); if (!c) return;
  const w = Math.max(Math.min(c.parentElement.clientWidth, 780), 200), dpr = window.devicePixelRatio || 1, ar = AR.test(text);
  const ctx = c.getContext('2d'); ctx.font = '700 21px Cairo, sans-serif'; ctx.direction = ar ? 'rtl' : 'ltr';
  const lines = []; text.split('\n').forEach(par => { let line = ''; par.split(/\s+/).forEach(wd => { const t = line ? line + ' ' + wd : wd; if (ctx.measureText(t).width > w && line) { lines.push(line); line = wd; } else line = t; }); lines.push(line); });
  const h = lines.length * 36 + 14; c.width = w * dpr; c.height = h * dpr; c.style.height = h + 'px';
  const x = c.getContext('2d'); x.scale(dpr, dpr); x.font = '700 21px Cairo, sans-serif'; x.direction = ar ? 'rtl' : 'ltr'; x.textAlign = ar ? 'right' : 'left'; x.textBaseline = 'top';
  x.fillStyle = getComputedStyle(document.body).getPropertyValue('--ink').trim() || '#000';
  lines.forEach((l, i) => x.fillText(l, ar ? w : 0, 8 + i * 36));
  stamp(x, w, h);
}
function stamp(x, w, h) {
  const p = currentProfile, t = [p.first_name, p.last_name].join(' ') + ' • ' + p.phone_number;
  x.save(); x.globalAlpha = .13; x.fillStyle = '#888'; x.font = '700 14px Cairo, sans-serif'; x.direction = 'ltr'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.translate(w / 2, h / 2); x.rotate(-0.35);
  for (let yy = -w; yy <= w; yy += 70) for (let xx = -w; xx <= w; xx += 240) x.fillText(t, xx + (((yy / 70) & 1) ? 120 : 0), yy);
  x.restore();
}
window.addEventListener('resize', () => { if (running && E && E.qs[E.idx] && $('#qc')) drawQ(E.qs[E.idx].text); });

// ===== نوافذ: إنهاء الاختبار + مراجعة الإجابات =====
function overlay(html) { const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = '<div class="card c"><button type="button" class="x">✕</button>' + html + '</div>'; document.body.appendChild(o); o.querySelector('.x').onclick = () => o.remove(); return o; }
function finishModal() {
  $$('.ov').forEach(x => x.remove());
  const n = E.qs.length, a = E.qs.filter(isAns).length, un = n - a, fl = E.flag.size;
  const o = overlay('<h2>تفاصيل الامتحان</h2><h3 style="margin:6px 0 0;font-size:17px">' + esc(E.qz.title) + '</h3>'
    + '<div class="two"><div class="bx b1"><small>عدد الأسئلة المجابة</small><b>' + a + ' سؤال</b></div><div class="bx b2"><small>عدد الأسئلة الغير مجابة</small><b>' + un + ' سؤال</b></div></div>'
    + (fl ? '<p style="margin-bottom:8px">🔖 عندك ' + fl + ' سؤال معلّم للمراجعة.</p>' : '') + (un ? '<p class="wn" style="margin-bottom:8px">⚠️ لسه فيه أسئلة ما جاوبتش عليها، وهتتحسب غلط لو سلّمت.</p>' : '')
    + '<button type="button" class="btn amb blk" id="fr">مراجعة</button><button type="button" class="btn ind blk" id="fs">تسليم نهائي</button>');
  o.querySelector('#fr').onclick = () => { o.remove(); const k = E.qs.findIndex(q => !isAns(q)); if (k >= 0 && k !== E.idx) go(k); };
  o.querySelector('#fs').onclick = () => { o.remove(); submit(false); };
}
function reviewModal() {
  const o = overlay('<h2 style="margin-bottom:14px">مراجعة الإجابات</h2>' + E.qs.map((q, k) => '<div class="rrow" data-k="' + k + '"><span class="rn">' + (k + 1) + '</span><span class="rtx" dir="auto">' + esc(q.text.slice(0, 80)) + '</span>' + (E.flag.has(q.id) ? '<span>🔖</span>' : '') + '<span class="rst ' + (isAns(q) ? 'a' : 'u') + '">' + (isAns(q) ? 'تمت الإجابة' : 'بدون إجابة') + '</span></div>').join(''));
  o.querySelectorAll('.rrow').forEach(r => r.onclick = () => { o.remove(); go(+r.dataset.k); });
}

// ===== التسليم والنتيجة =====
async function submit(auto) {
  if (finished) return; finished = true; running = false; clearInterval(timer);
  $$('.ov').forEach(x => x.remove());
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (E.practice) return practiceResult();
  msg('⏳', auto ? 'تم تسليم الامتحان تلقائياً' : 'جاري التسليم...', 'من فضلك لا تغلق الصفحة.');
  clearTimeout(svT); const m = answersMap(); const lw = $('#lw'); if (lw) lw.remove();
  const { data, error } = await supabaseClient.rpc('submit_quiz', { p_quiz: QID, p_answers: m, p_violations: E.viol });
  if (error) { finished = false; const t = error.message || ''; return msg('⚠️', 'تعذر التسليم', t.includes('max_attempts') ? 'تم تسليم الامتحان قبل كده.' : 'تأكد من الاتصال بالإنترنت وحاول مرة أخرى (إجاباتك محفوظة).', t.includes('max_attempts') ? '' : '<button class="btn" onclick="submit(false)">إعادة المحاولة</button>'); }
  try { localStorage.removeItem(KEY); } catch (e) {}
  try { await supabaseClient.rpc('draft_done', { p_quiz: QID }); } catch (e) {}
  // نجيب التفاصيل الكاملة (صح / غلط / إجابات) من الدالة الجديدة، ولو مش متاحة نعرض النتيجة الأساسية
  let R = null;
  try {
    const id = (data && data.attempt_id) || await latestAttempt();
    if (id) { const r = await supabaseClient.rpc('quiz_review', { p_attempt: id }); if (!r.error && r.data) R = r.data; }
  } catch (e) {}
  renderResult(R || fallbackR(data || {}), {});
}
function fallbackR(d) {
  const a = E.qs.filter(isAns).length;
  return { title: E.qz.title, score: d.score, total: d.total, pass_percent: E.qz.pass_percent, passed: d.passed, pending: d.pending, n_questions: E.qs.length, n_unanswered: E.qs.length - a, max_attempts: E.qz.max_attempts, violations: E.viol, quiz_id: QID, can_review: false, fallback: true, questions: [] };
}
async function openReview(id, direct) {
  msg('⏳', 'جاري تحميل النتيجة...', '');
  const { data, error } = await supabaseClient.rpc('quiz_review', { p_attempt: id });
  if (error || !data) return msg('⚠️', 'تعذر تحميل النتيجة', 'حاول مرة أخرى بعد قليل.', '<a class="btn" href="home.html#results">نتائجي</a>');
  renderResult(data, { direct: direct });
}
function practiceResult() {
  const qs = E.qs.map((q, k) => ({ id: q.id, position: k + 1, question: q.text, qtype: 'mcq', points: 1, options: q.orig, correct_index: q.correct, chosen_index: E.ans[q.id] == null ? null : E.ans[q.id], is_correct: E.ans[q.id] === q.correct }));
  const ok = qs.filter(x => x.is_correct).length, na = qs.filter(x => x.chosen_index == null).length;
  renderResult({ title: 'تدريب من أخطائي', practice: true, score: ok, total: qs.length, pass_percent: 50, passed: ok / qs.length * 100 >= 50, pending: false, n_questions: qs.length, n_correct: ok, n_wrong: qs.length - ok - na, n_unanswered: na, can_review: true, questions: qs }, {});
}

function renderResult(R, o) {
  o = o || {}; finished = true; running = false;
  if (R.hidden) {
    const why = R.hidden_reason === 'grading' ? 'نتيجتك هتظهر بعد ما المدرس يخلّص تصحيح الأسئلة المقالية.' : 'نتيجتك هتظهر بعد انتهاء وقت الامتحان.';
    $('#wmo').style.display = 'block';
    $('#stage').innerHTML = '<div class="card c"><div class="big">✅</div><h2>تم تسليم إجاباتك بنجاح</h2><p>' + esc(R.title || '') + '</p><p class="nt">🕒 ' + why + '</p><div class="ra"><a class="btn" href="home.html#results">نتائجي</a><a class="btn g" href="home.html">الرئيسية</a></div></div>';
    return;
  }
  const total = +R.total || 0, score = +R.score || 0, pct = total ? Math.round(score / total * 100) : 0, pending = !!R.pending;
  const passed = !pending && (R.passed != null ? !!R.passed : pct >= (R.pass_percent == null ? 50 : R.pass_percent));
  const col = pending ? '#6366f1' : passed ? '#16a34a' : '#dc2626';
  const nv = v => v == null ? '—' : v, left = (R.max_attempts != null && R.attempts_used != null) ? Math.max(R.max_attempts - R.attempts_used, 0) : null;
  const k = (cls, l, v, s) => '<div class="kc ' + cls + '"><small>' + l + '</small><b>' + v + '</b>' + (s ? '<em>' + s + '</em>' : '') + '</div>';
  const secs = R.seconds_spent != null ? pad(Math.floor(R.seconds_spent / 60)) + ':' + pad(R.seconds_spent % 60) : null;
  const canDet = !!(R.can_review && R.questions && R.questions.length);
  $('#wmo').style.display = R.practice ? 'none' : 'block';
  $('#stage').innerHTML = '<div class="card"><h2 class="rt0">نتيجة الامتحان</h2><p class="sub" style="text-align:center">' + esc(R.title) + '</p>'
    + '<div class="hero"><div class="ring" style="--p:' + pct + ';--c:' + col + '"><div><b>' + pct + '%</b><small>النسبة المئوية</small></div></div>'
    + '<div class="vd"><div class="vi">' + (pending ? '📨' : passed ? '🏆' : '💪') + '</div><h3 style="color:' + col + '">' + (pending ? 'تم تسليم إجاباتك' : passed ? 'مبروك! عدّيت الامتحان' : 'حاول تاني، إنت قدها!') + '</h3>'
    + (R.n_correct != null ? '<p>أجبت صح على <b>' + R.n_correct + '</b> من <b>' + nv(R.n_questions) + '</b> سؤال</p>' : '') + '</div></div>'
    + '<div class="kp">' + k('', 'درجة الامتحان', score + '/' + total, 'درجة') + k('', 'النسبة المئوية', pct + '%', '') + k(pending ? 'pd' : passed ? 'ok' : 'no', 'النتيجة', pending ? 'قيد التصحيح' : passed ? 'ناجح' : 'راسب', pending ? 'بانتظار المقالي' : 'بالتوفيق')
    + k('', 'عدد الأسئلة', nv(R.n_questions), 'سؤال') + k('ok', 'إجابات صحيحة', nv(R.n_correct), 'سؤال') + k('no', 'إجابات خاطئة', nv(R.n_wrong), 'سؤال') + k('wt', 'بدون إجابة', nv(R.n_unanswered), 'سؤال') + (left != null ? k('', 'المحاولات المتاحة', left, 'محاولة') : '') + '</div>'
    + (R.result_note ? '<div class="nb">📌 ' + esc(R.result_note) + '</div>' : '')
    + (pending ? '<p class="nt">✍️ فيه أسئلة مقالية هتتصحح يدوياً، وهتتحدّث درجتك بعد التصحيح (هتلاقيها في «نتائجي»).</p>' : '')
    + (R.violations ? '<p class="nt wn">⚠️ مرات الخروج من الامتحان: ' + R.violations + '</p>' : '') + (secs ? '<p class="nt" style="background:var(--soft)">⏱ الوقت المستغرق: ' + secs + '</p>' : '')
    + (!canDet && !R.practice && !R.fallback ? '<p class="nt" style="background:var(--soft)">🔒 تفاصيل الإجابات بتظهر بعد ما تخلّص كل محاولاتك' + (left ? ' (باقي ' + left + ')' : '') + '.</p>' : '')
    + '<div class="ra">' + (canDet ? '<button type="button" class="btn" id="dt">👁 تفاصيل الإجابات</button>' : '') + (left > 0 && R.quiz_id && !R.practice ? '<a class="btn amb" href="quiz.html?id=' + esc(R.quiz_id) + '">🔁 محاولة جديدة</a>' : '')
    + (R.practice ? '<button type="button" class="btn" onclick="location.reload()">تدريب جديد 🎯</button>' : '<a class="btn g" href="home.html#results">نتائجي</a>') + '<a class="btn g" href="home.html">الرئيسية</a></div></div>'
    + (canDet ? '<div id="det" style="display:none;margin-top:16px">' + detailsHTML(R) + '</div>' : '');
  if (canDet) {
    $('#dt').onclick = () => { const d = $('#det'), on = d.style.display === 'none'; d.style.display = on ? 'block' : 'none'; $('#dt').textContent = on ? '🙈 إخفاء التفاصيل' : '👁 تفاصيل الإجابات'; if (on) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    $$('.fc').forEach(b => b.onclick = () => { $$('.fc').forEach(x => x.classList.toggle('on', x === b)); $$('.dq').forEach(d => d.style.display = (b.dataset.f === 'all' || d.dataset.s === b.dataset.f) ? '' : 'none'); });
    if (o.direct) $('#dt').click();
  }
  window.scrollTo(0, 0);
}
function detailsHTML(R) {
  const qs = R.questions.slice().sort((a, b) => (a.position || 0) - (b.position || 0));
  const stt = q => q.qtype === 'essay' ? 'es' : q.chosen_index == null ? 'na' : ((q.is_correct != null ? q.is_correct : q.chosen_index === q.correct_index) ? 'ok' : 'no');
  const cnt = { all: qs.length, ok: 0, no: 0, na: 0, es: 0 }; qs.forEach(q => cnt[stt(q)]++);
  const chips = [['all', 'الكل'], ['ok', '✓ صحيحة'], ['no', '✗ خاطئة'], ['na', 'بدون إجابة'], ['es', '✍️ مقالي']].filter(c => c[0] === 'all' || cnt[c[0]]).map((c, i) => '<button type="button" class="fc' + (i ? '' : ' on') + '" data-f="' + c[0] + '">' + c[1] + ' (' + cnt[c[0]] + ')</button>').join('');
  const cards = qs.map((q, i) => {
    const s = stt(q), lab = { ok: '✓ إجابة صحيحة', no: '✗ إجابة خاطئة', na: 'لم تُجب', es: q.essay_score == null ? '🕒 بانتظار التصحيح' : 'تم التصحيح' }[s];
    const earned = s === 'ok' ? q.points : s === 'es' ? (q.essay_score == null ? '—' : q.essay_score) : 0;
    const body = q.qtype === 'essay'
      ? '<div class="eb" dir="auto">' + (esc(q.essay_text || '').trim() || 'لم تكتب إجابة') + '</div>'
      : (q.options || []).map((t, j) => { const right = j === q.correct_index, mine = j === q.chosen_index; return '<div class="do ' + (right ? 'right' : mine ? 'wrong' : '') + '" dir="' + (AR.test(t) ? 'rtl' : 'ltr') + '"><b>' + LET[j] + '</b><span>' + esc(t) + '</span>' + (right ? '<i>' + (mine ? 'إجابتك ✓ صحيحة' : 'الإجابة الصحيحة') + '</i>' : mine ? '<i>إجابتك ✗</i>' : '') + '</div>'; }).join('');
    return '<div class="dq ' + s + '" data-s="' + s + '"><div class="dh"><b>السؤال ' + (i + 1) + '</b><span class="st ' + s + '">' + lab + '</span><span class="pp">' + earned + ' / ' + q.points + ' درجة</span></div><div class="dt" dir="auto">' + esc(q.question) + '</div>' + (q.image_url ? '<img class="qi" draggable="false" src="' + esc(q.image_url) + '">' : '') + body + (q.note ? '<div class="nb">💡 ملاحظة: ' + esc(q.note) + '</div>' : '') + (q.feedback ? '<div class="nb fb">👨‍🏫 تعليق المدرس: ' + esc(q.feedback) + '</div>' : '') + '</div>';
  }).join('');
  return '<div class="card"><h2 class="rt0" style="font-size:22px">تفاصيل الإجابات</h2><div class="flt" style="justify-content:center;margin-top:12px">' + chips + '</div>' + cards + '</div>';
}

if (window.currentProfile) init(); else document.addEventListener('auth-ready', init);
</script>
