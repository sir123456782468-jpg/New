<html lang="ar" dir="rtl">
<head>

<link rel="icon" href="logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
<style>
html{visibility:hidden}
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e6eaf2;--brand:#ef4444;--grad:linear-gradient(135deg,#ef4444,#ec4899);--ok:#16a34a}
[data-theme=dark]{--bg:#0a1020;--card:#121b30;--ink:#f1f5f9;--muted:#94a3b8;--line:#22304d;--brand:#f87171}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}a{color:inherit;text-decoration:none}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.hdr{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 20px;background:var(--card);border-bottom:3px solid;border-image:linear-gradient(90deg,#ef4444,#ec4899) 1}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:42px;height:42px}.brand b{display:block;font-family:'Cinzel',serif;font-size:16px;line-height:1.15}.brand small{font-size:11px;font-weight:800;color:var(--brand)}
.btn{display:inline-block;border:none;border-radius:13px;padding:11px 22px;font-weight:800;font-size:14px;cursor:pointer;background:var(--grad);color:#fff;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.g{background:none;border:2px solid var(--brand);color:var(--brand)}.btn:disabled{opacity:.6}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 50px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}.top h1{font-size:26px;font-weight:900}.top p{color:var(--muted);font-weight:600;margin-top:4px}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;min-width:220px;margin-top:6px}.bar i{display:block;height:100%;background:var(--grad);transition:width .8s}
.grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.vwrap{position:relative;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden}.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sh{position:absolute;z-index:3}.sh.t{top:0;left:0;right:0;height:62px}.sh.dr{top:0;right:0;width:70px;height:56px}.vwrap.pdf{aspect-ratio:auto;height:78vh}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:50px;font-weight:800;font-size:13.5px;cursor:pointer}.tab.on{background:var(--grad);color:#fff;border-color:transparent}.sh.b{bottom:0;right:0;width:130px;height:46px}
.wm{position:absolute;z-index:4;pointer-events:none;color:rgba(255,255,255,.55);font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.8);transition:all 2.5s ease;direction:ltr;white-space:nowrap}
.empty{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;background:var(--card);border:2px dashed var(--line);border-radius:18px;color:var(--muted);font-weight:700;line-height:2;padding:20px}.empty i{display:block;font-size:46px;font-style:normal}
.lt{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.lt h2{font-size:19px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.note{margin-top:12px;padding:14px;border-radius:14px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.5);font-weight:600;line-height:1.9;white-space:pre-wrap}
.sec{font-size:12px;font-weight:900;color:var(--brand);padding:12px 6px 6px}
.ls{max-height:70vh;overflow:auto}.li{display:flex;align-items:center;gap:10px;padding:11px 10px;margin-bottom:5px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-weight:700;font-size:14px}
.li:hover{background:var(--bg)}.li.on{background:rgba(239,68,68,.1);border-color:var(--brand)}.li .n{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--bg);font-size:13px}.li.dn .n{background:var(--ok);color:#fff}.li small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}.li .g{flex:1}
.ex{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px;font-weight:700;font-size:14px}
.join{padding:18px;text-align:center}.join p{color:var(--muted);font-weight:600;margin-bottom:10px;line-height:1.9}.join input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-weight:800;letter-spacing:2px;text-align:center;text-transform:uppercase;margin-bottom:8px;outline:none}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99}.toast{background:#1e293b;color:#fff;padding:12px 22px;border-radius:14px;font-weight:700;font-size:14px}
/* ===== كابشنات المحاضرات وصفحة المحاضرة ===== */
.lec{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:10px;border:1px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;font-weight:800;transition:.2s}
.lec:hover{border-color:var(--brand);transform:translateY(-2px)}
.lec .n{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:17px}
.lec.dn .n{background:var(--ok)}.lec .g{flex:1}.lec small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}.lec .ar{color:var(--muted);font-size:22px}
.grid.lg{grid-template-columns:340px 1fr}
.ci{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;margin-bottom:10px;border:1px solid var(--line);border-radius:16px;cursor:pointer;font-weight:800;font-size:14px}
.ci.on{border-color:var(--brand);background:rgba(239,68,68,.08)}
.ci .ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:15px}
.ci.seen .ck{border-color:var(--ok);background:var(--ok)}
.ci small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.brand div{display:none}.ls{max-height:none}.grid.lg{grid-template-columns:1fr}.grid.lg aside{order:2}}
</style>

setTimeout(() => { if (!window.currentUser) guardFail('تأخر التحقق من حسابك. حدّث الصفحة.'); }, 15000);
</script>
<script>
(function () {
    const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.documentElement.style.visibility = 'hidden';

    (async () => { try {
        const { data } = await supabaseClient.auth.getSession();
        const session = data && data.session;
        if (!session) { location.replace('signin.html'); return; }

        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', session.user.id)
            .maybeSingle();

        if (!profile) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('signup.html');
            return;
        }

        if (profile.is_blocked === true) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('signin.html?blocked=1');
            return;
        }

        const kicked = async (allowReclaim) => {
            try {
                let { data: ok, error } = await supabaseClient.rpc('session_ok');
                if (!error && ok === false && allowReclaim) {
                    await supabaseClient.rpc('claim_session');
                    ({ data: ok, error } = await supabaseClient.rpc('session_ok'));
                }
                if (!error && ok === false) {
                    await supabaseClient.auth.signOut({ scope: 'local' });   // local: مايطلّعش الجهاز الجديد
                    location.replace('signin.html?kicked=1');
                    return true;
                }
            } catch (e) {}
            return false;
        };
        const fresh = sessionStorage.getItem('just_logged_in') === '1';
        sessionStorage.removeItem('just_logged_in');
        if (await kicked(fresh)) return;
        setInterval(() => kicked(false), 15000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) kicked(false); });

        let admin = false;
        try {
            const { data: a } = await supabaseClient.rpc('is_admin');
            admin = a === true;
        } catch (e) {}
        window.isAdmin = admin;

        window.currentUser = session.user;
        window.currentProfile = profile;
        document.documentElement.style.visibility = 'visible';
        document.dispatchEvent(new CustomEvent('auth-ready'));
    } catch (e) {
        console.error('auth-guard error:', e);
        if (window.guardFail) window.guardFail('حدث خطأ أثناء التحقق من حسابك: ' + (e && e.message ? e.message : e));
        else location.replace('signin.html');
    } })();

    window.requireAdmin = function () {
        if (!window.isAdmin) { location.replace('home.html'); return false; }
        return true;
    };

    window.logout = async function () {
        await supabaseClient.auth.signOut({ scope: 'local' });
        location.replace('signin.html');
    };
})();

</script>
<script>
const CID = new URLSearchParams(location.search).get('id');
const LID = new URLSearchParams(location.search).get('l');
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
document.body.setAttribute('data-theme', localStorage.getItem('platform_theme') || 'light');
const C = { course: null, lessons: [], on: false, done: new Set(), exams: [], cur: null };
let wmTimer = null, ITEMS = [], SEEN = new Set(), FILE = null;
const toast = m => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = m; $('#toasts').appendChild(e); setTimeout(() => e.remove(), 3000); };
const canOpen = l => C.on || l.is_free;
const quizQ = async () => { const c = 'id,title,kind,time_limit_minutes,opens_at,closes_at'; let r = await supabaseClient.from('quizzes').select(c + ',lesson_id').eq('course_id', CID); if (r.error) r = await supabaseClient.from('quizzes').select(c).eq('course_id', CID); return r; };
const lecUrl = id => 'course.html?id=' + encodeURIComponent(CID) + '&l=' + encodeURIComponent(id);

async function init() {
  if (!CID) return fail('رابط الكورس غير صحيح');
  const [c, l, e, p, q, at] = await Promise.all([
    supabaseClient.from('courses').select('id,title,description,price,academic_year').eq('id', CID).maybeSingle(),
    supabaseClient.from('lessons').select('id,title,section_title,position,is_free,duration_minutes').eq('course_id', CID).order('position'),
    supabaseClient.from('enrollments').select('course_id').eq('course_id', CID),
    supabaseClient.from('lesson_progress').select('lesson_id'),
    quizQ(),
    supabaseClient.from('quiz_attempts').select('quiz_id')
  ]);
  if (!c.data) return fail('الكورس غير موجود أو غير متاح لك.');
  C.course = c.data; C.lessons = l.data || []; C.on = !!(e.data && e.data.length); C.exams = q.data || []; C.tried = new Set((at.data || []).map(x => x.quiz_id));
  const ids = new Set(C.lessons.map(x => x.id)); (p.data || []).forEach(x => { if (ids.has(x.lesson_id)) C.done.add(x.lesson_id); });
  if (LID) open(LID); else draw();
}
function fail(t) { $('#root').innerHTML = '<div class="empty"><div><i>🔒</i>' + t + '<br><br><a class="btn" href="home.html">الرئيسية</a></div></div>'; }
function pct() { return C.lessons.length ? Math.round(C.done.size / C.lessons.length * 100) : 0; }

/* ===== صفحة الكورس: كابشنات المحاضرات ===== */
function draw() {
  clearInterval(wmTimer);
  const c = C.course; let sec = null, html = '';
  C.lessons.forEach((l, i) => {
    if (l.section_title && l.section_title !== sec) { sec = l.section_title; html += '<div class="sec">' + esc(sec) + '</div>'; }
    const dn = C.done.has(l.id);
    html += '<div class="lec' + (dn ? ' dn' : '') + '" data-l="' + l.id + '"><span class="n">' + (dn ? '✓' : i + 1) + '</span><span class="g">' + esc(l.title) + '<small>' + (l.duration_minutes ? l.duration_minutes + ' دقيقة' : '') + (l.is_free && !C.on ? ' • مجاني' : '') + '</small></span>' + (canOpen(l) ? '<span class="ar">‹</span>' : '<span>🔒</span>') + '</div>';
  });
  const join = C.on ? '' : '<div class="card join" style="margin-bottom:14px"><p>🔒 لازم تشترك في الكورس عشان تفتح كل المحاضرات.</p>' + (Number(c.price) === 0 ? '<button class="btn" id="jf">اشترك مجاناً</button>' : '<input id="jc" dir="ltr" placeholder="XXXX-XXXX-XXXX" maxlength="14"><button class="btn" id="jb" style="width:100%">تفعيل بالكود</button>') + '</div>';
  const gx = C.exams.filter(x => !x.lesson_id), ex = C.on && gx.length ? '<div class="card" style="margin-top:14px"><b>📝 امتحانات الكورس</b>' + gx.map(x => { const n = Date.now(), o = x.opens_at && new Date(x.opens_at) > n, cl = x.closes_at && new Date(x.closes_at) < n, f = d => new Date(d).toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' }); return '<div class="ex"><span>' + esc(x.title) + (o ? '<br><small style="color:var(--muted)">يفتح ' + f(x.opens_at) + '</small>' : x.closes_at && !cl ? '<br><small style="color:var(--muted)">يقفل ' + f(x.closes_at) + '</small>' : '') + '</span>' + (o ? '<b style="color:var(--muted)">قريباً</b>' : cl ? '<b style="color:#dc2626">انتهى</b>' : '<a class="btn" href="quiz.html?id=' + x.id + '">ابدأ</a>') + '</div>'; }).join('') + '</div>' : '';
  $('#root').innerHTML = '<div class="top"><div><h1>' + esc(c.title) + '</h1><p>' + esc(c.description) + '</p></div><div><b id="pc">' + pct() + '% مكتمل</b><div class="bar"><i id="pb" style="width:' + pct() + '%"></i></div></div></div>'
    + join + (html || '<div class="empty" style="aspect-ratio:auto">لا توجد محاضرات بعد</div>') + ex;
  $$('.lec').forEach(el => el.onclick = () => {
    const l = C.lessons.find(x => x.id === el.dataset.l);
    if (!canOpen(l)) return toast('🔒 اشترك في الكورس الأول عشان تفتح المحاضرة');
    location.href = lecUrl(l.id);
  });
  const jf = $('#jf'); if (jf) jf.onclick = async () => { jf.disabled = true; const { error } = await supabaseClient.from('enrollments').insert({ student_id: currentUser.id, course_id: CID }); if (error && error.code !== '23505') { toast('تعذر الاشتراك'); jf.disabled = false; return; } location.reload(); };
  const jb = $('#jb'); if (jb) jb.onclick = async () => { jb.disabled = true; const { data, error } = await supabaseClient.rpc('redeem_code', { p_code: $('#jc').value.trim() }); if (error) { const m = error.message || ''; toast(m.includes('invalid_code') ? 'الكود غير صحيح' : m.includes('code_used') ? 'الكود ده اتستخدم قبل كده' : 'تعذر التفعيل'); jb.disabled = false; return; } if (data !== CID) { toast('الكود ده لكورس تاني، اتفعّل في حسابك ✅'); jb.disabled = false; return; } location.reload(); };
}

/* ===== صفحة المحاضرة ===== */
function embedOf(u) {
  let m;
  if (/youtu/.test(u) && (m = u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/))) return { src: 'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&disablekb=1&origin=' + encodeURIComponent(location.origin), yt: 1 };
  if (/drive\.google\.com/.test(u) && (m = u.match(/\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/))) return { src: 'https://drive.google.com/file/d/' + m[1] + '/preview', dr: 1 };
  if ((m = u.match(/vimeo\.com\/(\d+)/))) return { src: 'https://player.vimeo.com/video/' + m[1] };
  return /^https:\/\//.test(u) ? { src: u } : null;
}
const seenKey = () => 'seen_' + currentUser.id + '_' + C.cur;
function markSeen(k) { SEEN.add(k); try { localStorage.setItem(seenKey(), JSON.stringify(Array.from(SEEN))); } catch (e) {} }

function showItem(i) {
  const x = ITEMS[i], p = currentProfile, wm = [p.first_name, p.last_name].join(' ') + ' • ' + p.phone_number;
  $$('#itemList .ci[data-i]').forEach(b => { b.classList.toggle('on', +b.dataset.i === i); });
  clearInterval(wmTimer);
  markSeen(x.key); const row = $('#itemList .ci[data-i="' + i + '"]'); if (row) row.classList.add('seen');
  if (x.kind === 'link') { $('#player').innerHTML = '<div class="empty"><div><i>🔗</i>' + esc(x.title) + '<br><br><a class="btn" href="' + esc(x.url) + '" target="_blank" rel="noopener">فتح الرابط</a></div></div>'; return; }
  const e = embedOf(x.url);
  if (!e) { $('#player').innerHTML = '<div class="empty"><div><i>⚠️</i>الرابط غير صالح</div></div>'; return; }
  $('#player').innerHTML = '<div class="vwrap' + (x.kind === 'pdf' ? ' pdf' : '') + '" id="vw"><iframe src="' + esc(e.src) + '" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>' + (e.yt ? '<div class="sh t"></div><div class="sh b"></div>' : '') + (e.dr ? '<div class="sh dr"></div>' : '') + '<div class="wm" id="wm">' + esc(wm) + '</div></div>';
  startWm();
}

async function open(id) {
  const l = C.lessons.find(x => x.id === id); if (!l) return fail('المحاضرة غير موجودة');
  if (!canOpen(l)) { toast('🔒 اشترك في الكورس الأول عشان تفتح المحاضرة'); setTimeout(() => location.replace('course.html?id=' + encodeURIComponent(CID)), 900); return; }
  C.cur = id;
  const [it, ct] = await Promise.all([
    supabaseClient.from('lesson_items').select('id,kind,title,url,position').eq('lesson_id', id).order('position'),
    supabaseClient.from('lesson_content').select('video_url,notes,attachment_path').eq('lesson_id', id).maybeSingle()
  ]);
  ITEMS = (it.data || []).map(x => Object.assign({ key: x.id }, x)); const d = ct.data || {};
  if (d.video_url) ITEMS.unshift({ kind: 'video', title: 'فيديو المحاضرة', url: d.video_url, key: 'v' });
  FILE = d.attachment_path || null;
  try { SEEN = new Set(JSON.parse(localStorage.getItem(seenKey()) || '[]')); } catch (e) { SEEN = new Set(); }

  const idx = C.lessons.findIndex(x => x.id === id), dn = C.done.has(id);
  const nx = C.lessons.slice(idx + 1).find(canOpen), pv = C.lessons.slice(0, idx).reverse().find(canOpen);
  const lq = C.on ? C.exams.filter(x => x.lesson_id === id) : [];
  const ico = k => k === 'video' ? '🎬 ' : k === 'pdf' ? '📄 ' : '🔗 ';
  const list = ITEMS.map((x, i) => '<div class="ci' + (SEEN.has(x.key) ? ' seen' : '') + '" data-i="' + i + '"><span>' + ico(x.kind) + esc(x.title) + '</span><span class="ck">✓</span></div>').join('')
    + lq.map(x => { const n = Date.now(), o = x.opens_at && new Date(x.opens_at) > n, cl = x.closes_at && new Date(x.closes_at) < n; return '<div class="ci' + (C.tried.has(x.id) ? ' seen' : '') + '" data-q="' + x.id + '" data-s="' + (o ? 'o' : cl ? 'c' : '') + '"><span>📝 ' + esc(x.title) + (o ? '<small>لم يفتح بعد</small>' : cl && !C.tried.has(x.id) ? '<small>انتهى</small>' : '') + '</span><span class="ck">✓</span></div>'; }).join('')
    + (FILE ? '<div class="ci" data-f="1"><span>📄 ملف المحاضرة</span><span class="ck"></span></div>' : '');

  $('#root').innerHTML = '<div class="top"><div><p>' + esc(C.course.title) + '</p><h1>' + esc(l.title) + '</h1></div><a class="btn g" href="course.html?id=' + encodeURIComponent(CID) + '">← كل المحاضرات</a></div>'
    + '<div class="grid lg"><aside><div class="card"><b style="display:block;margin-bottom:12px;font-size:17px">محتوى المحاضرة</b><div id="itemList">' + (list || '<div class="empty" style="aspect-ratio:auto;border:0">لا يوجد محتوى بعد</div>') + '</div></div></aside>'
    + '<div><div id="player"></div>'
    + '<div class="acts"><button class="btn' + (dn ? ' g' : '') + '" id="dn">' + (dn ? '✓ تم الإنجاز (إلغاء)' : 'إنهاء المحاضرة ✅') + '</button></div>'
    + (d.notes ? '<div class="note">' + esc(d.notes) + '</div>' : '')
    + '<div class="pn">' + (pv ? '<a class="btn g" href="' + lecUrl(pv.id) + '">→ المحاضرة السابقة</a>' : '<span></span>') + (nx ? '<a class="btn g" href="' + lecUrl(nx.id) + '">المحاضرة التالية ←</a>' : '') + '</div></div></div>';

  $$('#itemList .ci').forEach(b => b.onclick = async () => {
    if (b.dataset.q) { if (b.dataset.s === 'o') return toast('الامتحان لسه ما فتحش'); if (b.dataset.s === 'c' && !C.tried.has(b.dataset.q)) return toast('انتهى وقت الامتحان'); location.href = 'quiz.html?id=' + encodeURIComponent(b.dataset.q); return; }
    if (b.dataset.f) { const { data: s, error } = await supabaseClient.storage.from('lesson-files').createSignedUrl(FILE, 3600); if (error) return toast('تعذر فتح الملف'); window.open(s.signedUrl, '_blank', 'noopener'); return; }
    showItem(+b.dataset.i);
  });
  $('#dn').onclick = () => toggleDone(id);
  if (ITEMS.length) showItem(0); else $('#player').innerHTML = '<div class="empty"><div><i>📭</i>لا يوجد محتوى لهذه المحاضرة بعد</div></div>';
}
function startWm() {
  clearInterval(wmTimer); const w = $('#wm'), box = $('#vw'); if (!w || !box) return;
  const mv = () => { w.style.top = (8 + Math.random() * (box.clientHeight - 50)) + 'px'; w.style.left = (8 + Math.random() * Math.max(10, box.clientWidth - w.clientWidth - 16)) + 'px'; };
  mv(); wmTimer = setInterval(mv, 4000);
}
async function toggleDone(id) {
  const b = $('#dn'); b.disabled = true;
  const q = C.done.has(id) ? supabaseClient.from('lesson_progress').delete().eq('student_id', currentUser.id).eq('lesson_id', id) : supabaseClient.from('lesson_progress').insert({ student_id: currentUser.id, lesson_id: id });
  const { error } = await q; if (error && error.code !== '23505') { toast('تعذر الحفظ'); b.disabled = false; return; }
  if (C.done.has(id)) C.done.delete(id); else { C.done.add(id); toast('أحسنت! ✅'); }
  const dn = C.done.has(id); b.disabled = false; b.className = 'btn' + (dn ? ' g' : ''); b.textContent = dn ? '✓ تم الإنجاز (إلغاء)' : 'إنهاء المحاضرة ✅';
}
// منع كليك يمين على المشغّل
document.addEventListener('contextmenu', e => { if (e.target.closest('.vwrap')) e.preventDefault(); });
if (window.currentProfile) init(); else document.addEventListener('auth-ready', init);
</script>
