<style>
html{visibility:hidden}
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e6eaf2;--brand:#ef4444;--grad:linear-gradient(135deg,#ef4444,#ec4899);--ok:#16a34a}
[data-theme=dark]{--bg:#0a1020;--card:#121b30;--ink:#f1f5f9;--muted:#94a3b8;--line:#22304d;--brand:#f87171}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}a{color:inherit;text-decoration:none}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.hdr{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 20px;background:var(--card);border-bottom:3px solid;border-image:linear-gradient(90deg,#ef4444,#ec4899) 1}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:42px;height:42px}.brand img{width:42px;height:42px;border-radius:12px;flex:none;box-shadow:0 4px 14px rgba(236,72,153,.35)}.brand b{display:block;font-family:'Cinzel',serif;font-size:16px;line-height:1.15}.brand small{font-size:11px;font-weight:800;color:var(--brand)}
.btn{display:inline-block;border:none;border-radius:13px;padding:11px 22px;font-weight:800;font-size:14px;cursor:pointer;background:var(--grad);color:#fff;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.g{background:none;border:2px solid var(--brand);color:var(--brand)}.btn:disabled{opacity:.6}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 50px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}.top h1{font-size:26px;font-weight:900}.top p{color:var(--muted);font-weight:600;margin-top:4px}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;min-width:220px;margin-top:6px}.bar i{display:block;height:100%;background:var(--grad);transition:width .8s}
.grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.vwrap{position:relative;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden}.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vwrap video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}.vwrap:fullscreen{border-radius:0;aspect-ratio:auto}
.ptl{margin-top:12px;display:grid;gap:10px}.ptb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ptb .btn{padding:7px 14px;font-size:12.5px;border-radius:50px}.ptb .sp{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:50px;padding:3px;background:var(--card)}.ptb .sp button{border:0;background:none;color:var(--ink);font:800 12.5px Cairo,sans-serif;padding:5px 10px;border-radius:50px;cursor:pointer}.ptb .sp button.on{background:var(--grad);color:#fff}
.cvb{padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}.cvb .tp{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800;font-size:13px;margin-bottom:8px}.cvb .tp em{font-style:normal;color:var(--muted)}.cvb .tr{position:relative;height:10px;border-radius:10px;background:rgba(100,116,139,.18);overflow:hidden}.cvb .tr i{position:absolute;top:0;bottom:0;background:var(--grad);border-radius:3px}.cvb.ok .tr i{background:linear-gradient(90deg,#22c55e,#16a34a)}.cvb small{display:block;margin-top:6px;color:var(--muted);font-weight:600;line-height:1.7}
.rsm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.45);font-weight:800;font-size:13.5px}
.nbx{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card)}.nbx b{font-size:14px}.nrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.nrow input{flex:1;min-width:140px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--soft,var(--bg));color:var(--ink);font:600 14px Cairo,sans-serif;outline:none;-webkit-user-select:text;user-select:text}.nrow input.tm{flex:none;width:84px;text-align:center;direction:ltr}
.nit{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}.nit .tt{flex:none;border:0;background:rgba(99,102,241,.15);color:#6366f1;border-radius:10px;padding:3px 10px;font:800 12.5px Cairo,sans-serif;cursor:pointer;direction:ltr}.nit span{flex:1;line-height:1.8;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}.nit .x{border:0;background:none;color:#dc2626;cursor:pointer;font-size:15px}
.sh{position:absolute;z-index:3}.sh.t{top:0;left:0;right:0;height:62px}.sh.dr{top:0;right:0;width:70px;height:56px}.vwrap.pdf{aspect-ratio:auto;height:78vh}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:50px;font-weight:800;font-size:13.5px;cursor:pointer}.tab.on{background:var(--grad);color:#fff;border-color:transparent}.sh.b{bottom:0;right:0;width:130px;height:46px}
.wm{position:absolute;z-index:4;pointer-events:none;color:rgba(255,255,255,.55);font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.8);transition:all 2.5s ease;direction:ltr;white-space:nowrap}
.empty{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;background:var(--card);border:2px dashed var(--line);border-radius:18px;color:var(--muted);font-weight:700;line-height:2;padding:20px}.empty i{display:block;font-size:46px;font-style:normal}
.lt{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.lt h2{font-size:19px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.note{margin-top:12px;padding:14px;border-radius:14px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.5);font-weight:600;line-height:1.9;white-space:pre-wrap}
.pcard{text-align:center;padding:34px 22px}.pcard h2{font-size:22px;margin-bottom:10px}.pcard p{color:var(--muted);font-weight:600;line-height:1.9;margin-bottom:20px}.pbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.pbtns .btn{flex:1;min-width:150px;text-align:center}.pbtns .btn.dl{background:#c9d04a;color:#1a1a1a}
.inav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.inav .btn{flex:1}.ictr{font-weight:800;color:var(--muted);flex:none}.inav .btn.go{background:var(--ok,#16a34a);color:#fff}.inav .btn[disabled]{opacity:.45;cursor:not-allowed}.ci.lk{opacity:.55}
.ch{margin:12px 0 6px;font-weight:800;font-size:14px;color:var(--muted)}
.sec{font-size:12px;font-weight:900;color:var(--brand);padding:12px 6px 6px}
.ls{max-height:70vh;overflow:auto}.li{display:flex;align-items:center;gap:10px;padding:11px 10px;margin-bottom:5px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-weight:700;font-size:14px}
.li:hover{background:var(--bg)}.li.on{background:rgba(239,68,68,.1);border-color:var(--brand)}.li .n{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--bg);font-size:13px}.li.dn .n{background:var(--ok);color:#fff}.li small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}.li .g{flex:1}
.ex{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px;font-weight:700;font-size:14px}
.join{padding:18px;text-align:center}.join p{color:var(--muted);font-weight:600;margin-bottom:10px;line-height:1.9}.pvl{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:3px;line-height:1.7;white-space:normal}.pvs{padding:16px 18px;margin-bottom:14px}.pvc{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.pvc span{background:var(--soft,var(--bg));border:1px solid var(--line);border-radius:50px;padding:5px 12px;font-size:13px;font-weight:700}.pvq{font-size:13px;font-weight:700;line-height:1.9}.pvn{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:8px}.jrow{display:flex;gap:8px;align-items:flex-start}.jrow input{flex:1;min-width:0}.jrow .btn{padding:10px 14px;font-size:20px;line-height:1.1}.jh{font-size:12.5px!important;margin:8px 0 0!important}.join input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-weight:800;letter-spacing:2px;text-align:center;text-transform:uppercase;margin-bottom:8px;outline:none}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99}.toast{background:#1e293b;color:#fff;padding:12px 22px;border-radius:14px;font-weight:700;font-size:14px}
/* ===== كابشنات المحاضرات وصفحة المحاضرة ===== */
.lec{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:10px;border:1px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;font-weight:800;transition:.2s}
.lec:hover{border-color:var(--brand);transform:translateY(-2px)}
.lec .n{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:17px}
.lec.dn .n{background:var(--ok)}.lec .g{flex:1}.lec small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}.lec .ar{color:var(--muted);font-size:22px}
.grid.lg{grid-template-columns:340px 1fr}
.ci{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;margin-bottom:10px;border:1px solid var(--line);border-radius:16px;cursor:pointer;font-weight:800;font-size:14px}
.ci.on{border-color:var(--brand);background:rgba(239,68,68,.08)}
.ci .ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:15px}
.ci.seen .ck{border-color:var(--ok);background:var(--ok)}
.ci small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.lec.ex2 .n{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.lec.ex2.dn .n{background:var(--ok)}.lec.off{opacity:.65;cursor:default}.lec .bd{font-size:12px;font-weight:800;padding:4px 11px;border-radius:50px;background:var(--bg);color:var(--muted)}
.pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.brand div{display:none}.ls{max-height:none}.grid.lg{grid-template-columns:1fr}.grid.lg aside{order:2}}
.cdesc{margin-top:8px;color:var(--muted);font-weight:600;line-height:1.95;white-space:pre-line;max-width:780px}
.idesc{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--brand);font-weight:600;line-height:1.95;white-space:pre-line;color:var(--ink)}
.idesc small{display:block;font-weight:900;color:var(--brand);margin-bottom:4px;font-size:12px}
.note small{display:block;font-weight:900;color:#b45309;margin-bottom:4px;font-size:12px}
.vcv{position:absolute;inset:0;z-index:6;background:#000;color:#fff;display:none;place-items:center;text-align:center;font-weight:800;line-height:2;padding:20px;cursor:pointer}
.vwrap.blk .vcv{display:grid}
@media print{.vwrap,#player iframe{display:none!important}}
/* بدون علامة زرقاء عند الضغط على الشعار */
.brand,.brand *,.logo,.logo *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.brand,.brand:focus,.brand:focus-visible,.brand:active,.logo:focus{outline:none;-webkit-tap-highlight-color:transparent}.brand img,.logo img{-webkit-user-drag:none;user-drag:none;outline:none}a,button{-webkit-tap-highlight-color:transparent}
</style>

<script>
(function () {
    const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.documentElement.style.visibility = 'hidden';

    (async () => { try {
        const { data } = await supabaseClient.auth.getSession();
        const session = data && data.session;
        if (!session) { location.replace('/signin.html'); return; }

        // طلبات التحقق بتتبعت كلها مرة واحدة بالتوازي (كانت ورا بعض = بطء)
        const fresh = sessionStorage.getItem('just_logged_in') === '1';
        sessionStorage.removeItem('just_logged_in');
        const kicked = async (allowReclaim) => {
            try {
                if (allowReclaim) await supabaseClient.rpc('claim_session');          // دخول جديد = الجهاز ده هو المعتمد وأي جهاز تاني بيتخرّج
                let { data: ok, error } = await supabaseClient.rpc('session_ok');
                if (!error && ok === false) {
                    await supabaseClient.auth.signOut({ scope: 'local' });   // local: مايطلّعش الجهاز الجديد
                    location.replace('/signin.html?kicked=1');
                    return true;
                }
            } catch (e) {}
            return false;
        };
        const pAdmin = supabaseClient.rpc('is_admin').then(r => r.data === true, () => false);
        const pKick = kicked(fresh);
        let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).maybeSingle();

        if (!profile) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('/signup.html');
            return;
        }

        if (profile.is_blocked === true) {                       // الإيقاف المؤقت ممكن يكون خلص: السيرفر بيفتح الحساب تلقائياً
            try { const g = await supabaseClient.rpc('account_gate'); if (g.data && g.data.blocked === false) { const r2 = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).maybeSingle(); if (r2.data) profile = r2.data; } } catch (e) {}
        }
        if (profile.is_blocked === true) {
            await supabaseClient.auth.signOut({ scope: 'local' });
            location.replace('/signin.html?blocked=1');
            return;
        }

        if (await pKick) return;
        setInterval(() => { if (!document.hidden) kicked(false); }, 45000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) kicked(false); });

        const admin = await pAdmin;
        window.isAdmin = admin;

        window.currentUser = session.user;
        window.currentProfile = profile;
        document.documentElement.style.visibility = 'visible';
        document.dispatchEvent(new CustomEvent('auth-ready'));
    } catch (e) {
        console.error('auth-guard error:', e);
        if (window.guardFail) window.guardFail('حدث خطأ أثناء التحقق من حسابك: ' + (e && e.message ? e.message : e));
        else location.replace('/signin.html');
    } })();

    window.requireAdmin = function () {
        if (!window.isAdmin) { location.replace('/home.html'); return false; }
        return true;
    };

    window.logout = async function () {
        await supabaseClient.auth.signOut({ scope: 'local' });
        location.replace('/signin.html');
    };
})();

</script>
<script>
let CID = new URLSearchParams(location.search).get('id');
let LID = new URLSearchParams(location.search).get('l');
const QP = new URLSearchParams(location.search), PM = (() => { try { return decodeURIComponent(location.pathname); } catch (e) { return location.pathname; } })().match(/^\/course\/(\d+)(?:-[^\/]*)?(?:\/lesson-(\d+))?\/?$/), CNUM = PM ? +PM[1] : (+QP.get('n') || 0), LNUM = PM && PM[2] ? +PM[2] : (+QP.get('ln') || 0);
const slug = t => String(t || '').trim().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 60);
const courseUrl = () => C.course && C.course.num ? '/course/' + C.course.num + (slug(C.course.title) ? '-' + slug(C.course.title) : '') : '/course?id=' + encodeURIComponent(CID);
const quizUrl = x => '/quiz.html?id=' + encodeURIComponent(x.id);
const courseReal = () => '/course.html?id=' + encodeURIComponent(CID);
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
document.body.setAttribute('data-theme', localStorage.getItem('platform_theme') || 'light');
const C = { course: null, lessons: [], on: false, done: new Set(), exams: [], cur: null };
let wmTimer = null, ITEMS = [], SEEN = new Set(), FILE = null;
const toast = m => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = m; $('#toasts').appendChild(e); setTimeout(() => e.remove(), 3000); };
const canOpen = l => C.on || l.is_free;
const quizQ = async () => { const c = 'id,title,kind,time_limit_minutes,opens_at,closes_at'; let r; for (const ex of [',lesson_id,is_homework,num,lesson_pos,gate,description', ',lesson_id,is_homework,num,lesson_pos,gate', ',lesson_id,is_homework,num', ',lesson_id,is_homework', ',lesson_id', '']) { r = await supabaseClient.from('quizzes').select(c + ex).eq('course_id', CID); if (!r.error) break; } return r; };
const lecUrl = id => '/course.html?id=' + encodeURIComponent(CID) + '&l=' + encodeURIComponent(id);
const lecPretty = id => { const i = C.lessons.findIndex(x => x.id === id); return courseUrl() + (i >= 0 ? '/lesson-' + (i + 1) : ''); };

async function init() {
  if (!CID && CNUM) { const r = await supabaseClient.from('courses').select('id').eq('num', CNUM).maybeSingle(); if (r.data) CID = r.data.id; }
  if (!CID) return fail('رابط الكورس غير صحيح');
  try { await supabaseClient.rpc('finalize_expired', { p_mine: true }); } catch (e) {}
  const [c, l, e, p, q, at, exR, pvR] = await Promise.all([
    (async () => { let r = await supabaseClient.from('courses').select('id,num,title,description,price,academic_year').eq('id', CID).maybeSingle(); if (r.error) r = await supabaseClient.from('courses').select('id,title,description,price,academic_year').eq('id', CID).maybeSingle(); return r; })(),
    supabaseClient.from('lessons').select('id,title,section_title,position,is_free,duration_minutes').eq('course_id', CID).order('position'),
    supabaseClient.from('enrollments').select('course_id').eq('course_id', CID),
    supabaseClient.from('lesson_progress').select('lesson_id'),
    quizQ(),
    (async () => { const r = await supabaseClient.rpc('my_attempts_basic'); if (!r.error && Array.isArray(r.data)) return { data: r.data.map(x => ({ quiz_id: x.quiz_id })) }; return supabaseClient.from('quiz_attempts').select('quiz_id'); })(),
    supabaseClient.rpc('my_quiz_extensions').then(r => (r && !r.error && Array.isArray(r.data)) ? r.data : [], () => []),
    supabaseClient.rpc('course_preview', { p_course: CID }).then(r => (r && !r.error && r.data && r.data.course) ? r.data : null, () => null)
  ]);

  const idx = C.lessons.findIndex(x => x.id === id);
  const nx = C.lessons.slice(idx + 1).find(canOpen), pv = C.lessons.slice(0, idx).reverse().find(canOpen);
  $('#root').innerHTML = '<div class="top"><div><p>' + esc(C.course.title) + '</p><h1>' + esc(l.title) + '</h1></div><a class="btn g" href="' + courseReal() + '">← كل المحاضرات</a></div>'
    + '<div class="grid lg"><aside><div class="card"><b style="display:block;margin-bottom:12px;font-size:17px">محتوى المحاضرة</b><div id="itemList"></div></div></aside>'
    + '<div><div id="player"></div>'
    + (d.notes ? '<div class="note"><small>📝 وصف المحاضرة</small>' + esc(d.notes) + '</div>' : '')
    + '<div class="pn">' + (pv ? '<a class="btn g" href="' + lecUrl(pv.id) + '">→ المحاضرة السابقة</a>' : '<span></span>') + (nx ? '<a class="btn g" href="' + lecUrl(nx.id) + '">المحاضرة التالية ←</a>' : '') + '</div></div></div>';
  drawList();
  if (LIST.length) { const f = LIST.findIndex((x, i) => !lockedAt(i)); showItem(Math.max(f, 0)); } else $('#player').innerHTML = '<div class="empty"><div><i>📭</i>لا يوجد محتوى لهذه المحاضرة بعد</div></div>';
}
/* ===== حماية الفيديو + تتبّع المشاهدة (للتقرير) ===== */
const VP = { t: null, acc: 0, sent: 0, id: null, playing: null };
function vpBox() { return $('#vw'); }
function vpPause() {
  const h5 = $('#vw video'); if (h5) { try { h5.pause(); } catch (e) {} return; }
  const f = $('#vw iframe'); if (!f || !f.contentWindow) return;
  if (PL.kind === 'bn') { plBn('pause'); return; }
  try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo', args: [] }), '*'); } catch (e) {}
}
function vpCover(on) { const b = vpBox(); if (!b) return; if (on) { b.classList.add('blk'); vpPause(); } else b.classList.remove('blk'); }
async function vpFlush() {
  if (!VP.id || VP.acc <= 0 || !SRV) { VP.acc = 0; return; }
  const n = Math.min(120, Math.floor(VP.acc)); if (n < 1) return; VP.acc -= n;   // لازم رقم صحيح (السيرفر بيستقبل integer)
  try { await supabaseClient.rpc('item_ping', { p_item: VP.id, p_seconds: n, p_open: false }); } catch (e) {}
}
function vpStart(x) {
  clearInterval(VP.t); vpFlush(); VP.id = null; VP.acc = 0; VP.sent = 0; VP.playing = null;
  if (!x || x.type !== 'item' || x.kind !== 'video' || !SRV || !/^[0-9a-f-]{36}$/i.test(String(x.id))) return;
  VP.id = x.id;
  try { supabaseClient.rpc('item_ping', { p_item: x.id, p_seconds: 0, p_open: true }); } catch (e) {}
  const f = $('#vw iframe');
  if (f) f.addEventListener('load', () => { try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); } catch (e) {} });
  VP.t = setInterval(() => { if (VP.acc >= 30) vpFlush(); }, 5000);   // الوقت بيتجمّع من حركة الفيديو الفعلية (plCovTick) مش من تركيز الصفحة
}
window.addEventListener('message', e => {
  if (e.origin !== 'https://www.youtube-nocookie.com' && e.origin !== 'https://www.youtube.com') return;
  let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
  const st = d && (d.info && typeof d.info.playerState === 'number' ? d.info.playerState : (d.event === 'onStateChange' ? d.info : null));
  if (typeof st === 'number') VP.playing = st === 1;
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { vpCover(true); vpFlush(); } });
window.addEventListener('pagehide', () => { vpFlush(); });
document.addEventListener('click', e => { if (e.target.closest('#vcv')) vpCover(false); });
document.addEventListener('keydown', e => {
  if (!vpBox()) return;
  if (e.key === 'PrintScreen' || e.key === 'Meta' || (e.metaKey && e.shiftKey) || ((e.ctrlKey || e.metaKey) && /^[ps]$/i.test(e.key))) {
    vpCover(true); try { navigator.clipboard && navigator.clipboard.writeText(' '); } catch (x) {}
    if (e.key !== 'Meta') e.preventDefault();
  }
});


/* ===== مشغّل موحّد: استكمال من حيث وقفت + سرعات + ملاحظات على وقت معيّن ===== */
const PL = { kind: '', x: null, cur: 0, dur: 0, rate: 1, saved: -99, lastAt: 0, v: null, hls: null, notes: [], cov: [], pend: [], last: null, lastWall: 0, cvAt: 0, need: 90, pct: 0, resume: null, rtries: 0, rat: 0, play: 0 };
const plOk = () => SRV && PL.x && /^[0-9a-f-]{36}$/i.test(String(PL.x.id));
const fmtT = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), c = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(c).padStart(2, '0'); };
const parseT = v => { v = String(v || '').trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)); if (!v) return null; if (/^\d+$/.test(v)) return +v; const p = v.split(':').map(Number); if (p.some(n => isNaN(n) || n < 0) || p.length > 3) return null; return p.reduce((a, n) => a * 60 + n, 0); };
function plBn(method, value) { const f = $('#vw iframe'); if (!f || !f.contentWindow) return; try { f.contentWindow.postMessage(JSON.stringify({ context: 'player.js', version: '0.0.10', method, value }), '*'); } catch (e) {} }
function plSeek(t, noPlay) {
  t = Math.max(0, t || 0); PL.last = null;
  if (PL.kind === 'h5' && PL.v) { try { PL.v.currentTime = t; if (!noPlay) PL.v.play().catch(() => {}); } catch (e) {} }
  else if (PL.kind === 'yt') { const f = $('#vw iframe'); try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [t, true] }), '*'); if (!noPlay) f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo', args: [] }), '*'); } catch (e) {} }
  else if (PL.kind === 'bn') { plBn('setCurrentTime', t); if (!noPlay) plBn('play'); }
  if (!noPlay) PL.cur = t;
}
function plRate(r) {
  PL.rate = r;
  if (PL.kind === 'h5' && PL.v) PL.v.playbackRate = r;
  else if (PL.kind === 'yt') { const f = $('#vw iframe'); try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'setPlaybackRate', args: [r] }), '*'); } catch (e) {} }
  document.querySelectorAll('.sp button').forEach(b => b.classList.toggle('on', +b.dataset.r === r));
}
function plSave(force) {
  if (!plOk() || !(PL.cur > 0)) return; const n = Date.now();
  if (!force && (n - PL.lastAt < 12000 || Math.abs(PL.cur - PL.saved) < 5)) return;
  PL.lastAt = n; PL.saved = PL.cur; try { supabaseClient.rpc('video_pos_save', { p_item: PL.x.id, p_sec: Math.floor(PL.cur), p_dur: PL.dur > 0 ? Math.floor(PL.dur) : null }).then(() => {}, () => {}); } catch (e) {}
}

/* تغطية الفيديو الفعلية: بنسجّل مدد وقت-الفيديو اللي اتسمعت فعلاً (حتى لو x2 أو أكتر)، والقفز للأمام ما بيتحسبش */
const unionLen = a => { const r = a.map(x => [x[0], x[1]]).sort((p, q) => p[0] - q[0]); let t = 0, e = -1, s0 = 0; r.forEach(x => { if (x[0] > e + 1) { t += e - s0 > 0 ? e - s0 : 0; s0 = x[0]; e = x[1]; } else if (x[1] > e) e = x[1]; }); return t + (e - s0 > 0 ? e - s0 : 0); };
function plAdd(a, b) {
  a = Math.floor(a); b = Math.ceil(b); if (!(b > a)) return;
  const l = PL.pend[PL.pend.length - 1]; if (l && a <= l[1] + 1 && a >= l[0]) { if (b > l[1]) l[1] = b; } else PL.pend.push([a, b]);
  if (PL.pend.length > 50) PL.pend = PL.pend.slice(-50);
}
function plCovTick(c) {
  const now = performance.now();
  if (PL.kind === 'h5' && PL.v && (PL.v.paused || PL.v.seeking)) { PL.last = c; PL.lastWall = now; return; }
  if (PL.last != null) { const d = c - PL.last, w = (now - PL.lastWall) / 1000; if (d > 0 && d <= w * Math.max(PL.rate, 1) * 1.5 + 1.2) { plAdd(PL.last, c); PL.play += d; if (VP.id && PL.x && VP.id === PL.x.id && document.visibilityState === 'visible') VP.acc += Math.min(w, 6); } }
  PL.last = c; PL.lastWall = now;
  if (PL.pend.length && now - PL.cvAt > 15000) plCovSave();
  if (!PL.dur && PL.play > 150 && PL.x && !isDone(PL.x)) markItemDone(PL.x);          // مدة الفيديو مش معروفة: نكمّل زي زمان بدل ما الطالب يتعطّل
  plBar();
}
async function plCovSave() {
  const x = PL.x; if (!plOk() || !PL.pend.length || !PL.dur) return;
  const send = PL.pend; PL.pend = []; PL.cvAt = performance.now();
  try {
    const { data, error } = await supabaseClient.rpc('video_cover_save', { p_item: x.id, p_ranges: send, p_dur: Math.floor(PL.dur) });
    if (!error && data === null && PL.x === x) { PL.team = true; plBar(); return; }   // حساب فريق (معاينة): السيرفر مابيسجّلش مشاهدة
    if (error || !data) { if (PL.x === x) PL.pend = send.concat(PL.pend); return; }
    if (PL.x === x) { PL.cov = data.ranges || PL.cov; PL.need = data.need_pct || PL.need; PL.pct = data.pct || 0; PL.dur = data.duration || PL.dur; plBar(); }
    if (data.done && !isDone(x)) { markItemDone(x); toast('✅ اتحسب الفيديو مكتمل'); }
  } catch (e) { if (PL.x === x) PL.pend = send.concat(PL.pend); }
}
function plBar() {
  const b = $('#cvb'); if (!b || !PL.dur) return;
  const all = PL.cov.concat(PL.pend), cov = Math.min(unionLen(all), PL.dur), p = Math.min(100, Math.round(cov * 100 / PL.dur)); PL.pct = p;
  const ok = p >= PL.need || (PL.x && isDone(PL.x));
  b.className = 'cvb' + (ok ? ' ok' : '');
  b.innerHTML = (PL.team ? '<div class="tp" style="color:#b45309"><span>👀 أنت داخل بحساب فريق (معاينة): مشاهدتك مش بتتسجّل. جرّب بحساب طالب عشان تشوف الحساب.</span></div>' : '') + '<div class="tp"><span>🎧 سمعت ' + p + '% من الفيديو</span><em>' + fmtT(cov) + ' من ' + fmtT(PL.dur) + '</em></div><div class="tr">' + all.map(r => '<i style="right:' + (r[0] * 100 / PL.dur).toFixed(2) + '%;width:' + Math.max(0.4, (r[1] - r[0]) * 100 / PL.dur).toFixed(2) + '%"></i>').join('') + '</div><small>' + (ok ? '✅ الفيديو اتحسب مكتمل.' : 'الفيديو بيتحسب مكتمل لما تسمع ' + PL.need + '% منه (حتى لو بسرعة أعلى). مجرد تقديم الفيديو مش بيتحسب.') + '</small>';
}
function plResumeTry() {
  if (PL.resume == null) return;
  if (PL.cur >= PL.resume - 3 || PL.rtries > 8) { PL.resume = null; return; }
  PL.rtries++; plSeek(PL.resume, true);
}
function plTime(c, d) { if (typeof c === 'number' && isFinite(c)) PL.cur = c; if (typeof d === 'number' && isFinite(d) && d > 0) PL.dur = d; if (PL.resume != null && performance.now() - PL.rat > 1500) { PL.rat = performance.now(); plResumeTry(); } if (plOk() && PL.kind && typeof c === 'number' && isFinite(c)) plCovTick(c); plSave(false); }
window.addEventListener('message', e => {
  let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; } if (!d) return;
  if (e.origin === 'https://iframe.mediadelivery.net' || e.origin === 'https://player.mediadelivery.net') {
    if (d.context !== 'player.js') return;
    if (d.event === 'ready') { ['timeupdate', 'play', 'pause', 'ended'].forEach(ev => plBn('addEventListener', ev)); if (PL.resume != null) plSeek(PL.resume, true); }
    else if (d.event === 'timeupdate' && d.value) plTime(+d.value.seconds, +d.value.duration);
    else if (d.event === 'pause' || d.event === 'ended') { plSave(true); plCovSave(); }
  } else if (e.origin === 'https://www.youtube-nocookie.com' || e.origin === 'https://www.youtube.com') {
    if (d.event === 'infoDelivery' && d.info) { if (typeof d.info.playbackRate === 'number' && d.info.playbackRate > 0) PL.rate = d.info.playbackRate; if (d.info.playerState === 2 || d.info.playerState === 0) { plSave(true); plCovSave(); } plTime(d.info.currentTime, d.info.duration); }
    else if (d.info && typeof d.info.currentTime === 'number') plTime(d.info.currentTime, d.info.duration);
  }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { plSave(true); plCovSave(); } });
window.addEventListener('pagehide', () => { plSave(true); plCovSave(); });
const noteHTML = () => (PL.notes.length ? PL.notes.map(n => '<div class="nit"><button type="button" class="tt" data-t="' + n.at_sec + '" title="روح للوقت ده">' + fmtT(n.at_sec) + '</button><span dir="auto">' + esc(n.body) + '</span><button type="button" class="x" data-del="' + n.id + '" title="حذف">✕</button></div>').join('') : '<div style="color:var(--muted);font-weight:600;font-size:13px;margin-top:8px">مفيش ملاحظات لسه. اكتب ملاحظتك وهتتحفظ عند الوقت اللي واقف عليه في الفيديو.</div>');
async function plStart(x, e) {
  try { plSave(true); plCovSave(); } catch (z) {}
  PL.kind = ''; PL.x = null; PL.cur = 0; PL.dur = 0; PL.rate = 1; PL.saved = -99; PL.lastAt = 0; PL.notes = []; PL.cov = []; PL.pend = []; PL.last = null; PL.cvAt = performance.now(); PL.pct = 0; PL.team = false; PL.resume = null; PL.rtries = 0; PL.rat = 0; PL.play = 0; if (PL.hls) { try { PL.hls.destroy(); } catch (z) {} PL.hls = null; }
  const box = $('#ptl'); if (!box || !e) return;
  PL.x = x; PL.kind = e.vid ? 'h5' : e.yt ? 'yt' : e.bn ? 'bn' : '';
  if (PL.kind === 'h5') {
    PL.v = $('#h5'); const v = PL.v;
    v.addEventListener('timeupdate', () => plTime(v.currentTime, v.duration)); v.addEventListener('pause', () => { plSave(true); plCovSave(); }); v.addEventListener('ended', () => { plSave(true); plCovSave(); }); v.addEventListener('ratechange', () => { PL.rate = v.playbackRate || 1; });
    if (e.hls && !v.canPlayType('application/vnd.apple.mpegurl')) {
      try { if (!window.Hls) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); if (window.Hls && Hls.isSupported()) { PL.hls = new Hls({ maxBufferLength: 30 }); PL.hls.loadSource(e.src); PL.hls.attachMedia(v); } } catch (z) {}
    } else if (e.hls) v.src = e.src;
  } else if (PL.kind === 'bn') { const f = $('#vw iframe'); if (f) f.addEventListener('load', () => { ['timeupdate', 'play', 'pause', 'ended'].forEach(ev => plBn('addEventListener', ev)); }); }
  const canRate = PL.kind === 'h5' || PL.kind === 'yt', canNote = plOk() && PL.kind !== '';
  box.innerHTML = '<div id="rsm"></div>' + (plOk() ? '<div id="cvb" class="cvb"></div>' : '') + '<div class="ptb">' + (canRate ? '<span class="sp" title="سرعة الفيديو">' + [0.75, 1, 1.25, 1.5, 2].map(r => '<button type="button" data-r="' + r + '" class="' + (r === 1 ? 'on' : '') + '">' + r + 'x</button>').join('') + '</span>' : '') + (PL.kind === 'h5' ? '<button type="button" class="btn g" id="pfs">⛶ ملء الشاشة</button>' : '') + '</div>'
    + (canNote ? '<div class="nbx"><b>📝 ملاحظاتي على الفيديو</b><div class="nrow"><input class="tm" id="ntm" placeholder="0:00" maxlength="8" title="الوقت (دقائق:ثواني)"><input id="ntx" dir="auto" maxlength="500" placeholder="اكتب ملاحظة عند الوقت ده..."><button type="button" class="btn" id="nad">➕ إضافة</button></div><div id="nls">' + noteHTML() + '</div></div>' : '');
  box.onclick = async ev => {
    const r = ev.target.closest('[data-r]'); if (r && r.closest('.sp')) return plRate(+r.dataset.r);
    const t = ev.target.closest('.nit .tt'); if (t) return plSeek(+t.dataset.t);
    const dl = ev.target.closest('[data-del]'); if (dl) { try { await supabaseClient.rpc('note_del', { p_id: dl.dataset.del }); } catch (z) {} PL.notes = PL.notes.filter(n => n.id !== dl.dataset.del); $('#nls').innerHTML = noteHTML(); return; }
    if (ev.target.closest('#pfs')) { const w = $('#vw'); try { if (document.fullscreenElement) document.exitFullscreen(); else w.requestFullscreen(); } catch (z) {} return; }
    if (ev.target.closest('#nad')) {
      const tx = $('#ntx').value.trim(); if (!tx) return toast('اكتب الملاحظة الأول');
      const tm = $('#ntm'); let sec = parseT(tm.value); if (sec == null) sec = Math.floor(PL.cur || 0);
      const { data, error } = await supabaseClient.rpc('note_add', { p_item: PL.x.id, p_sec: sec, p_body: tx });
      if (error) return toast((error.message || '').includes('too_many') ? 'وصلت للحد الأقصى من الملاحظات (100)' : 'تعذر حفظ الملاحظة');
      PL.notes.push(data); PL.notes.sort((a, b) => a.at_sec - b.at_sec); $('#ntx').value = ''; $('#nls').innerHTML = noteHTML(); toast('تم حفظ الملاحظة ✅');
    }
  };
  const tm = $('#ntm'); if (tm) { tm.onfocus = () => { if (!tm.value) tm.value = fmtT(PL.cur); }; $('#ntx').onfocus = () => { tm.value = fmtT(PL.cur); }; }
  if (plOk()) {
    try {
      const [pos, nl] = await Promise.all([supabaseClient.rpc('video_pos_get', { p_item: x.id }), supabaseClient.rpc('note_list', { p_item: x.id })]);
      if (PL.x !== x) return;
      if (!nl.error && Array.isArray(nl.data)) { PL.notes = nl.data; const n = $('#nls'); if (n) n.innerHTML = noteHTML(); }
      const p = pos.data || {};
      PL.need = p.need_pct || 90; if (Array.isArray(p.ranges)) PL.cov = p.ranges; if (p.duration > 0 && !PL.dur) PL.dur = p.duration; plBar();
      if (p.seconds > 5 && (!p.duration || p.seconds < p.duration - 15) && $('#rsm')) {
        PL.resume = p.seconds; PL.rtries = 0; PL.rat = 0;
        if (PL.kind === 'h5' && PL.v) { const go = () => { try { PL.v.currentTime = p.seconds; } catch (z) {} }; if (PL.v.readyState >= 1) go(); else PL.v.addEventListener('loadedmetadata', go, { once: true }); }
        else if (PL.kind === 'bn') plSeek(p.seconds, true);
        $('#rsm').innerHTML = '<div class="rsm">▶ كمّلنا من حيث وقفت: <b dir="ltr">' + fmtT(p.seconds) + '</b><button type="button" class="btn g" id="rno">ابدأ من الأول</button></div>';
        $('#rno').onclick = () => { PL.resume = null; plSeek(0); $('#rsm').innerHTML = ''; };
        setTimeout(() => { const r = $('#rsm'); if (r && !r.dataset.k) r.innerHTML = ''; }, 12000);
      }
    } catch (z) {}
  }
}

function startWm() {
  clearInterval(wmTimer); const w = $('#wm'), box = $('#vw'); if (!w || !box) return;
  const mv = () => { w.style.top = (8 + Math.random() * (box.clientHeight - 50)) + 'px'; w.style.left = (8 + Math.random() * Math.max(10, box.clientWidth - w.clientWidth - 16)) + 'px'; };
  mv(); wmTimer = setInterval(mv, 4000);
}
// منع كليك يمين على المشغّل
document.addEventListener('contextmenu', e => { if (e.target.closest('.vwrap')) e.preventDefault(); });
if (window.currentProfile) init(); else document.addEventListener('auth-ready', init);
