<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعيين كلمة المرور - The Leader In English</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #ef4444;
            --border-color: rgba(239, 68, 68, 0.2);
            --input-bg: rgba(255, 255, 255, 0.8);
            --error-color: #ef4444;
            --success-color: #10b981;
        }
        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 50% 20%, #0f172a 0%, #0b1120 50%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-primary: #f87171;
            --border-color: rgba(248, 113, 113, 0.25);
            --input-bg: rgba(15, 23, 42, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 25px; }
        .form-container { width: 100%; max-width: 550px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); margin: auto 0; }
        .form-title { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 25px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        label { font-size: 14px; font-weight: 700; }
        input { width: 100%; padding: 14px 16px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); font-size: 15px; outline: none; }
        input:focus { border-color: var(--accent-primary); }
        .submit-btn-wrapper { border-radius: 16px; padding: 2px; background: var(--accent-primary); margin-top: 15px; }
        .submit-btn { width: 100%; background: var(--card-bg); color: var(--text-main); border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .submit-btn:hover { background: var(--accent-primary); color: #fff; }
        footer { font-size: 11px; color: var(--text-muted); text-align: center; }
    </style>
</head>
<body data-theme="light">
    <div class="form-container">
        <h2 class="form-title">تعيين كلمة المرور وإنشاء الحساب</h2>
        
        <form id="passwordForm" onsubmit="handleFinalSignup(event)">
            <div class="input-group">
                <label>كلمة المرور (6 أحرف أو أرقام على الأقل)</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>

            <div class="input-group">
                <label>تأكيد كلمة المرور</label>
                <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور" required>
            </div>

            <div class="submit-btn-wrapper">
                <button type="submit" class="submit-btn" id="finalSubmitBtn">إتمام الحفظ وإنشاء الحساب 🚀</button>
            </div>
        </form>
    </div>

    <footer>&copy; 2026 The Leader In English. All Rights Reserved.</footer>

    <script>
        const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
        const SUPABASE_ANON_KEY = 'ضع_مفتاح_anon_الصحيح_هنا';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('platform_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
        });

        async function handleFinalSignup(event) {
            event.preventDefault();

            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const finalBtn = document.getElementById('finalSubmitBtn');

            if (pass.length < 6) {
                alert('يجب ألا تقل كلمة المرور عن 6 أحرف أو أرقام');
                return;
            }

            if (pass !== confirmPass) {
                alert('كلمتا المرور غير متطابقتين');
                return;
            }

            let tempData = JSON.parse(localStorage.getItem('temp_signup_data') || '{}');

            if (!tempData.studentEmail) {
                alert('انتهت الجلسة، يرجى إعادة إدخال البيانات من البداية.');
                window.location.href = 'signup.html';
                return;
            }

            finalBtn.disabled = true;
            finalBtn.innerText = 'جاري حفظ الحساب في القاعدة...';

            try {
                // 1. إنشاء الحساب في Supabase Auth
                const { error: authError } = await supabaseClient.auth.signUp({
                    email: tempData.studentEmail,
                    password: pass
                });

                if (authError) {
                    alert('خطأ في إنشاء الحساب: ' + authError.message);
                    finalBtn.disabled = false;
                    finalBtn.innerText = 'إتمام الحفظ وإنشاء الحساب 🚀';
                    return;
                }

                // 2. توليد جلسة فريدة للجهاز (لتفعيل حظر فتح الحساب على أكثر من جهاز)
                const deviceSessionId = 'session_' + Math.random().toString(36).substring(2) + Date.now();

                // 3. تخزين بيانات الطالب التفصيلية وجلسة الجهاز في جدول profiles
                const { error: dbError } = await supabaseClient.from('profiles').insert([
                    {
                        first_name: tempData.firstName,
                        middle_name: tempData.middleName,
                        last_name: tempData.lastName,
                        email: tempData.studentEmail,
                        student_phone: tempData.studentPhone,
                        parent_phone: tempData.parentPhone,
                        active_session: deviceSessionId
                    }
                ]);

                if (dbError) {
                    console.error(dbError);
                }

                // تنظيف البيانات المؤقتة
                localStorage.removeItem('temp_signup_data');

                alert('تم إنشاء الحساب وحفظ البيانات بنجاح! يمكنك الآن تسجيل الدخول.');
                window.location.href = 'signin.html';

            } catch (err) {
                console.error(err);
                alert('حدث خطأ غير متوقع، يرجى المحاولة مرة أخرى.');
                finalBtn.disabled = false;
                finalBtn.innerText = 'إتمام الحفظ وإنشاء الحساب 🚀';
            }
        }
    </script>
</body>
</html>
