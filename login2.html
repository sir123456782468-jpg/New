<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور | The Leader In English</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; caret-color: transparent; }
        input { caret-color: #d4af37; }
        body {
            background: #0b0f19;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 75%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f1f5f9;
        }
        #toastNotification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 14px 28px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            transition: top 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        #toastNotification.error { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 10px 30px rgba(244, 63, 94, 0.4); }
        #toastNotification.show { top: 25px; }

        .platform-card {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }
        .platform-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #60a5fa, #d4af37);
        }
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header h1 { font-size: 24px; font-weight: 900; color: #f8fafc; margin-bottom: 5px; }
        .brand-header h1 span { color: #d4af37; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        .form-control {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 1.5px solid #334155;
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-control:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }
        
        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            margin-top: 10px;
        }
        .btn-primary { background: linear-gradient(135deg, #d4af37, #aa7c11); color: #0b0f19; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-secondary { background: rgba(51, 65, 85, 0.5); color: #cbd5e1; margin-top: 8px; }
        .btn-secondary:hover { background: rgba(51, 65, 85, 0.8); color: #fff; }

        .auth-step { display: none; }
        .auth-step.active { display: block; }

        .developer-credit {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        .developer-credit span {
            color: #d4af37;
            font-weight: 700;
            background: linear-gradient(90deg, #d4af37, #fef08a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div id="toastNotification">
        <i class="fa-solid fa-circle-check" id="toastIcon"></i>
        <span id="toastText">تم بنجاح!</span>
    </div>

    <div class="platform-card">
        <div class="brand-header">
            <h1>The Leader <span>In English</span></h1>
            <p id="pageSubtitle" style="font-size: 13px; color: #94a3b8;">استعادة كلمة المرور عبر البريد</p>
        </div>

        <!-- الخطوة الأولى: إدخال الإيميل لإرسال الكود -->
        <div id="stepEmail" class="auth-step active">
            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> أدخل بريدك المسجل</label>
                <input type="email" id="resetEmail" class="form-control" placeholder="example@gmail.com">
            </div>
            <button type="button" class="btn btn-primary" id="sendCodeBtn" onclick="sendResetCode()">إرسال كود التحقق <i class="fa-solid fa-paper-plane"></i></button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='login.html'">العودة لتسجيل الدخول</button>
        </div>

        <!-- الخطوة الثانية: إدخال الكود والباسورد الجديد -->
        <div id="stepNewPassword" class="auth-step">
            <div class="form-group">
                <label><i class="fa-solid fa-shield-keyhole"></i> كود التحقق (6 أرقام)</label>
                <input type="text" id="verificationCodeInput" class="form-control" placeholder="أدخل الكود المرسل لبريدك" maxlength="6">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> كلمة المرور الجديدة</label>
                <input type="password" id="newPasswordInput" class="form-control" placeholder="أدخل الباسورد الجديد">
            </div>
            <button type="button" class="btn btn-primary" onclick="verifyAndResetPassword()">تغيير كلمة المرور <i class="fa-solid fa-check"></i></button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='login.html'">إلغاء</button>
        </div>

    </div>

    <div class="developer-credit">
        Developed with <i class="fa-solid fa-heart" style="color: #f43f5e;"></i> by <span>Mohamed Sherif Khafagy</span>
    </div>

    <script>
        // تهيئة EmailJS
        (function(){
            emailjs.init("gU8jVHuVqdaZT6CD1");
        })();

        let generatedCode = null;
        let targetEmailForReset = null;

        function showToast(message, isError = false) {
            const toast = document.getElementById('toastNotification');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastText').innerText = message;
            if(isError) {
                toast.classList.add('error');
                icon.className = "fa-solid fa-triangle-exclamation";
            } else {
                toast.classList.remove('error');
                icon.className = "fa-solid fa-circle-check";
            }
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        function switchStep(stepId, subtitleText) {
            document.querySelectorAll('.auth-step').forEach(step => step.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
            document.getElementById('pageSubtitle').innerText = subtitleText;
        }

        // إرسال الكود باستخدام التمبلت الجديد Template_5lj7i0g
        function sendResetCode() {
            let email = document.getElementById('resetEmail').value.trim();
            if(!email) {
                showToast("الرجاء إدخال البريد الإلكتروني!", true);
                return;
            }

            let users = JSON.parse(localStorage.getItem('leader_users') || '[]');
            let user = users.find(u => u.email === email);

            if(!user) {
                showToast("هذا البريد غير مسجل في المنصة!", true);
                return;
            }

            targetEmailForReset = email;
            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

            let btn = document.getElementById('sendCodeBtn');
            btn.innerHTML = 'جاري الإرسال... <i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;

            let templateParams = {
                to_email: email,
                to_name: user.fullName || 'طالبنا العزيز',
                reset_code: generatedCode
            };

            emailjs.send("service_seljmns", "Template_5lj7i0g", templateParams)
                .then(function(response) {
                    showToast("تم إرسال كود التحقق لبريدك بنجاح!");
                    btn.innerHTML = 'إرسال كود التحقق <i class="fa-solid fa-paper-plane"></i>';
                    btn.disabled = false;
                    switchStep('stepNewPassword', 'تعيين كلمة مرور جديدة');
                }, function(error) {
                    console.error('EmailJS Error:', error);
                    showToast("حدث خطأ في الإرسال، تأكد من الاتصال.", true);
                    btn.innerHTML = 'إرسال كود التحقق <i class="fa-solid fa-paper-plane"></i>';
                    btn.disabled = false;
                });
        }

        function verifyAndResetPassword() {
            let enteredCode = document.getElementById('verificationCodeInput').value.trim();
            let newPassword = document.getElementById('newPasswordInput').value;

            if(!enteredCode || !newPassword) {
                showToast("الرجاء إدخال الكود وكلمة المرور الجديدة!", true);
                return;
            }

            if(enteredCode !== generatedCode) {
                showToast("كود التحقق غير صحيح!", true);
                return;
            }

            let users = JSON.parse(localStorage.getItem('leader_users') || '[]');
            let userIndex = users.findIndex(u => u.email === targetEmailForReset);

            if(userIndex !== -1) {
                users[userIndex].password = newPassword;
                localStorage.setItem('leader_users', JSON.stringify(users));
                showToast("تم تغيير كلمة المرور بنجاح! جاري تحويلك...");
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                showToast("حدث خطأ ما، حاول مجدداً.", true);
            }
        }
    </script>
</body>
</html>
