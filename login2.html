<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور الآمنة | The Leader In English</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; caret-color: transparent; }
        input { caret-color: #d4af37; }
        body {
            background: #0b0f19;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 75%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f1f5f9;
        }
        #toastNotification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 14px 28px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            transition: top 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        #toastNotification.error { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 10px 30px rgba(244, 63, 94, 0.4); }
        #toastNotification.show { top: 25px; }

        .platform-card {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }
        .platform-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #25D366, #d4af37);
        }
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header h1 { font-size: 24px; font-weight: 900; color: #f8fafc; margin-bottom: 5px; }
        .brand-header h1 span { color: #d4af37; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .form-control {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 1.5px solid #334155;
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-control:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }
        
        .password-toggle {
            position: absolute;
            left: 14px;
            cursor: pointer;
            color: #94a3b8;
            font-size: 16px;
            transition: color 0.3s;
            z-index: 10;
            caret-color: transparent;
        }
        .password-toggle:hover { color: #d4af37; }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .btn-primary { background: linear-gradient(135deg, #d4af37, #aa7c11); color: #0b0f19; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        
        .btn-whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); display: none; }
        .btn-whatsapp:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .btn-secondary { background: rgba(51, 65, 85, 0.5); color: #cbd5e1; margin-top: 8px; }
        .btn-secondary:hover { background: rgba(51, 65, 85, 0.8); color: #fff; }

        .auth-step { display: none; }
        .auth-step.active { display: block; }

        .developer-credit {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        .developer-credit span {
            color: #d4af37;
            font-weight: 700;
            background: linear-gradient(90deg, #d4af37, #fef08a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div id="toastNotification">
        <i class="fa-solid fa-circle-check" id="toastIcon"></i>
        <span id="toastText">تم بنجاح!</span>
    </div>

    <div class="platform-card">
        <div class="brand-header">
            <h1>The Leader <span>In English</span></h1>
            <p id="pageSubtitle" style="font-size: 13px; color: #94a3b8;">استعادة كلمة المرور برابط آمن</p>
        </div>

        <!-- الخطوة الأولى: إدخال الموبايل لتوليد الرابط الآمن -->
        <div id="stepPhone" class="auth-step active">
            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> أدخل رقم الموبايل المسجل</label>
                <input type="tel" id="resetPhone" class="form-control" placeholder="01012345678">
            </div>
            <button type="button" class="btn btn-primary" id="generateBtn">إنشاء الرابط الآمن عبر الواتساب <i class="fa-brands fa-whatsapp"></i></button>
            <a href="#" id="whatsappDirectBtn" class="btn btn-whatsapp" target="_blank">اضغط هنا لإرسال الرابط الآمن عبر الواتساب <i class="fa-brands fa-whatsapp"></i></a>
            <button type="button" class="btn btn-secondary" id="backToLoginBtn">العودة لتسجيل الدخول</button>
        </div>

        <!-- الخطوة الثانية: تعيين كلمة المرور الجديدة بعد فتح الرابط الآمن -->
        <div id="stepNewPassword" class="auth-step">
            <div class="form-group" style="text-align: center; margin-bottom: 20px; color: #10b981; font-size: 14px; font-weight: 700;">
                <i class="fa-solid fa-shield-check"></i> تم التحقق من الرابط بنجاح! أدخل كلمة المرور الجديدة.
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> كلمة المرور الجديدة</label>
                <div class="input-wrapper">
                    <input type="password" id="newPasswordInput" class="form-control" placeholder="أدخل الباسورد الجديد">
                    <i class="fa-solid fa-eye password-toggle" id="togglePassword"></i>
                </div>
            </div>
            <button type="button" class="btn btn-primary" id="updatePasswordBtn">حفظ كلمة المرور الجديدة <i class="fa-solid fa-check"></i></button>
        </div>

    </div>

    <div class="developer-credit">
        Developed with <i class="fa-solid fa-heart" style="color: #f43f5e;"></i> by <span>Mohamed Sherif Khafagy</span>
    </div>

    <script>
        let currentResetPhone = null;

        function showToast(message, isError = false) {
            const toast = document.getElementById('toastNotification');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastText').innerText = message;
            if(isError) {
                toast.classList.add('error');
                icon.className = "fa-solid fa-triangle-exclamation";
            } else {
                toast.classList.remove('error');
                icon.className = "fa-solid fa-circle-check";
            }
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        function switchStep(stepId, subtitleText) {
            document.querySelectorAll('.auth-step').forEach(step => step.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
            document.getElementById('pageSubtitle').innerText = subtitleText;
        }

        // ربط الأحداث بالكود بشكل آمن لتفادي أي عطل في الأزرار
        document.addEventListener('DOMContentLoaded', function() {
            
            // زر إظهار/إخفاء الباسورد
            const togglePassword = document.getElementById('togglePassword');
            if(togglePassword) {
                togglePassword.addEventListener('click', function() {
                    const passwordInput = document.getElementById('newPasswordInput');
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        togglePassword.classList.remove('fa-eye');
                        togglePassword.classList.add('fa-eye-slash');
                    } else {
                        passwordInput.type = 'password';
                        togglePassword.classList.remove('fa-eye-slash');
                        togglePassword.classList.add('fa-eye');
                    }
                });
            }

            // زر العودة لتسجيل الدخول
            const backBtn = document.getElementById('backToLoginBtn');
            if(backBtn) {
                backBtn.addEventListener('click', function() {
                    window.location.href = 'login.html';
                });
            }

            // فحص الرابط عند تحميل الصفحة (Token Check)
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const phone = urlParams.get('phone');

            if (token && phone) {
                let secureLinks = JSON.parse(localStorage.getItem('leader_secure_links') || '{}');
                let linkData = secureLinks[phone];

                if (!linkData || linkData.token !== token || linkData.used || Date.now() > linkData.expiresAt) {
                    showToast("هذا الرابط غير صالح أو تم استخدامه من قبل أو انتهت صلاحيته!", true);
                    setTimeout(() => { window.location.href = 'login.html'; }, 3500);
                    return;
                }

                currentResetPhone = phone;
                linkData.used = true;
                localStorage.setItem('leader_secure_links', JSON.stringify(secureLinks));
                switchStep('stepNewPassword', 'إنشاء كلمة مرور جديدة');
            }

            // زر توليد الرابط الآمن
            const generateBtn = document.getElementById('generateBtn');
            if(generateBtn) {
                generateBtn.addEventListener('click', function() {
                    let phoneInput = document.getElementById('resetPhone');
                    let phone = phoneInput ? phoneInput.value.trim() : '';

                    if(!phone) {
                        showToast("الرجاء إدخال رقم الموبايل!", true);
                        return;
                    }

                    // للتسهيل أثناء التجربة: لو مفيش مستخدمين متسجلين في الداتا، هنسجل الرقم ده مؤقتاً عشان التيست يشتغل معاك فوراً
                    let users = JSON.parse(localStorage.getItem('leader_users') || '[]');
                    if (users.length === 0) {
                        users = JSON.parse(localStorage.getItem('users') || '[]');
                    }

                    let user = users.find(u => u.phone === phone || u.mobile === phone);

                    if(!user) {
                        // لو الرقم مش مسجل، هنبهه بس هنسمح بالتجربة لو حابب، أو نطلعه رسالة واضحة
                        showToast("رقم الموبايل غير مسجل، تأكد من الرقم!", true);
                        return;
                    }

                    let uniqueToken = Math.random().toString(36).substring(2) + Math.random().toString(36).substring(2);
                    let expiresAt = Date.now() + (5 * 60 * 1000);

                    let secureLinks = JSON.parse(localStorage.getItem('leader_secure_links') || '{}');
                    secureLinks[phone] = {
                        token: uniqueToken,
                        expiresAt: expiresAt,
                        used: false
                    };
                    localStorage.setItem('leader_secure_links', JSON.stringify(secureLinks));

                    let currentBaseUrl = window.location.href.split('?')[0];
                    let secureResetLink = `${currentBaseUrl}?token=${uniqueToken}&phone=${phone}`;

                    let studentName = user.fullName || user.name || 'طالبنا العزيز';
                    let message = `مرحباً ${studentName}، رابط الاستخدام الواحد الآمن لتغيير كلمة المرور الخاصة بك:\n${secureResetLink}\n\n⚠️ (هذا الرابط صالح لمدة 5 دقائق فقط).`;
                    
                    let formattedPhone = phone;
                    if (formattedPhone.startsWith('01')) {
                        formattedPhone = '2' + formattedPhone;
                    }

                    let whatsappUrl = `https://wa.me/${formattedPhone}?text=${encodeURIComponent(message)}`;

                    let waBtn = document.getElementById('whatsappDirectBtn');
                    if(waBtn) {
                        waBtn.href = whatsappUrl;
                        waBtn.style.display = 'block';
                    }

                    showToast("تم إنشاء الرابط الآمن بنجاح! اضغط على زر الواتساب لإرساله.");
                });
            }

            // زر حفظ كلمة المرور الجديدة
            const updatePasswordBtn = document.getElementById('updatePasswordBtn');
            if(updatePasswordBtn) {
                updatePasswordBtn.addEventListener('click', function() {
                    let newPasswordInput = document.getElementById('newPasswordInput');
                    let newPassword = newPasswordInput ? newPasswordInput.value.trim() : '';

                    if(!newPassword) {
                        showToast("الرجاء إدخال كلمة المرور الجديدة!", true);
                        return;
                    }

                    let keyToUpdate = localStorage.getItem('leader_users') ? 'leader_users' : 'users';
                    let users = JSON.parse(localStorage.getItem(keyToUpdate) || '[]');
                    let userIndex = users.findIndex(u => u.phone === currentResetPhone || u.mobile === currentResetPhone);

                    if(userIndex !== -1) {
                        users[userIndex].password = newPassword;
                        localStorage.setItem(keyToUpdate, JSON.stringify(users));
                        
                        showToast("تم تغيير كلمة المرور بنجاح! جاري تحويلك...");
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);
                    } else {
                        showToast("حدث خطأ ما، حاول مجدداً.", true);
                    }
                });
            }

        });
    </script>
</body>
</html>
